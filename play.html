/* ============ Actions ============ */
function pickStarter(species){ startPick.starter = species; render(); }
function pickTown(nodeId){ startPick.town = nodeId; render(); }
function toggleChallengeMode(key){ challengeModes[key] = !challengeModes[key]; render(); }
function confirmChallengeModes(){ view = 'start'; render(); }

function beginAdventure(){
  if(!startPick.starter || !startPick.town) return;
  const sp = startPick.starter;
  const types = DATA.types[sp] || ['Normal', null];
  const base = DATA.dice[sp] || [0,0,0,0,0,0];
  const ev = [0,0,0,0,0,0];
  for(let i=0;i<2;i++){ ev[rand(6)-1] += 1; }
  saveGamePokemonList([]); // a new game starts with a clean team, no carryover from a previous playthrough
  addGamePokemon({
    name: sp,
    t1: types[0] || null,
    t2: types[1] || null,
    atk: types[0], // starters always get STAB on their primary type, to make early encounters easier
    base: base,
    ev: ev,
    catchLevel: ev.reduce((a,b)=>a+b,0),
    note: 'Starter',
  });
  gameState = {
    started:true, region: startPick.region, starterSpecies: sp, currentNodeId: startPick.town,
    defeatedGymLeaders: [], turnCount: 0, eliteFourProgress: null, eliteFourTeamIds: [],
    customRegionLabel: startPick.region === 'custom' ? DATA.regionLabel : undefined,
    challengeModes: Object.assign({}, challengeModes),
    championDefeated:false, teamBuilderExported:false, championshipTeam:null,
  };
  saveGameState();
  view = 'board';
  render();
}

function rollMovement(){
  if(shouldPromptTeamBuilder()){
    teamBuilderSelectedIds = [];
    view = 'teamBuilderExport';
    render();
    return;
  }
  const n = rand(6);
  movement = { total:n };
  gameState.turnCount = (gameState.turnCount || 0) + 1;
  saveGameState();
  view = 'moving';
  render();
}
function toggleTeamBuilderMon(id){
  const idx = teamBuilderSelectedIds.indexOf(id);
  if(idx !== -1) teamBuilderSelectedIds.splice(idx,1);
  else if(teamBuilderSelectedIds.length < teamBuilderMaxSelectable()) teamBuilderSelectedIds.push(id);
  render();
}
function confirmTeamBuilderExport(){
  gameState.teamBuilderExported = true;
  saveGameState();
  teamBuilderSelectedIds = [];
  view = 'board';
  render();
}
function resolveLanding(nodeId, forfeited){
  const node = nodesById[nodeId];
  pendingForfeit = forfeited;
  movement = null;
  if(node.kind === 'dungeon'){
    beginEncounter('wild', { locationId: node.locationId });
  } else if(node.kind === 'route'){
    view = 'routeRoll';
    render();
  } else {
    view = 'townMenu';
    render();
  }
}

function townAction(choice){
  const node = nodesById[gameState.currentNodeId];
  if(choice === 'dungeon'){
    beginEncounter('wild', { locationId: node.dungeonLocationId });
  } else if(choice === 'evolveItem'){
    pendingEvolveOptions = evolveOptionsForTown(node);
    if(!pendingEvolveOptions.length) return; // shouldn't be reachable via the UI, but don't allow it even so
    view = 'evolveChoice';
    render();
  } else if(choice === 'gym'){
    if(gameState.defeatedGymLeaders.includes(node.gymLeader)) return; // already beaten -- shouldn't be reachable via the UI, but don't allow it even so
    beginEncounter('gym', { leaderName: node.gymLeader });
  } else if(choice === 'eliteFour'){
    if(gameState.defeatedGymLeaders.length < gymCount()) return; // shouldn't be reachable via the UI, but don't allow it even so
    gameState.eliteFourTeamIds = []; // a fresh run always starts with a fresh choice of 6
    saveGameState();
    beginEliteFourChallenge(0);
  }
}

function chooseEvolveOption(monId, targetSpecies){
  const list = loadGamePokemon();
  const entry = list.find(m=>m.id===monId);
  if(!entry) return;
  if(!confirm('Evolve '+entry.name+' into '+targetSpecies+'?')) return;
  entry.name = targetSpecies;
  const types = DATA.types[targetSpecies] || [null, null];
  entry.t1 = types[0] || null;
  entry.t2 = types[1] || null;
  entry.base = (DATA.dice[targetSpecies] || [0,0,0,0,0,0]).slice();
  const rolledAtk = randomAttackType(entry.t1, entry.t2);
  if(rolledAtk !== entry.atk && confirm('Change '+entry.name+'\'s attack type from '+entry.atk+' to '+rolledAtk+'?')){
    entry.atk = rolledAtk;
  }
  saveGamePokemonList(list);
  pendingMessage = entry.name + ' evolved!';
  pendingTmOffer = false;
  view = 'message';
  render();
}
function backToTownMenu(){
  view = 'townMenu';
  render();
}

function rollRoute(adjust){
  const node = nodesById[gameState.currentNodeId];
  const raw = rand(6);
  const result = raw + adjust;
  if(result <= 3){
    beginEncounter('wild', { locationId: node.locationId });
  } else {
    beginEncounter('trainer', {});
  }
}

function beginEncounter(type, ctx){
  let opponents, extra = {};
  if(type === 'wild'){
    opponents = [rollWildEncounter(ctx.locationId)];
  } else if(type === 'trainer'){
    const r = rollTrainerTeam();
    opponents = r.team;
    extra.className = r.className;
    extra.trainerName = r.trainerName;
  } else {
    const r = rollGymTeam(ctx.leaderName);
    opponents = r.team;
    extra.gymLeaderName = ctx.leaderName;
  }
  encounter = Object.assign({
    type, opponents, oppIdx:0,
    currentPlayerId: null,
    lostIds: new Set(),
    sentOutIds: [],
    currentOpponentParticipants: [],
    xpRecipientIds: new Set(), // who to check for level-up evolution once the WHOLE encounter ends, not mid-battle
    log: [],
  }, extra);
  view = 'encounter';
  render();
}

function beginEliteFourChallenge(startIndex){
  const members = eliteFourMembers();
  const opponents = [];
  const memberBoundaries = [];
  for(let mi=startIndex; mi<members.length; mi++){
    memberBoundaries.push({ memberIndex: mi, startAt: opponents.length, name: members[mi].name, isChampion: mi === members.length-1 });
    rollEliteFourMemberTeam(members[mi]).forEach(o=>opponents.push(o));
  }
  encounter = {
    type: 'elite4',
    opponents, oppIdx: 0,
    currentPlayerId: null,
    lostIds: new Set(), // unused for elite4 -- per-member "revival" tracking lives in currentMemberLostIds instead
    sentOutIds: (gameState.eliteFourTeamIds || []).slice(),
    currentMemberLostIds: new Set(), // reset only when moving to a NEW member -- who has already lost within this member's battle
    currentOpponentParticipants: [],
    xpRecipientIds: new Set(), // no XP or evolution in the Elite Four
    memberBoundaries,
    log: [],
  };
  gameState.eliteFourProgress = startIndex;
  saveGameState();
  view = 'encounter';
  render();
}

function currentEliteFourMemberLabel(e){
  let b = e.memberBoundaries[0];
  e.memberBoundaries.forEach(x=>{ if(e.oppIdx >= x.startAt) b = x; });
  return b.isChampion ? ('Champion '+b.name) : b.name;
}
function currentEliteFourMemberRange(e){
  let idx = 0;
  e.memberBoundaries.forEach((x,i)=>{ if(e.oppIdx >= x.startAt) idx = i; });
  const start = e.memberBoundaries[idx].startAt;
  const end = (idx+1 < e.memberBoundaries.length) ? e.memberBoundaries[idx+1].startAt : e.opponents.length;
  return { start, end };
}
// Up to 6 distinct Pokemon total for the whole Elite Four + Champion run (locked once 6 have
// been used); within that pool, a Pokemon that has already lost within the CURRENT member's
// battle is unavailable for the rest of that battle, but is revived again for the next member.
function eliteFourExcludeIds(e){
  const pool = gameState.eliteFourTeamIds || [];
  const excl = new Set(e.currentMemberLostIds);
  if(pool.length >= 6){
    loadGamePokemon().forEach(m=>{ if(!pool.includes(m.id)) excl.add(m.id); });
  }
  return excl;
}

function continueEliteFour(){
  if(!encounter) return;
  view = 'encounter';
  render();
}
function resumeEliteFour(){
  if(gameState.eliteFourProgress == null) return;
  beginEliteFourChallenge(gameState.eliteFourProgress);
}
function leaveEliteFourTown(){
  const townName = nodeDisplayName(nodesById[gameState.currentNodeId]);
  if(!confirm('Leave '+townName+'? This resets your Elite Four progress and your locked-in team of 6.')) return;
  gameState.eliteFourProgress = null;
  gameState.eliteFourTeamIds = [];
  saveGameState();
  rollMovement();
}

function pickPlayerMon(id){
  encounter.currentPlayerId = id;
  if(!encounter.sentOutIds.includes(id)) encounter.sentOutIds.push(id);
  if(encounter.type === 'elite4'){
    if(!gameState.eliteFourTeamIds) gameState.eliteFourTeamIds = [];
    if(!gameState.eliteFourTeamIds.includes(id) && gameState.eliteFourTeamIds.length < 6){
      gameState.eliteFourTeamIds.push(id);
      saveGameState();
    }
  }
  render();
}

async function fight(){
  if(rollingBattle) return; // guard against double-clicks mid-animation
  const e = encounter;
  const entry = loadGamePokemon().find(x=>x.id===e.currentPlayerId);
  const opp = e.opponents[e.oppIdx];
  e.currentOpponentParticipants.push(e.currentPlayerId);

  const statsA = entry.base.map((b,i)=>b+entry.ev[i]);
  const statsB = opp.statsArr;
  const typesA = [entry.t1, entry.t2], typesB = opp.types;
  const atkA = entry.atk, atkB = opp.atk;
  // Dice count/keep-best-or-worst depends on how effective each side's OWN attack
  // type is against the OTHER side's defending types -- not against its own.
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? 1 : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? 1 : 0;
  // STAB is baked into every die face shown (not just the kept one) so the two sides'
  // dice can be compared face-to-face -- the cycling animation shows the same
  // STAB-inclusive numbers the dice will actually land on, not a mismatched raw value.
  const displayStatsA = stabA ? statsA.map(v=>v+stabA) : statsA;
  const displayStatsB = stabB ? statsB.map(v=>v+stabB) : statsB;

  // The dice you see ARE the actual roll -- animate real rounds (including real ties,
  // paused on-screen so the player can see what happened) rather than faking a replay.
  let rA, rB, roundNum = 0, animate = true;
  do {
    roundNum++;
    rA = rollSide(statsA, cfgA, stabA);
    rB = rollSide(statsB, cfgB, stabB);
    if(animate){
      rollingBattle = { nA: cfgA.n, nB: cfgB.n, statsA: displayStatsA, statsB: displayStatsB };
      render();
      await Promise.all([
        ...rA.picks.map((face,i)=>tumble(document.getElementById('battleDieA'+i), 600, displayStatsA, face)),
        ...rB.picks.map((face,i)=>tumble(document.getElementById('battleDieB'+i), 600, displayStatsB, face)),
      ]);
      const dieA = document.getElementById('battleDieA'+rA.keptIdx);
      const dieB = document.getElementById('battleDieB'+rB.keptIdx);
      if(dieA) dieA.classList.add('die-kept');
      if(dieB) dieB.classList.add('die-kept');
      await sleep(600);
      if(roundNum >= 8) animate = false; // an extreme tie streak stops animating and fast-forwards
    }
  } while(rA.final === rB.final && roundNum < 300);
  rollingBattle = null;

  const result = (rA.final === rB.final)
    ? { winner: 'tie', finalA: null, finalB: null }
    : { winner: rA.final > rB.final ? 'A' : 'B', finalA: rA.final, finalB: rB.final };

  if(result.winner === 'A'){
    e.log.push(entry.name+' ('+result.finalA+') defeated '+opp.species+' ('+result.finalB+')!');
    const isLastOpponent = (e.oppIdx === e.opponents.length - 1);

    if(e.type === 'elite4'){
      const memberRange = currentEliteFourMemberRange(e); // still the range of the member just being fought
      const isLastOfMember = (e.oppIdx === memberRange.end - 1);
      const beatenLabel = currentEliteFourMemberLabel(e);
      if(isLastOpponent){
        const team = (gameState.eliteFourTeamIds || [])
          .map(id => loadGamePokemon().find(m=>m.id===id))
          .filter(Boolean);
        pendingMessage = 'You have become the '+regionLabelFor(gameState)+' champion! Congratulations!' +
          '<div class="field-label" style="margin-top:14px;">Your Championship Team</div>' +
          team.map(m=>monStatCardHtml(m)).join('');
        gameState.eliteFourProgress = null;
        gameState.eliteFourTeamIds = [];
        gameState.championDefeated = true;
        // Frozen forever at this moment -- a deep copy, not a live reference, so
        // later catches/evolutions to the same Pokemon don't rewrite history. If
        // the Champion is beaten again on a later run, this simply overwrites
        // with the newest win.
        gameState.championshipTeam = JSON.parse(JSON.stringify(team));
        saveGameState();
        pendingTmOffer = false;
        view = 'message';
        encounter = null;
      } else {
        e.oppIdx += 1;
        e.currentOpponentParticipants = [];
        if(isLastOfMember){
          // Sweeping a member's whole team is its own separate battle -- Pokemon are only
          // revived here, at the member boundary, never mid-battle against the same member.
          e.currentMemberLostIds = new Set();
          // Acknowledge it, let the player pick a fresh lead for the next member instead of
          // auto-continuing with whoever happened to land the last hit, at no extra turn cost.
          e.currentPlayerId = null;
          pendingMessage = 'You defeated '+beatenLabel+'\'s whole team!';
          view = 'elite4Ack';
        }
      }
      render();
      return;
    }

    if(e.type === 'wild'){
      e.pendingXP = { total: statTotal(opp.statsArr), participants: e.currentOpponentParticipants.slice(), highIdx: opp.highIdx };
      view = 'catchOrDefeat';
      render();
      return;
    }
    const xpTotal = Math.floor(statTotal(opp.statsArr) * 1.5);
    const splits = splitXP(xpTotal, e.currentOpponentParticipants);
    const list = loadGamePokemon();
    splits.forEach(({id, xp})=>{
      const mon = list.find(x=>x.id===id);
      if(!mon) return;
      // A Pokemon that already leveled up once earlier in THIS battle (against a
      // previous opponent on the same team) can't do it again -- xpRecipientIds
      // doubles as that "already used this battle's one level-up" marker, since
      // it's only ever populated exactly when a level-up happens.
      const leveledUp = grantXP(mon, xp, opp.highIdx, !e.xpRecipientIds.has(id));
      e.log.push(mon.name+' gained '+xp+' XP.');
      // Evolution check deferred until the whole encounter ends, not mid-battle --
      // and only for mons that actually leveled up at some point in it (a mon
      // that gains XP across several opponents without ever leveling must not
      // get checked just because it received XP at all).
      if(leveledUp) e.xpRecipientIds.add(id);
    });
    saveGamePokemonList(list);

    e.oppIdx += 1;
    e.currentOpponentParticipants = [];
    if(isLastOpponent){
      if(e.type === 'gym'){
        if(!gameState.defeatedGymLeaders.includes(e.gymLeaderName)){
          gameState.defeatedGymLeaders.push(e.gymLeaderName);
          saveGameState();
        }
        pendingMessage = 'You defeated '+e.gymLeaderName+' and earned a badge!';
        pendingTmOffer = true;
      } else {
        pendingMessage = 'You defeated the trainer\'s whole team!';
        pendingTmOffer = false;
      }
      pendingMessage += resolveDeferredEvolutions(e.xpRecipientIds);
      view = 'message';
      encounter = null;
    }
    render();
    return;
  }

  // Loss
  e.log.push(entry.name+' ('+result.finalA+') lost to '+opp.species+' ('+result.finalB+').');

  if(e.type === 'elite4'){
    e.currentMemberLostIds.add(e.currentPlayerId);
    e.currentPlayerId = null;
    const stillAvailable = loadGamePokemon().filter(m=>!eliteFourExcludeIds(e).has(m.id));
    if(stillAvailable.length === 0){
      const label = currentEliteFourMemberLabel(e);
      let memberIdx = 0;
      e.memberBoundaries.forEach(b=>{ if(e.oppIdx >= b.startAt) memberIdx = b.memberIndex; });
      gameState.eliteFourProgress = memberIdx;
      gameState.turnCount = (gameState.turnCount || 0) + 1; // resuming at the member they lost to counts as a new turn
      saveGameState();
      const townName = nodeDisplayName(nodesById[gameState.currentNodeId]);
      pendingMessage = 'Your Elite Four challenge ends against '+label+'. Return to '+townName+' to continue, or leave to reset your run.';
      pendingTmOffer = false;
      view = 'message';
      encounter = null;
    }
    render();
    return;
  }

  e.lostIds.add(e.currentPlayerId);
  e.currentPlayerId = null;

  const remainingOwned = loadGamePokemon().filter(m=>!e.lostIds.has(m.id));
  if(e.sentOutIds.length >= 6 || remainingOwned.length === 0){
    pendingMessage = (e.type==='wild') ? 'The wild '+opp.species+' got away.' : 'You had no Pokemon left and had to withdraw.';
    pendingMessage += resolveDeferredEvolutions(e.xpRecipientIds);
    pendingTmOffer = false;
    view = 'message';
    encounter = null;
  }
  render();
}

function chooseCatch(){
  const opp = encounter.opponents[0];
  addGamePokemon({
    name: opp.species,
    t1: opp.types[0] || null,
    t2: opp.types[1] || null,
    atk: opp.atk,
    base: opp.base,
    ev: opp.levelBonus.slice(),
    catchLevel: opp.levelBonus.reduce((a,b)=>a+b,0),
    note: 'Caught in the wild',
  });
  pendingMessage = 'Caught '+opp.species+'!';
  pendingTmOffer = false;
  view = 'message';
  encounter = null;
  render();
}
function chooseDefeat(){
  const e = encounter;
  const opp = e.opponents[0];
  const splits = splitXP(e.pendingXP.total, e.pendingXP.participants);
  const list = loadGamePokemon();
  const evoMessages = [];
  const xpMessages = [];
  splits.forEach(({id, xp})=>{
    const mon = list.find(x=>x.id===id);
    if(!mon) return;
    const leveledUp = grantXP(mon, xp, e.pendingXP.highIdx);
    xpMessages.push(mon.name+' +'+xp+' XP');
    if(leveledUp) checkAndApplyLevelEvolution(mon, list).forEach(msg => evoMessages.push(msg));
  });
  saveGamePokemonList(list);
  pendingMessage = 'Defeated the wild '+opp.species+'. ' +
    xpMessages.join(', ') +
    (evoMessages.length ? ' ' + evoMessages.join(' ') : '');
  pendingTmOffer = false;
  view = 'message';
  encounter = null;
  render();
}

function endTurn(){
  view = 'board';
  movement = null;
  render();
}

  else if(action === 'pickTown') pickTown(btn.dataset.node);
  else if(action === 'beginAdventure') beginAdventure();
  else if(action === 'rollMovement') rollMovement();
  else if(action === 'townAction') townAction(btn.dataset.choice);
  else if(action === 'chooseEvolveOption') chooseEvolveOption(btn.dataset.mon, btn.dataset.target);
  else if(action === 'backToTownMenu') backToTownMenu();
  else if(action === 'rollRoute') rollRoute(parseInt(btn.dataset.adjust, 10));
  else if(action === 'pickPlayerMon') pickPlayerMon(btn.dataset.id);
  else if(action === 'fight') fight();
  else if(action === 'chooseCatch') chooseCatch();
  else if(action === 'chooseDefeat') chooseDefeat();
  else if(action === 'endTurn') endTurn();
  else if(action === 'startTmPick') startTmPick();
  else if(action === 'skipTm') skipTm();
  else if(action === 'pickTmMon') pickTmMon(btn.dataset.mon);
  else if(action === 'backToTmPickMon') backToTmPickMon();
  else if(action === 'chooseTmType') chooseTmType(btn.dataset.type);
  else if(action === 'generateCustomRegion') generateCustomRegion();
  else if(action === 'generateCustomRegionFromSeedInput') generateCustomRegionFromSeedInput();
  else if(action === 'playCustomRegion') playCustomRegion();
  else if(action === 'backToRegionPick') backToRegionPick();
  else if(action === 'selectCustomRegionNode') selectCustomRegionNode(btn.dataset.node);
  else if(action === 'selectCustomRegionE4Tab') selectCustomRegionE4Tab(parseInt(btn.dataset.idx, 10));
  else if(action === 'resumeEliteFour') resumeEliteFour();
  else if(action === 'leaveEliteFourTown') leaveEliteFourTown();
  else if(action === 'continueEliteFour') continueEliteFour();
  else if(action === 'continueSlot') continueSlot(parseInt(btn.dataset.slot, 10));
  else if(action === 'createNewAdventure') createNewAdventure();
  else if(action === 'deleteSlot') deleteSlot(parseInt(btn.dataset.slot, 10));
  else if(action === 'showHowToPlay') showHowToPlay();
  else if(action === 'setHowToPlaySection') setHowToPlaySection(btn.dataset.section);
  else if(action === 'closeHowToPlay') closeHowToPlay();
  else if(action === 'pickRegion') pickRegion(btn.dataset.region);
  else if(action === 'toggleChallengeMode') toggleChallengeMode(btn.dataset.mode);
  else if(action === 'confirmChallengeModes') confirmChallengeModes();
  else if(action === 'toggleTeamBuilderMon') toggleTeamBuilderMon(btn.dataset.id);
  else if(action === 'confirmTeamBuilderExport') confirmTeamBuilderExport();
  else if(action === 'moveToNode') moveToNode(btn.dataset.node);
});
