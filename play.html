// ---- Evolution items ----
// An evolution branch's method (from NATIONAL_EVOLUTION_DATA) counts as a
// placeable item unless it's one of the other trigger shapes that doc uses:
// a plain level, Friendship (with or without its parenthetical conditions),
// an "[Type] attack type" move-trigger, the two flat counters (Battles Won/
// Steps), or Nincada's one-off "Automatic" Shedinja bonus. Everything else
// -- stones, held items, "Linking Cord" (this game's trade stand-in), and
// newer-gen items like the Tart/Sweet/Syrupy Apple trio -- is real and
// needs somewhere to be found. Verified against every method string in
// NATIONAL_EVOLUTION_DATA: 37 items, 28 non-items, no misclassifications.
function isEvoMethodAnItem(method){
  if(/^Level \d+/.test(method)) return false;
  if(/Friendship/.test(method)) return false;
  if(/attack type/.test(method)) return false;
  if(/Battles Won/.test(method)) return false;
  if(/Steps$/.test(method)) return false;
  if(/^Automatic/.test(method)) return false;
  return true;
}
// Scans every species that actually appears in this region (wild tables +
// gym/E4/Champion rosters) for an item-based evolution, in a stable scan
// order so "the first item" is well defined for the placement pass below.
// One entry per distinct ITEM, not per species -- a stone that several of
// this region's own species could use is still only logged once, matching
// how the hand-authored regions place it.
function collectRegionEvoItems(region){
  const seenSpecies = new Set();
  const speciesInOrder = [];
  const addSpecies = sp => { if(!seenSpecies.has(sp)){ seenSpecies.add(sp); speciesInOrder.push(sp); } };
  region.locations.forEach(loc => loc.table.forEach(addSpecies));
  Object.values(region.gymTeams).forEach(g => g.members.forEach(m => addSpecies(m.species)));
  region.eliteFourTeams.forEach(e => e.members.forEach(m => addSpecies(m.species)));
  region.championTeam.members.forEach(m => addSpecies(m.species));

  const typesByItem = {};
  const itemOrder = [];
  speciesInOrder.forEach(sp => {
    const evos = NATIONAL_EVOLUTION_DATA[sp];
    if(!evos) return;
    evos.forEach(({method}) => {
      if(!isEvoMethodAnItem(method)) return;
      if(!typesByItem[method]){ typesByItem[method] = new Set(); itemOrder.push(method); }
      typesOf(sp).forEach(t => { if(t) typesByItem[method].add(t); });
    });
  });
  return itemOrder.map(item => ({ item, types: [...typesByItem[item]] }));
}
function townTypeMatchScore(typeTable, types){
  return types.reduce((sum,t) => sum + ((typeTable && typeTable[t]) || 0), 0);
}
// Places each required item in a town/city (never the Elite Four town,
// which stays item-free and is colored separately) -- towns with fewer
// items so far are always preferred over ones with more (every eligible
// town gets one before any gets a second, a second before any gets a
// third, and so on), and within that tier, whichever town's own type
// distribution best matches the evolving Pokemon's type(s).
function placeEvoItems(region){
  const required = collectRegionEvoItems(region);
  const towns = region.mapNodes.filter(n => (n.kind==='town' || n.kind==='combo') && !n.eliteFour);
  towns.forEach(n => { n.evoItems = []; });
  if(!towns.length) return;

  required.forEach(({item, types}) => {
    let capacity = 1;
    let candidates = towns.filter(n => n.evoItems.length < capacity);
    while(!candidates.length){
      capacity++;
      candidates = towns.filter(n => n.evoItems.length < capacity);
    }
    let best = candidates[0], bestScore = -Infinity;
    candidates.forEach(n => {
      const score = townTypeMatchScore(n.typeTable, types) + Math.random()*0.001;
      if(score > bestScore){ bestScore = score; best = n; }
    });
    best.evoItems.push(item);
  });
}

function populateRegionDex(region){
  const tables = buildRegionTables(region);
  placeLegendariesInDungeons(tables);
  const gymDraft = { log: [], lists: {}, firstAdded: {}, completionOrder: [] };
  Object.keys(TYPE_WHEEL).forEach(t=>{ gymDraft.lists[t] = []; });
  // Starters are exclusive to the starting choice -- their whole line must
  // never also turn up as a wild encounter, trainer roster member, or gym/
  // E4/Champion pick, so exclude their species from the draft pool.
  const starterSpecies = new Set();
  region.starters.forEach(line => { starterSpecies.add(line.basic); starterSpecies.add(line.stage1); starterSpecies.add(line.stage2); });
  populateRegionTables(tables, gymDraft, starterSpecies);
  // The exact draw order every wild-encounter family was added to the
  // region in -- reused later (see buildTrainerRoleTables) so trainer
  // tables draw from only this region's own dex, in that same order.
  region.gymDraftLog = gymDraft.log.slice();
  tables.forEach(sortAndFillTable);
  region.locations = tables.map(t=>({ id:t.id, kind:t.kind, table:t.table }));
  region.locations.forEach(loc=>{ loc.typeTable = typeTableForSpeciesList(loc.table); });
  region.mapNodes.forEach(n=>{
    if(n.kind==='town' || n.kind==='combo') n.typeTable = computeTownTypeTable(region, n.id);
  });

  const { eliteFour, gyms, champion } = buildGymEliteFourChampion(gymDraft);
  region.eliteFourTeams = eliteFour.map(e=>({
    label: e.leaderName + ' (' + e.type + ' E4)', leaderName: e.leaderName, type: e.type, members: e.members,
  }));
  region.championTeam = { label: champion.leaderName + ' (Champion)', leaderName: champion.leaderName, members: champion.members };
  region.gymTeams = assignGymTowns(region, gyms);
  nameAllTowns(region);
  assignMapLabels(region);
  nameAllDungeons(region);
  assignDungeonMapLabels(region);
  placeEvoItems(region);
  region.label = generateRegionName();
  return region;
}

// ==== Making the generated region playable ====
// Everything below converts a fully-generated preview `region` object into
// the exact shape the live game engine's global `DATA` expects (see
// rollWildEncounter/rollTrainerTeam/rollGymTeam/rollEliteFourMemberTeam/
// pickStageForLevel/checkAndApplyLevelEvolution) so the SAME engine code
// that drives Calli/Neo Kanto/Hoenn can drive a freshly generated region
// too, with no changes to any of those functions.

// species -> its EVOLUTION_FAMILIES family, cached (447 families never
// change at runtime).
let _familyByNameCache = null;
function familyForSpecies(name){
  if(!_familyByNameCache){
    _familyByNameCache = {};
    EVOLUTION_FAMILIES.forEach(fam => fam.forEach(([n])=>{ _familyByNameCache[n] = fam; }));
  }
  return _familyByNameCache[name] || null;
}
// Groups a family's flat [name,stage] pairs into DATA.trainerChain's own
// shape: [stage0Name, stage1NameOrBranchArray, stage2NameOrBranchArray, ...]
// -- verified 1:1 against Calli's own real data, e.g. Oddish's family here
// produces exactly ["Oddish","Gloom",["Vileplume","Bellossom"]].
function buildChainForFamily(family){
  const byStage = {};
  family.forEach(([name,stage])=>{ (byStage[stage] = byStage[stage]||[]).push(name); });
  const maxStage = Math.max(...family.map(([,s])=>s));
  const chain = [];
  for(let s=0; s<=maxStage; s++){
    const names = byStage[s];
    if(!names || !names.length) continue;
    chain.push(names.length === 1 ? names[0] : names.slice());
  }
  return chain;
}
function speciesRow(name){ return NATIONAL_DEX[name] || LEGENDARY_DEX[name] || null; }
// Converts an already-resolved final species back into the root(+forced
// branch) form DATA.gymLeaders/eliteFour/champion slots expect, so the
// engine's own pickStageForLevel resolves it dynamically by badge count
// instead of it being a single static pick. Forcing is only meaningful at
// whichever stage `sp` itself branches at -- pickStageForLevel silently
// ignores a forced branch name at any OTHER branch point in the same
// chain, same as it would for a hand-authored region with a
// double-branching family.
function speciesToRootSlot(sp){
  const fam = familyForSpecies(sp);
  if(!fam) return sp;
  const chain = buildChainForFamily(fam);
  const root = Array.isArray(chain[0]) ? chain[0][0] : chain[0];
  const branches = chain.some(Array.isArray);
  return branches ? [root, sp] : root;
}

// Every species referenced anywhere in the region (wild tables, gym/E4/
// champion final picks, the 3 starter lines), expanded to each one's FULL
// evolution family so mid-chain species not directly drafted still get
// dice/types/predecessor/minLevel/evoInfo entries. Legendary-dex species
// have no family and are tracked separately.
function collectPlayableSpeciesUniverse(region){
  const national = new Set();
  const legendary = new Set();
  const addOne = sp => {
    if(NATIONAL_DEX[sp]){
      const fam = familyForSpecies(sp);
      if(fam) fam.forEach(([n])=>national.add(n));
      else national.add(sp);
    } else if(LEGENDARY_DEX[sp]){
      legendary.add(sp);
    }
  };
  // Walk the region's own chronological draft order first (the same
  // shuffled-EVOLUTION_FAMILIES sequence populateRegionTables used to fill
  // both the wild tables and the gym/trainer candidate pools) -- this is
  // what the Pokedex's "Regional #" sort means by "the order added," not
  // whatever order the wild-table scan below happens to touch species in.
  (region.gymDraftLog || []).forEach(e => addOne(e.chosenFinal));
  region.locations.forEach(loc => loc.table.forEach(addOne));
  Object.values(region.gymTeams).forEach(g => g.members.forEach(m => addOne(m.species)));
  region.eliteFourTeams.forEach(e => e.members.forEach(m => addOne(m.species)));
  region.championTeam.members.forEach(m => addOne(m.species));
  region.starters.forEach(line => { addOne(line.basic); addOne(line.stage1); addOne(line.stage2); });
  return { national, legendary };
}

// A "required level" is what trainer/gym/wild resolution checks a rolled
// level against before it's allowed to use this evolved form at all (see
// pickStageForLevel). Level-up evolutions use the exact level printed in
// Pokemon_Evolution_Data.md -- never synthesized. Non-level evolutions
// (item/friendship/trade/attack-type/battles-won/steps/etc, which have no
// inherent level of their own) still need one, so trainer resolution knows
// when they're eligible: 3 more than the predecessor's own required level,
// or 6 more if the predecessor is a basic (required level 1) -- the doc's
// own buffer rule.
function requiredLevelForBranch(predRequiredLevel, method){
  const lvl = evoRequiredLevel(method);
  if(lvl !== null) return lvl;
  return predRequiredLevel === 1 ? predRequiredLevel + 6 : predRequiredLevel + 3;
}
function ensureEvoInfoEntry(evoInfo, sp){
  if(!evoInfo[sp]) evoInfo[sp] = { evolvesFrom: null, evolvesInto: [] };
  return evoInfo[sp];
}
// Builds predecessor/minLevel/evoInfo for every national-dex family touched
// by this region, walking NATIONAL_EVOLUTION_DATA forward from each
// family's base species (found via EVOLUTION_FAMILIES) so every step
// already knows its true predecessor's required level -- and, since
// NATIONAL_EVOLUTION_DATA gives real from->into edges directly, branching
// families (Wurmple, Eevee, Gloom, ...) resolve unambiguously instead of
// needing the positional-pairing guess an earlier version of this relied
// on. The 3 starter lines use their own real lvl1/lvl2 (from
// region.starters) in place of the doc, matching their hand-authored
// STARTER_LINE_POOL values.
function synthesizeEvolutionData(nationalSpecies, region){
  const predecessor = {};
  const minLevel = {};
  const evoInfo = {};
  const starterLevels = {};
  region.starters.forEach(line => {
    starterLevels[line.stage1] = line.lvl1;
    starterLevels[line.stage2] = line.lvl2;
  });

  const visited = new Set();
  function visit(sp, reqLevel){
    if(visited.has(sp)) return;
    visited.add(sp);
    minLevel[sp] = reqLevel;
    ensureEvoInfoEntry(evoInfo, sp);
    (NATIONAL_EVOLUTION_DATA[sp] || []).forEach(({into, method}) => {
      predecessor[into] = sp;
      ensureEvoInfoEntry(evoInfo, sp).evolvesInto.push({ species: into, method });
      ensureEvoInfoEntry(evoInfo, into).evolvesFrom = sp;
      const custom = starterLevels[into];
      const level = custom !== undefined ? custom : requiredLevelForBranch(reqLevel, method);
      visit(into, level);
    });
  }

  nationalSpecies.forEach(sp => {
    if(visited.has(sp)) return;
    const fam = familyForSpecies(sp);
    const baseEntry = fam ? fam.find(([,s])=>s===0) : null;
    visit(baseEntry ? baseEntry[0] : sp, 1);
  });
  return { predecessor, minLevel, evoInfo };
}

function buildDiceAndTypes(national, legendary){
  const dice = {}, types = {};
  new Set([...national, ...legendary]).forEach(sp => {
    const row = speciesRow(sp);
    if(!row) return;
    dice[sp] = row.slice(2);
    types[sp] = [row[0], row[1] || null];
  });
  return { dice, types };
}

// ---- Roaming-trainer tables ----
// Populated with the SAME logic as the wild encounter tables
// (populateRegionTables/scoreTableForFamily above), drawing from ONLY the
// lines already in this region's own dex -- region.gymDraftLog is the
// exact family draw order populateRegionTables used to fill the wild
// tables, so reusing it (via familyForSpecies on each entry's chosen
// final) keeps trainer tables scoped to "Pokemon in the region," not the
// national dex at large. Each line goes into its top 2 scoring open
// tables first (same rule wild tables use), then -- if the 11 tables
// still aren't full once every line has had its 2 uses -- the SAME list
// is cycled again, in the same order, for a 3rd (and, rarely, further)
// use per line until every table fills. The one structural difference
// from wild tables: no compass-direction term (a trainer class has no map
// position to be biased toward), and each line contributes just its ROOT
// species, one slot per use, since a trainer's own evolution stage is
// resolved dynamically at battle time (pickStageForLevel), not baked in.
function buildTrainerRoleTables(region){
  const tables = Array.from({length:11}, () => ({ members:[], typeCounts:{}, typeTotal:0, capacity:11 }));
  const orderedLines = (region.gymDraftLog || [])
    .map(e => ({ family: familyForSpecies(e.chosenFinal), chosenFinal: e.chosenFinal }))
    .filter(x => x.family);
  if(!orderedLines.length) return { tables, lineScores:{} };

  // One score per distinct line, computed once and reused everywhere that
  // line's root gets placed (a root can land in up to 3 tables) -- see
  // computeTrainerLineScore.
  const lineScores = {};
  orderedLines.forEach(({family, chosenFinal}) => {
    const root = (family.find(([,s])=>s===0) || family[0])[0];
    if(!(root in lineScores)) lineScores[root] = computeTrainerLineScore(family, chosenFinal);
  });

  function placeOnePass(usesThisPass){
    for(const {family} of orderedLines){
      const openTables = tables.filter(t => t.members.length < t.capacity);
      if(!openTables.length) return;
      const lineScore = familyTypeScore(family);
      const scored = openTables.map(t => ({ t, score: trainerRoleTableScore(t, lineScore) }))
        .sort((a,b)=>b.score-a.score);
      const root = (family.find(([,s])=>s===0) || family[0])[0];
      const uses = Math.min(usesThisPass, scored.length);
      for(let i=0;i<uses;i++) placeRootInTrainerRoleTable(scored[i].t, root);
    }
  }
  placeOnePass(2); // every line's top-2 tables
  let guard = 0;
  while(tables.some(t => t.members.length < t.capacity) && guard < 30){
    placeOnePass(1); // 3rd+ use: cycle the same list again, one more table per line
    guard++;
  }
  // A very sparse region could still fall short after many cycles -- pad
  // any leftover slots by repeating members that table already has, so
  // every table always reaches exactly 11 (rollTrainerTeam indexes
  // table[sum-2] directly and expects every slot filled).
  tables.forEach(t=>{
    while(t.members.length < t.capacity && t.members.length){
      t.members.push(t.members[Math.floor(Math.random()*t.members.length)]);
    }
  });
  return { tables, lineScores };
}
// A line's "power" for trainer-table slotting: the average, across every
// stage on its own specific path from root to the final form actually
// drafted for this region (chosenFinal -- for a family that splits, only
// the chosen branch's stages count), of that stage's own sum of adjusted
// base stats (statTotalOf). Plus rand()*5 jitter so exact stat-total ties
// don't produce a fixed order.
function stagesForChosenFinal(family, chosenFinal){
  const byStage = {};
  family.forEach(([n,s])=>{ (byStage[s]=byStage[s]||[]).push(n); });
  const maxStage = Math.max(...family.map(([,s])=>s));
  const stages = [];
  for(let s=0; s<=maxStage; s++){
    const names = byStage[s];
    if(!names) continue;
    stages.push(names.includes(chosenFinal) ? chosenFinal : names[0]);
  }
  return stages;
}
function computeTrainerLineScore(family, chosenFinal){
  const stages = stagesForChosenFinal(family, chosenFinal);
  const avg = stages.reduce((a,n)=>a+statTotalOf(n), 0) / stages.length;
  return avg + Math.random()*5;
}
function trainerRoleTableScore(table, lineScore){
  const tScore = tableTypeScore(table);
  let dotType = 0;
  for(const t in lineScore){ if(tScore[t]) dotType += tScore[t]*lineScore[t]; }
  return dotType*5 + Math.random();
}
function placeRootInTrainerRoleTable(table, root){
  table.members.push(root);
  const row = NATIONAL_DEX[root];
  table.typeCounts[row[0]] = (table.typeCounts[row[0]]||0) + 1; table.typeTotal++;
  if(row[1]){ table.typeCounts[row[1]] = (table.typeCounts[row[1]]||0) + 1; table.typeTotal++; }
}
// One flavor name per type (roughly matching the archetype real trainer
// classes lean on for that type -- Bug Catcher, Bird Keeper, Black Belt,
// Swimmer, etc.), plus a handful of type-neutral names for whichever
// table(s) lose a naming collision (see nameAndFinalizeTrainerTables).
const TRAINER_TYPE_CLASS_NAMES = {
  Normal:'Youngster', Fire:'Fire Breather', Water:'Swimmer', Grass:'Gardener',
  Electric:'Engineer', Ice:'Skier', Fighting:'Black Belt', Poison:'Biker',
  Ground:'Digger', Flying:'Bird Keeper', Bug:'Bug Catcher', Rock:'Climber',
  Ghost:'Medium', Dragon:'Dragon Tamer', Dark:'Punk', Steel:'Mechanic',
  Psychic:'Psychic', Fairy:'Beauty',
};
const TRAINER_GENERAL_CLASS_NAMES = ['Ace Trainer','Veteran','Backpacker','Camper','Cyclist','Ranger','Rival','Tourist'];
// ---- Roaming trainer names (e.g. "Bug Catcher Jonathan") -- all regions ----
// Only the classes with a real single-gender identity (matching mainline
// convention, and this game's own Youngster/Lass pairing) are pinned;
// everything else -- including every class name a real region's own
// hand-authored trainerClassBySum can produce (Ace Trainer, Veteran,
// Silph Researcher, Team Aqua/Magma Grunt, Camper, Backpacker, Cyclist,
// Ranger, ...) -- draws from either pool at random.
const TRAINER_CLASS_GENDER = {
  Youngster:'M', 'Bug Catcher':'M', Hiker:'M', 'Bird Keeper':'M', 'Black Belt':'M',
  'Fire Breather':'M', Biker:'M', 'Dragon Tamer':'M', Psychic:'M',
  Lass:'F', Beauty:'F', Medium:'F', Skier:'F',
};
const TRAINER_FIRST_NAMES_MALE = ['Jonathan','Michael','Ethan','Andrew','Ryan','Kevin','Brandon','Justin','Tyler','Jacob',
  'Nathan','Aaron','Dylan','Cody','Austin','Brian','Sean','Adam','Marcus','Derek',
  'Jordan','Wesley','Trevor','Grant','Colin','Miles','Owen','Elliot','Felix','Gavin'];
const TRAINER_FIRST_NAMES_FEMALE = ['Emily','Sarah','Jessica','Ashley','Rachel','Megan','Amanda','Lauren','Hannah','Chloe',
  'Grace','Olivia','Natalie','Julia','Vanessa','Erin','Kayla','Brooke','Paige','Mia',
  'Sophie','Claire','Abigail','Danielle','Renee','Kelsey','Rebecca','Alyssa','Morgan','Jenna'];
function randomTrainerName(className){
  const gender = TRAINER_CLASS_GENDER[className] || (Math.random() < 0.5 ? 'M' : 'F');
  const pool = gender === 'M' ? TRAINER_FIRST_NAMES_MALE : TRAINER_FIRST_NAMES_FEMALE;
  return className + ' ' + pool[Math.floor(Math.random()*pool.length)];
}
// Slot-rank order used for both placing a class's own lines into its 11
// slots and placing the 11 classes across the 11 encounter sums: highest
// rank goes to sum 2, then 4,6,8,10,12 (the low-probability extremes get
// the strongest picks), then 3,5,7,9,11 for the rest in descending order,
// with the single lowest-ranked entry landing on sum 11.
const TRAINER_SLOT_ORDER = ['2','4','6','8','10','12','3','5','7','9','11'];
// Names each of the 11 populated tables after its own most common type; if
// two or more tables share the same most-common type, whichever one has
// the highest share of it keeps that name and the rest fall back to a
// general (non-type) class name instead. Then places each table's lines
// into its 11 slots by descending lineScores (TRAINER_SLOT_ORDER), and
// places the 11 finished classes across the 11 encounter sums by their own
// descending average line score (same order).
function nameAndFinalizeTrainerTables(tables, lineScores){
  const info = tables.map(t => {
    if(!t.typeTotal) return { topType:null, topShare:0 };
    const sorted = Object.entries(t.typeCounts).sort((a,b)=>b[1]-a[1]);
    return { topType: sorted[0][0], topShare: sorted[0][1] / t.typeTotal };
  });
  const byType = {};
  info.forEach((inf, i) => { if(inf.topType){ (byType[inf.topType] = byType[inf.topType] || []).push(i); } });
  const winnerForType = {};
  Object.keys(byType).forEach(type => {
    const idxs = byType[type].slice().sort((a,b) => info[b].topShare - info[a].topShare);
    winnerForType[type] = idxs[0];
  });

  const usedNames = new Set();
  const generalPool = shuffled(TRAINER_GENERAL_CLASS_NAMES);
  let generalIdx = 0;
  const classNames = tables.map((t, i) => {
    const inf = info[i];
    if(inf.topType && winnerForType[inf.topType] === i && TRAINER_TYPE_CLASS_NAMES[inf.topType]){
      const name = TRAINER_TYPE_CLASS_NAMES[inf.topType];
      usedNames.add(name);
      return name;
    }
    while(generalIdx < generalPool.length && usedNames.has(generalPool[generalIdx])) generalIdx++;
    const name = generalIdx < generalPool.length ? generalPool[generalIdx] : ('Trainer '+(i+1));
    usedNames.add(name);
    generalIdx++;
    return name;
  });

  const trainerClassBySum = {};
  const trainerTables = {};
  const classAvgScores = tables.map((t, i) => {
    const ranked = t.members.slice().sort((a,b) => (lineScores[b]||0) - (lineScores[a]||0));
    const bySum = {};
    ranked.forEach((root, rank) => { bySum[TRAINER_SLOT_ORDER[rank]] = root; });
    const arr = new Array(11);
    for(let sum=2; sum<=12; sum++) arr[sum-2] = bySum[String(sum)];
    trainerTables[classNames[i]] = arr;
    return t.members.reduce((a,root)=>a+(lineScores[root]||0), 0) / (t.members.length || 1);
  });
  const rankedClassIdx = tables.map((_,i)=>i).sort((a,b) => classAvgScores[b]-classAvgScores[a]);
  rankedClassIdx.forEach((i, rank) => { trainerClassBySum[TRAINER_SLOT_ORDER[rank]] = classNames[i]; });
  return { trainerClassBySum, trainerTables };
}
// trainerChain needs a chain entry for every root that anything (roaming
// trainers, gyms, E4, Champion) might ask pickStageForLevel to resolve --
// simplest robust way to guarantee that is to build one for every family
// touched anywhere in the final species universe, not just the trainer
// tables' own roots.
function buildTrainerChainForUniverse(national){
  const trainerChain = {};
  const seenRoots = new Set();
  national.forEach(sp => {
    const fam = familyForSpecies(sp);
    const root = fam ? (fam.find(([,s])=>s===0) || fam[0])[0] : sp;
    if(seenRoots.has(root)) return;
    seenRoots.add(root);
    trainerChain[root] = fam ? buildChainForFamily(fam) : [root];
  });
  return trainerChain;
}

// Converts the generator's already-resolved final-species gym/E4/Champion
// picks back into root(+forced-branch) form so the same engine machinery
// that drives Calli (pickStageForLevel/rollGymTeam/rollEliteFourMemberTeam)
// resolves them dynamically as the player earns badges, instead of a
// single static team baked in at generation time.
function convertGymLeaders(region){
  const gymLeaders = {};
  Object.keys(region.gymTeams).forEach(leaderName => {
    const gym = region.gymTeams[leaderName];
    const townNode = region.mapNodes.find(n => n.gymLeader === leaderName);
    const slots = {};
    gym.members.forEach(m => { slots[m.slotKey] = speciesToRootSlot(m.species); });
    gymLeaders[leaderName] = { town: townNode ? townNode.name : '', type: gym.type, slots };
  });
  return gymLeaders;
}
function convertEliteFourAndChampion(region){
  const eliteFour = region.eliteFourTeams.map((e,i) => {
    const slots = {}, levels = {};
    e.members.forEach(m => { slots[m.slotKey] = speciesToRootSlot(m.species); levels[m.slotKey] = m.level; });
    return { id:'E4_'+(i+1), name:e.leaderName, type:e.type, slots, levels };
  });
  const c = region.championTeam;
  const slots = {}, levels = {};
  c.members.forEach(m => { slots[m.slotKey] = speciesToRootSlot(m.species); levels[m.slotKey] = m.level; });
  const champion = { id:'CHAMPION', name:c.leaderName, type:'Mixed', slots, levels };
  return { eliteFour, champion };
}

// Adds the .name/.locationId fields the live engine expects on every
// route/dungeon-kind map node (the preview never needed them -- it reads
// region.locations directly). Also refreshes combo nodes' .townName/
// .dungeonName (set to raw ids at creation time, before naming ran) since
// the live engine's nodeDisplayName() reads those two fields specifically
// for a combo tile, not .name.
function fixMapNodesForPlay(region){
  region.locations.forEach(loc => {
    if(loc.kind === 'route' && !loc.name) loc.name = loc.id;
  });
  const locByTableId = {};
  region.locations.forEach(loc => { locByTableId[loc.id] = loc; });
  region.mapNodes.forEach(n => {
    if(n.kind === 'route' || n.kind === 'dungeon'){
      const tableId = customRegionTableIdForNode(n);
      const loc = locByTableId[tableId];
      n.name = loc ? loc.name : tableId;
      n.locationId = tableId;
      if(n.kind === 'dungeon' && loc && loc.mapLabel) n.mapLabel = loc.mapLabel;
    } else if(n.kind === 'combo'){
      n.townName = n.name;
      n.dungeonName = (locByTableId[n.dungeonId] && locByTableId[n.dungeonId].name) || n.dungeonId;
      n.dungeonLocationId = n.dungeonId;
      n.dungeonMapLabel = (locByTableId[n.dungeonId] && locByTableId[n.dungeonId].mapLabel) || null;
    }
  });
}
function buildEvoItemsDict(region){
  const evoItems = {};
  region.mapNodes.forEach(n => {
    if((n.kind==='town'||n.kind==='combo') && n.evoItems && n.evoItems.length){
      const key = n.kind==='combo' ? n.townId : n.id;
      evoItems[key] = n.evoItems.slice();
    }
  });
  return evoItems;
}

// Top-level entry point: turns a fully-generated preview `region` into
// { data, label } -- `data` is ready to be assigned straight to the
// engine's global DATA, `label` is the generated region's own name.
function buildPlayableCustomRegionData(region){
  fixMapNodesForPlay(region);
  // Trainer tables draw only from families already in region.gymDraftLog
  // (the same ones the wild tables were built from), so every root they
  // could use is already guaranteed to be part of the species universe
  // collected just below -- no separate folding-in needed.
  const { tables: roleTables, lineScores } = buildTrainerRoleTables(region);

  const { national, legendary } = collectPlayableSpeciesUniverse(region);
  const { predecessor, minLevel, evoInfo } = synthesizeEvolutionData(national, region);
  const { dice, types } = buildDiceAndTypes(national, legendary);
  const { trainerClassBySum, trainerTables } = nameAndFinalizeTrainerTables(roleTables, lineScores);
  const trainerChain = buildTrainerChainForUniverse(national);
  const gymLeaders = convertGymLeaders(region);
  const { eliteFour, champion } = convertEliteFourAndChampion(region);
  const evoItems = buildEvoItemsDict(region);
  const eliteNode = region.mapNodes.find(n=>n.eliteFour);
  const label = region.label || generateRegionName();

  const data = {
    locations: region.locations,
    dice, types, predecessor, minLevel,
    trainerClassBySum, trainerTables, trainerChain,
    trainerMinLevel: minLevel,
    gymLeaders, eliteFour, champion,
    mapNodes: region.mapNodes, mapEdges: region.mapEdges,
    evoInfo, evoItems,
    eliteFourTownId: eliteNode ? eliteNode.id : null,
    regionLabel: label,
    starterSpecies: region.starters.map(l=>l.basic),
    seed: region.seed || null,
  };
  return { data, label };
}

const REGION_GEN_DIRS = { N:{dx:0,dy:-1}, S:{dx:0,dy:1}, E:{dx:1,dy:0}, W:{dx:-1,dy:0} };
const REGION_GEN_OPPOSITE = { N:'S', S:'N', E:'W', W:'E' };
const REGION_GEN_ALL_DIRS = ['N','S','E','W'];
function regionGenTripleLetter(i){ const c = String.fromCharCode(65+i); return c+c+c; }
function regionGenDoubleLetter(i){ const c = String.fromCharCode(65+i); return c+c; }
function regionGenKey(x,y){ return x+','+y; }

function generateCustomRegionOnce(){
  const grid = new Map();
  const edgeSet = new Set();
  const edges = [];
  let townCount = 0, dungeonCount = 0, routeGroupCounter = 0;
  let minX=0,maxX=0,minY=0,maxY=0;

  function addEdge(k1,k2){
    if(k1 === k2) return;
    const norm = k1 < k2 ? k1+'|'+k2 : k2+'|'+k1;
    if(edgeSet.has(norm)) return;
    edgeSet.add(norm);
    edges.push([k1,k2]);
  }
  function boxAreaWith(x,y){
    const nMinX = Math.min(minX,x), nMaxX = Math.max(maxX,x);
    const nMinY = Math.min(minY,y), nMaxY = Math.max(maxY,y);
    return (nMaxX-nMinX+1) * (nMaxY-nMinY+1);
  }
  function wouldExceedCap(x,y){ return boxAreaWith(x,y) > 160; }
  function expandBoxTo(x,y){
    minX = Math.min(minX,x); maxX = Math.max(maxX,x);
    minY = Math.min(minY,y); maxY = Math.max(maxY,y);
  }
  function placeTown(x,y){
    const tile = { x, y, kind:'town', townIndex: townCount++, hasDungeon:false };
    grid.set(regionGenKey(x,y), tile);
    expandBoxTo(x,y);
    return tile;
  }
  function placeDungeon(x,y){
    const tile = { x, y, kind:'dungeon', dungeonIndex: dungeonCount++ };
    grid.set(regionGenKey(x,y), tile);
    expandBoxTo(x,y);
    return tile;
  }
  function placeRoute(x,y,groupId){
    const tile = { x, y, kind:'route', groupId };
    grid.set(regionGenKey(x,y), tile);
    expandBoxTo(x,y);
    return tile;
  }

  const central = placeTown(0,0);
  central.isCentral = true;

  const queue = [];
  for(const d of REGION_GEN_ALL_DIRS) queue.push({ originX:0, originY:0, dir:d });

  function rollLength(){ return [1,1,2,2,3,3][rand(6)-1]; }

  function findNearestOccupied(fromX, fromY, dir){
    const d = REGION_GEN_DIRS[dir];
    let x = fromX + d.dx, y = fromY + d.dy, gap = 0;
    while(x >= minX && x <= maxX && y >= minY && y <= maxY){
      if(grid.has(regionGenKey(x,y))) return { x, y, gap };
      x += d.dx; y += d.dy; gap++;
    }
    return null;
  }

  function processRouteJob(job){
    const { originX, originY, dir } = job;
    const d = REGION_GEN_DIRS[dir];
    const steps = rollLength();
    const hasDungeonExtra = rand(6) >= 5;
    const tokens = new Array(steps).fill('route');
    if(hasDungeonExtra){
      const slot = Math.floor(Math.random() * (steps+1));
      tokens.splice(slot, 0, 'dungeon');
    }
    const gid = routeGroupCounter++;
    const placedTiles = [], placedAny = [];
    let lastKeyPlaced = regionGenKey(originX, originY);
    let completedFully = true;
    let cx = originX, cy = originY;

    for(let i=0; i<tokens.length; i++){
      const nx = cx + d.dx, ny = cy + d.dy;
      const nk = regionGenKey(nx,ny);
      if(grid.has(nk)){
        addEdge(lastKeyPlaced, nk);
        completedFully = false; cx = null;
        break;
      }
      if(wouldExceedCap(nx,ny)){
        if(placedAny.length){
          const last = placedAny[placedAny.length-1];
          if(last.kind !== 'dungeon'){
            last.kind = 'dungeon';
            last.dungeonIndex = dungeonCount++;
            const idxInRoute = placedTiles.indexOf(last);
            if(idxInRoute !== -1) placedTiles.splice(idxInRoute, 1);
          }
        }
        completedFully = false; cx = null;
        break;
      }
      let tile;
      if(tokens[i] === 'dungeon') tile = placeDungeon(nx,ny);
      else { tile = placeRoute(nx,ny,gid); placedTiles.push(tile); }
      placedAny.push(tile);
      addEdge(lastKeyPlaced, nk);
      lastKeyPlaced = nk; cx = nx; cy = ny;
    }

    if(!completedFully || cx === null) return;

    const tx = cx + d.dx, ty = cy + d.dy;
    const tk = regionGenKey(tx,ty);
    if(grid.has(tk)){ addEdge(lastKeyPlaced, tk); return; }
    if(wouldExceedCap(tx,ty)){
      if(placedTiles.length){
        const last = placedTiles[placedTiles.length-1];
        if(last.kind !== 'dungeon'){ last.kind = 'dungeon'; last.dungeonIndex = dungeonCount++; }
      }
      return;
    }
    const adjacentTowns = [];
    for(const ad of REGION_GEN_ALL_DIRS){
      const ax = tx + REGION_GEN_DIRS[ad].dx, ay = ty + REGION_GEN_DIRS[ad].dy;
      const ak = regionGenKey(ax,ay);
      if(grid.has(ak) && grid.get(ak).kind === 'town') adjacentTowns.push(ak);
    }
    if(adjacentTowns.length){
      const extra = placeRoute(tx,ty,gid);
      placedTiles.push(extra);
      addEdge(lastKeyPlaced, tk);
      for(const ak of adjacentTowns) addEdge(tk, ak);
      return;
    }
    const newTown = placeTown(tx,ty);
    addEdge(lastKeyPlaced, tk);
    if(rand(6) === 6){ newTown.hasDungeon = true; newTown.dungeonIndex = dungeonCount++; }
    for(const od of REGION_GEN_ALL_DIRS){
      if(od === REGION_GEN_OPPOSITE[dir]) continue;
      if(rand(6) >= 4) queue.push({ originX: tx, originY: ty, dir: od });
    }
  }

  while(queue.length) processRouteJob(queue.shift());

  // Spur pass -- every town, in creation order, checks all 4 directions.
  const townTiles = [...grid.values()].filter(t=>t.kind==='town').sort((a,b)=>a.townIndex-b.townIndex);
  for(const town of townTiles){
    for(const d of REGION_GEN_ALL_DIRS){
      const ax = town.x + REGION_GEN_DIRS[d].dx, ay = town.y + REGION_GEN_DIRS[d].dy;
      const ak = regionGenKey(ax,ay), tk = regionGenKey(town.x, town.y);
      if(grid.has(ak)){ addEdge(tk, ak); continue; }
      const found = findNearestOccupied(town.x, town.y, d);
      if(!found || found.gap > 4) continue;
      const gid = routeGroupCounter++;
      const dungeonSlotIdx = (rand(6) >= 5) ? Math.floor(Math.random()*found.gap) : -1;
      let px = town.x, py = town.y, lastK = tk;
      for(let i=0; i<found.gap; i++){
        px += REGION_GEN_DIRS[d].dx; py += REGION_GEN_DIRS[d].dy;
        const pk = regionGenKey(px,py);
        if(i === dungeonSlotIdx) placeDungeon(px,py);
        else placeRoute(px,py,gid);
        addEdge(lastK, pk);
        lastK = pk;
      }
      addEdge(lastK, regionGenKey(found.x, found.y));
    }
  }

  // Renumber routes via a randomly-cornered sweep.
  const nsPick = rand(2)===1 ? 'N' : 'S';
  const ewPick = rand(2)===1 ? 'E' : 'W';
  const outerAxis = (rand(2)===1) ? 'NS' : 'EW';
  function axisRange(axis, pick){
    const arr = [];
    if(axis === 'NS'){
      if(pick === 'S') for(let y=maxY;y>=minY;y--) arr.push(y);
      else for(let y=minY;y<=maxY;y++) arr.push(y);
    } else {
      if(pick === 'E') for(let x=maxX;x>=minX;x--) arr.push(x);
      else for(let x=minX;x<=maxX;x++) arr.push(x);
    }
    return arr;
  }
  let nextRouteNum = 1;
  const groupInfo = new Map();
  function visit(x,y){
    const t = grid.get(regionGenKey(x,y));
    if(!t || t.kind !== 'route') return;
    let gi = groupInfo.get(t.groupId);
    if(!gi){ gi = { number: nextRouteNum++, tiles: [] }; groupInfo.set(t.groupId, gi); }
    gi.tiles.push(t);
  }
  if(outerAxis === 'NS'){
    for(const y of axisRange('NS', nsPick)) for(const x of axisRange('EW', ewPick)) visit(x,y);
  } else {
    for(const x of axisRange('EW', ewPick)) for(const y of axisRange('NS', nsPick)) visit(x,y);
  }
  for(const gi of groupInfo.values()){
    gi.tiles.forEach((t,idx)=>{
      t.finalId = gi.tiles.length === 1 ? String(gi.number) : (gi.number + 'abcdefghijklmnopqrstuvwxyz'[idx]);
    });
  }

  for(const t of grid.values()){
    if(t.kind === 'town') t.finalId = regionGenTripleLetter(t.townIndex);
    else if(t.kind === 'dungeon') t.finalId = regionGenDoubleLetter(t.dungeonIndex);
  }
  for(const t of townTiles){
    if(t.hasDungeon) t.dungeonFinalId = regionGenDoubleLetter(t.dungeonIndex);
  }

  let totalTowns = 0, totalDungeons = 0;
  for(const t of grid.values()){
    if(t.kind === 'town'){ totalTowns++; if(t.hasDungeon) totalDungeons++; }
    else if(t.kind === 'dungeon') totalDungeons++;
  }
  return { grid, edges, minX, maxX, minY, maxY, totalTowns, totalDungeons, totalRoutes: nextRouteNum-1 };
}

// Elite Four spur: a random town that has 3 clear, in-bounds cells in some
// direction gets, in order going outward, one more route tile (the highest
// route number), a Victory Road dungeon ("VR"), and the Elite Four town
// ("ELI") -- fixed ids, so they never collide with the AA/BB.. or AAA/BBB..
// auto-naming (both require two/three of the SAME letter).
function threeClearCellsInDir(r, x, y, dir){
  const d = REGION_GEN_DIRS[dir];
  for(let step=1; step<=3; step++){
    const nx = x + d.dx*step, ny = y + d.dy*step;
    if(nx < r.minX || nx > r.maxX || ny < r.minY || ny > r.maxY) return false;
    if(r.grid.has(regionGenKey(nx,ny))) return false;
  }
  return true;
}
function findEliteFourPlacement(r){
  const towns = [...r.grid.values()].filter(t=>t.kind==='town');
  const candidates = [];
  for(const t of towns){
    const validDirs = REGION_GEN_ALL_DIRS.filter(d => threeClearCellsInDir(r, t.x, t.y, d));
    if(validDirs.length) candidates.push({ town:t, validDirs });
  }
  if(!candidates.length) return null;
  const chosen = candidates[Math.floor(Math.random()*candidates.length)];
  const dir = chosen.validDirs[Math.floor(Math.random()*chosen.validDirs.length)];
  return { town: chosen.town, dir };
}
function attachEliteFour(r, placement){
  const { town, dir } = placement;
  const d = REGION_GEN_DIRS[dir];
  const routeX = town.x + d.dx, routeY = town.y + d.dy;
  const vrX = town.x + d.dx*2, vrY = town.y + d.dy*2;
  const eliX = town.x + d.dx*3, eliY = town.y + d.dy*3;
  const townKey = regionGenKey(town.x, town.y);
  const routeKey = regionGenKey(routeX, routeY);
  const vrKey = regionGenKey(vrX, vrY);
  const eliKey = regionGenKey(eliX, eliY);

  r.grid.set(routeKey, { x:routeX, y:routeY, kind:'route', finalId: String(r.totalRoutes+1) });
  r.grid.set(vrKey, { x:vrX, y:vrY, kind:'dungeon', finalId:'VR' });
  r.grid.set(eliKey, { x:eliX, y:eliY, kind:'town', finalId:'ELI', hasDungeon:false, isEliteFour:true });

  r.edges.push([townKey, routeKey]);
  r.edges.push([routeKey, vrKey]);
  r.edges.push([vrKey, eliKey]);
  r.totalRoutes += 1;
}

function buildCustomRegionOutput(r){
  const mapNodes = [];
  const idByKey = {};
  for(const [k,t] of r.grid) idByKey[k] = t.finalId;
  for(const [,t] of r.grid){
    const col = t.x - r.minX + 1, row = t.y - r.minY + 1;
    if(t.kind === 'route'){
      mapNodes.push({ id:t.finalId, kind:'route', row, col });
    } else if(t.kind === 'dungeon'){
      mapNodes.push({ id:t.finalId, kind:'dungeon', row, col });
    } else if(t.hasDungeon){
      mapNodes.push({ id:t.finalId, kind:'combo', row, col, townId:t.finalId, townName:t.finalId,
        dungeonId:t.dungeonFinalId, dungeonName:t.dungeonFinalId, gymLeader:null, central: !!t.isCentral });
    } else {
      mapNodes.push({ id:t.finalId, kind:'town', row, col, gymLeader:null, central: !!t.isCentral, eliteFour: !!t.isEliteFour });
    }
  }
  const mapEdges = r.edges.map(([k1,k2]) => [idByKey[k1], idByKey[k2]]);

  // The Elite Four town is never a gym town -- excluded from the pool.
  const townBearing = mapNodes.filter(n=>(n.kind==='town' || n.kind==='combo') && !n.eliteFour);
  for(let i=townBearing.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [townBearing[i], townBearing[j]] = [townBearing[j], townBearing[i]];
  }
  townBearing.slice(0, Math.min(8, townBearing.length)).forEach(n=>{ n.gymLeader = true; });

  return {
    mapNodes, mapEdges,
    maxRow: Math.max(...mapNodes.map(n=>n.row)),
    maxCol: Math.max(...mapNodes.map(n=>n.col)),
    totalTowns: mapNodes.filter(n=>n.kind==='town' || n.kind==='combo').length,
    totalDungeons: mapNodes.filter(n=>n.kind==='dungeon' || n.kind==='combo').length,
    totalRoutes: r.totalRoutes,
    starters: pickRandomStarterLines(),
  };
}

function generateCustomRegionData(){
  for(let i=0;i<500;i++){
    const r = generateCustomRegionOnce();
    if(r.totalTowns < 10 || r.totalTowns > 16) continue;
    if(r.totalDungeons < 8 || r.totalDungeons > 13) continue;
    const placement = findEliteFourPlacement(r);
    if(!placement) continue;
    attachEliteFour(r, placement);
    const region = populateRegionDex(buildCustomRegionOutput(r));
    // A full 4 Elite Four + 8 gym dex is now expected to succeed essentially
    // always (see conversation); on the rare region where it still doesn't,
    // just re-roll the whole thing from scratch rather than surfacing it.
    if(region.eliteFourTeams.length < 4 || Object.keys(region.gymTeams).length < 8) continue;
    return region;
  }
  // Practically unreachable given typical map sizes -- keep the UI functional
  // even if 500 attempts somehow never satisfy every constraint at once.
  const r = generateCustomRegionOnce();
  const placement = findEliteFourPlacement(r);
  if(placement) attachEliteFour(r, placement);
  return populateRegionDex(buildCustomRegionOutput(r));
}

// ---- Seeded region generation (share/repeat a random region) ----
// The whole generator (and everything it calls -- shuffles, weighted picks,
// coin flips, all the way down through populateRegionTables/nameAllTowns/
// placeEvoItems/etc.) is written against plain Math.random(), not a passed-in
// RNG. Rather than threading a seeded generator through dozens of call
// sites, temporarily swap out Math.random itself for a seeded one for the
// duration of one generateCustomRegionData() call, then restore it -- every
// existing random call becomes deterministic for free, and gameplay
// randomness (movement, battles) is completely unaffected since it always
// runs with the real Math.random restored.
// mulberry32 -- small, fast, good-enough-quality seeded PRNG for this.
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Hashes an arbitrary seed string down to a 32-bit int (xmur3-derived) so
// players can type any memorable word/phrase as a seed, not just digits.
function hashSeedString(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h>>>16), 2246822507);
  h = Math.imul(h ^ (h>>>13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function randomSeedString(){
  return Math.random().toString(36).slice(2, 10).toUpperCase();
}
// Runs `fn` with Math.random replaced by a fresh PRNG seeded from `seedStr`,
// then restores the real one -- always, even if fn throws. Two independent
// calls with the same seedStr each get their own deterministic run from the
// same starting state, regardless of how many random calls either consumes,
// so this is safe to call more than once for the same seed (region preview
// generation, then later the separate playable-data conversion step).
function withSeededRandom(seedStr, fn){
  const originalRandom = Math.random;
  Math.random = mulberry32(hashSeedString(seedStr));
  try {
    return fn();
  } finally {
    Math.random = originalRandom;
  }
}
// Generates a region deterministically from `seedInput` (any string -- case/
// whitespace-insensitive) so it can be shared and reproduced exactly, or
// from a freshly rolled random seed when none is given. The returned
// region's own `.seed` is the canonical (trimmed, uppercased) code to share
// -- also reused by playCustomRegion() to seed the later playable-data
// conversion step (trainer tables, etc.), so the whole shared experience is
// reproducible, not just the previewed map/dex/gyms.
function generateCustomRegionDataFromSeed(seedInput){
  const seed = (seedInput && seedInput.trim()) ? seedInput.trim().toUpperCase() : randomSeedString();
  const region = withSeededRandom(seed, () => generateCustomRegionData());
  region.seed = seed;
  return region;
}

/* ============ XP & leveling ============ */
function splitXP(total, participantIds){
  const n = participantIds.length;
  if(n===0) return [];
  const base = Math.floor(total/n);
  const remainder = total - base*n;
  return participantIds.map((id,i)=>({ id, xp: base + (i >= n-remainder ? 1 : 0) }));
}
const MAX_LEVEL = 20;
function isMaxLevel(entry){ return entry.ev.reduce((a,b)=>a+b,0) >= MAX_LEVEL; }
// Under the Level Cap challenge mode, no Pokemon can level past 5 + however many
// badges have been earned so far -- otherwise just the usual global MAX_LEVEL.
function currentLevelCap(){
  if(!(gameState && gameState.challengeModes && gameState.challengeModes.levelCap)) return MAX_LEVEL;
  return Math.min(MAX_LEVEL, 5 + (gameState.defeatedGymLeaders||[]).length);
}
// XP always keeps accumulating (even past a level-up -- it's just no longer "toward"
// anything until the next one is allowed); at most ONE level is ever granted per
// call, and `allowLevelUp` lets a caller block that single level too -- battle call
// sites pass false once a Pokemon has already leveled up earlier in the SAME battle,
// so a mon that racks up enough XP to jump 2+ levels in one battle (whether from one
// huge grant or several opponents in a row) still only gains 1 of them on the spot;
// the rest sits banked and comes due next battle. This is also what keeps a level-up
// evolution from chaining twice in one go (e.g. Squirtle straight into Blastoise) --
// see checkAndApplyLevelEvolution's deferred, once-per-battle check. Under Level Cap,
// banked XP past the current cap unlocks the same way: one level at a time, one
// battle at a time, as badges raise the cap. Returns whether a level was actually
// gained -- callers only run the evolution check when this is true. A level-up
// evolution's trigger is "you just leveled up," not "your current level happens to
// already qualify": a Pokemon caught at or above its own evolution level (wild
// encounters only downgrade when too LOW, never resolve to "best reachable stage")
// must not spontaneously evolve the next time it earns any XP at all -- it only
// evolves the next time it genuinely gains a level, same as mainline.
function grantXP(entry, xpGain, highIdx, allowLevelUp){
  let level = entry.ev.reduce((a,b)=>a+b,0);
  const startLevel = level;
  entry.xp = (entry.xp || 0) + xpGain;
  if(allowLevelUp !== false && level < currentLevelCap() && entry.xp >= level*10 && level>0){
    entry.xp -= level*10;
    entry.ev[highIdx] = (entry.ev[highIdx]||0) + 1;
    level += 1;
  }
  return level > startLevel;
}
function statTotal(statsArr){ return statsArr.reduce((a,b)=>a+b,0); }

// Only methods with an explicit "Level N" have a level this can check directly
// (friendship's threshold is relative to catch level, handled separately).
function evoRequiredLevel(method){
  const m = method.match(/Level (\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

// Level-up (and friendship) evolution -- checked right after XP is granted,
// separate from the town-item evolve flow (which only ever handles item/trade
// branches). Triggers automatically, no confirmation, matching mainline: a
// friendship branch's threshold is "level >= level caught at + 4" (SS11 of the
// ruleset); a plain level branch just needs an explicit "Level N" in its
// method text; Piloswine -> Mamoswine (Calli) is a one-off "Rock attack type"
// condition standing in for mainline's "knows Ancient Power" (this game has no
// move-tracking system, so attack type is the closest checkable equivalent) --
// no level floor of its own, just needs a level-up tick while atk is Rock.
// Loops in case evolving lands it on another already-eligible stage. Returns
// an array of "X evolved into Y!" messages for the caller to surface (e.g.
// into the encounter log).
function checkAndApplyLevelEvolution(entry, list){
  const messages = [];
  while(true){
    const info = DATA.evoInfo[entry.name];
    if(!info || !info.evolvesInto || !info.evolvesInto.length) break;
    const level = entry.ev.reduce((a,b)=>a+b,0);
    let target = null;
    for(const branch of info.evolvesInto){
      if(branch.method.indexOf('Friendship') !== -1){
        if(level >= (entry.catchLevel||0) + 4){ target = branch.species; break; }
      } else if(branch.method.indexOf('Rock attack type') !== -1){
        if((entry.atk||'').toLowerCase() === 'rock'){ target = branch.species; break; }
      } else {
        const req = evoRequiredLevel(branch.method);
        if(req !== null && level >= req){ target = branch.species; break; }
      }
    }
    if(!target) break;

    // Nincada -> Ninjask also spawns a Shedinja alongside it (mainline mechanic):
    // a brand-new Pokemon added to the collection, at the same level and EVs as
    // the Nincada that just evolved, with its own random attack type. Nincada
    // itself still just becomes Ninjask -- Shedinja is purely a bonus.
    const shedinjaBranch = info.evolvesInto.find(b => b.species === 'Shedinja');
    if(shedinjaBranch && target !== 'Shedinja' && list){
      const sTypes = DATA.types['Shedinja'] || [null, null];
      list.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
        name: 'Shedinja',
        t1: sTypes[0] || null,
        t2: sTypes[1] || null,
        atk: randomAttackType(sTypes[0], sTypes[1]),
        base: (DATA.dice['Shedinja'] || [0,0,0,0,0,0]).slice(),
        ev: entry.ev.slice(),
        xp: entry.xp || 0,
        catchLevel: entry.catchLevel,
        caughtAt: new Date().toISOString(),
        note: 'Appeared alongside ' + entry.name + '\'s evolution',
      });
      messages.push('A Shedinja appeared!');
    }

    const oldName = entry.name;
    entry.name = target;
    const types = DATA.types[target] || [null, null];
    entry.t1 = types[0] || null;
    entry.t2 = types[1] || null;
    entry.base = (DATA.dice[target] || [0,0,0,0,0,0]).slice();
    messages.push(oldName + ' evolved into ' + target + '!');

    const rolledAtk = randomAttackType(entry.t1, entry.t2);
    if(rolledAtk !== entry.atk && confirm('Change '+entry.name+'\'s attack type from '+entry.atk+' to '+rolledAtk+'?')){
      entry.atk = rolledAtk;
    }
  }
  return messages;
}

// Level-up evolution is checked once the WHOLE encounter is over, not after
// each individual opponent's XP grant -- a Pokemon that levels up against
// opponent 2 of 5 keeps fighting the rest of that battle as its pre-evolution
// self, only evolving once there's no more of the encounter left for the
// change to affect. `recipientIds` is every Pokemon that gained XP anywhere
// during the encounter, tracked as it happens and resolved here at the end.
function resolveDeferredEvolutions(recipientIds){
  if(!recipientIds || !recipientIds.size) return '';
  const list = loadGamePokemon();
  const messages = [];
  recipientIds.forEach(id=>{
    const mon = list.find(x=>x.id===id);
    if(mon) checkAndApplyLevelEvolution(mon, list).forEach(msg => messages.push(msg));
  });
  saveGamePokemonList(list);
  return messages.length ? (' ' + messages.join(' ')) : '';
}

/* ============ Rolling opponents ============ */
function rollOneDieWithThreshold(T){
  let v = rand(6);
  while(v>T){ v = rand(6); }
  return v;
}
function rollTrueTypeAttack(types){
  const typesLower = types.filter(Boolean).map(t=>t.toLowerCase());
  const baseType = typesLower[Math.floor(Math.random()*typesLower.length)];
  const shift = wheelShift(rand(6)+rand(6));
  const baseIdx = WHEEL.indexOf(baseType);
  const finalIdx = ((baseIdx+shift)%WHEEL.length+WHEEL.length)%WHEEL.length;
  return cap(WHEEL[finalIdx]);
}
function buildOpponent(species, level){
  const stats = DATA.dice[species] || [0,0,0,0,0,0];
  const levelBonus = distributeLevelBonus(stats, level);
  const statsArr = stats.map((n,i)=>n+levelBonus[i]);
  const highIdx = pickHighestIndex(statsArr);
  const types = DATA.types[species] || ['Normal', null];
  return { species, level, statsArr, levelBonus, base:stats, types, highIdx };
}
function rollWildEncounter(locationId){
  const loc = DATA.locations.find(l=>l.id===locationId);
  const badges = gameState.defeatedGymLeaders.length;
  const T = thresholdFor(badges);
  const sum = rollOneDieWithThreshold(T) + rollOneDieWithThreshold(T);
  const rolledSpecies = loc.table[sum-2];

  const rawLevel = rand(6);
  const finalLevel = levelMap[rawLevel] + badges;

  let species = rolledSpecies;
  let downgraded = false;
  while(DATA.predecessor[species] && (DATA.minLevel[species]||1) > finalLevel){
    species = DATA.predecessor[species];
    downgraded = true;
  }

  const opp = buildOpponent(species, finalLevel);
  opp.atk = rollTrueTypeAttack(opp.types);
  opp.downgraded = downgraded;
  opp.rolledSpecies = rolledSpecies;
  opp.locationName = loc.name;
  return opp;
}
function rollTrainerTeam(){
  const badges = gameState.defeatedGymLeaders.length;
  const classSum = rand(6)+rand(6);
  const className = DATA.trainerClassBySum[String(classSum)];
  const teamSize = trainerTeamSize(badges);
  const trainerLevel = 3 + badges;
  const table = DATA.trainerTables[className];
  const team = [];
  for(let i=0;i<teamSize;i++){
    const msum = rand(6)+rand(6);
    const root = table[msum-2];
    const finalSpecies = pickStageForLevel(root, trainerLevel);
    const opp = buildOpponent(finalSpecies, trainerLevel);
    opp.atk = rollTrueTypeAttack(opp.types);
    team.push(opp);
  }
  return { className, trainerName: randomTrainerName(className), team };
}
function rollGymTeam(leaderName){
  const badges = gameState.defeatedGymLeaders.length;
  const info = DATA.gymLeaders[leaderName];
  const slotDefs = [
    {slot:1, minBadges:0, level: badges+5},
    {slot:2, minBadges:0, level: badges+4},
    {slot:3, minBadges:2, level: badges+4},
    {slot:4, minBadges:4, level: badges+5},
    {slot:5, minBadges:6, level: badges+3},
  ];
  const sendOrder = [5,2,3,4,1];
  const team = [];
  sendOrder.forEach(slotNum=>{
    const def = slotDefs.find(d=>d.slot===slotNum);
    if(badges < def.minBadges) return;
    const root = info.slots[String(slotNum)] || info.slots[slotNum];
    const finalSpecies = pickStageForLevel(root, def.level);
    const opp = buildOpponent(finalSpecies, def.level);
    opp.atk = cap(fixedAttackType(finalSpecies, String(slotNum)));
    team.push(opp);
  });
  return { info, team };
}
function eliteFourMembers(){ return DATA.eliteFour.concat([DATA.champion]); }
function eliteFourMemberLabelForIndex(idx){
  const members = eliteFourMembers();
  const m = members[idx];
  return (idx === members.length-1) ? ('Champion '+m.name) : m.name;
}
function rollEliteFourMemberTeam(member){
  const order = Object.prototype.hasOwnProperty.call(member.slots, '5') ? ['1','2','3','4','5','ace'] : ['1','2','3','4','ace'];
  const team = [];
  order.forEach(slotKey=>{
    const root = member.slots[slotKey];
    const level = member.levels[slotKey];
    const finalSpecies = pickStageForLevel(root, level);
    const opp = buildOpponent(finalSpecies, level);
    opp.atk = cap(fixedAttackType(finalSpecies, slotKey));
    team.push(opp);
  });
  return team;
}

function gameMonLevel(m){ return m.ev.reduce((a,b)=>a+b,0); }
function gameMonStatTotal(m){ return statTotal(m.base.map((b,i)=>b+m.ev[i])); }

const MY_POKEMON_SORTS = [
  { mode:'obtained', label:'Order Obtained' },
  { mode:'stat', label:'Stat Total' },
  { mode:'level', label:'Level' },
];
// 'obtained' leaves the natural (insertion) order alone; the other two are always
// highest-first, each tiebroken by the other measure.
function sortedGamePokemon(mons, mode){
  const arr = mons.slice();
  if(mode === 'stat'){
    arr.sort((a,b) => (gameMonStatTotal(b)-gameMonStatTotal(a)) || (gameMonLevel(b)-gameMonLevel(a)));
  } else if(mode === 'level'){
    arr.sort((a,b) => (gameMonLevel(b)-gameMonLevel(a)) || (gameMonStatTotal(b)-gameMonStatTotal(a)));
  }
  return arr;
}

// Looks up a node's display name within a SPECIFIC region's own data, without
// touching the global DATA/nodesById -- lets the home screen summarize slots
// that are playing different regions side by side.
function nodeDisplayNameInRegion(regionKey, nodeId, slot){
  const regionData = regionKey === 'custom' ? loadCustomRegionData(slot) : (REGIONS[regionKey] && REGIONS[regionKey].data);
  if(!regionData) return 'Unknown';
  const node = (regionData.mapNodes || []).find(n=>n.id===nodeId);
  return node ? nodeDisplayName(node) : 'Unknown';
}
// A save slot's region label -- the shared REGIONS[...].label for the 3
// real regions, or the generated name stashed on gameState for a Custom
// Region (whose data lives in its own per-slot key, not REGIONS).
function regionLabelFor(gs){
  return gs.region === 'custom' ? gs.customRegionLabel : ((REGIONS[gs.region] && REGIONS[gs.region].label) || gs.region);
}

// The slot's 6 strongest Pokemon (current base+EV stat total, ties broken by
// level, ties broken by catch order -- earlier catches win), for the home
// screen's team-preview grid.
function topSixGamePokemon(slot){
  return loadGamePokemon(slot)
    .map((m,i)=>({ m, i }))
    .sort((a,b) => (gameMonStatTotal(b.m)-gameMonStatTotal(a.m)) || (gameMonLevel(b.m)-gameMonLevel(a.m)) || (a.i-b.i))
    .slice(0,6)
    .map(x=>x.m);
}

  if(!top.length) return '';
  return '<div class="save-slot-team">' + top.map(m=>spriteImgHtml(m.name, '')).join('') + '</div>';
}

    const regionLabel = regionLabelFor(gs);

    const badges = (gs.defeatedGymLeaders||[]).length;
    const customData = gs.region === 'custom' ? loadCustomRegionData(slot) : null;
    const seedLine = (customData && customData.seed)
      ? '<div class="save-slot-meta">Seed: <span class="seed-code">'+customData.seed+'</span></div>'
      : '';
    // A frozen snapshot from the moment the Champion fell (see the elite4 win
    // branch in fight()) -- always shows who was actually beaten with, even if
    // the live roster has kept changing since.
    const championLine = (gs.championshipTeam && gs.championshipTeam.length)
      ? '<div class="save-slot-meta" style="margin-top:6px;">&#127942; Beat the Champion with:</div>' + championTeamRowHtml(gs.championshipTeam)
      : '';
    return '<div class="save-slot-card">' +
        '<button type="button" class="save-slot-delete-btn" data-action="deleteSlot" data-slot="'+slot+'" title="Delete this save" aria-label="Delete this save">&times;</button>' +
        '<div class="save-slot-row">' +
          '<div class="save-slot-main">' +
            '<div class="save-slot-title">'+regionLabel+'</div>' +
            '<div class="save-slot-meta">At '+locName+' &middot; '+badges+' badge'+(badges===1?'':'s')+' &middot; Turn '+(gs.turnCount||0)+'</div>' +
            seedLine +
            championLine +
            '<div class="choice-grid">' +
              '<button type="button" class="btn btn-primary" data-action="continueSlot" data-slot="'+slot+'">Continue</button>' +
            '</div>' +
          '</div>' +
          saveSlotTeamHtml(slot) +
        '</div>' +
      '</div>';
  }).join('');
  if(!cards){
    cards = '<div class="save-slot-card save-slot-empty"><div class="save-slot-meta">No adventures yet -- start one below.</div></div>';
  }
  return '<div class="card">' +
    '<div class="card-title">Pok&eacute;mon Adventure</div>' +
    '<div class="card-sub">Your saved adventures</div>' +
    '<div class="choice-grid" style="margin-bottom:10px;"><button type="button" class="btn" data-action="showHowToPlay">How to Play</button></div>' +
    cards +
    '<div class="choice-grid" style="margin-top:10px;"><button type="button" class="btn btn-primary" data-action="createNewAdventure">Start New Adventure</button></div>' +
  '</div>';
}

// Page <title> + masthead brand -- region-neutral on the home/region-pick
// screens, "{Region} Adventure" once a specific region is actually active.
function updateRegionBranding(regionKey, explicitLabel){
  const label = explicitLabel || (regionKey && REGIONS[regionKey] ? REGIONS[regionKey].label : null);
  document.title = (label ? label + ' Adventure' : 'Pokémon Adventure') + ' -- Play';
  const brandEl = document.getElementById('brandLabel');
  if(brandEl) brandEl.textContent = label ? label + ' Adventure' : 'Pokémon Adventure';
}

function goHome(){
  currentSlot = null;
  gameState = null;
  DATA = null;
  startPick = { region:null, starter:null, town:null };
  updateRegionBranding(null);
  view = 'home';
  encounter = null;
  movement = null;
  activeGameTab = 'map';
  dataBuilt = false;
  tmFlow = null;
  pendingTmOffer = false;
  customRegion = null;
  render();
}
function continueSlot(slot){
  currentSlot = slot;
  gameState = loadGameState();
  DATA = gameState.region === 'custom' ? loadCustomRegionData(slot) : REGIONS[gameState.region].data;
  rebuildNodesById();
  // A custom region's starter species aren't baked into STARTERS_BY_REGION
  // like the 3 real regions are -- restore them from the reloaded DATA so
  // anything that reads STARTERS_BY_REGION.custom (the start screen, the
  // Pokedex tab's "starters first" sort) stays correct after a reload,
  // not just right after generation.
  if(gameState.region === 'custom' && DATA) STARTERS_BY_REGION.custom = DATA.starterSpecies || [];
  updateRegionBranding(gameState.region, regionLabelFor(gameState));
  startPick = { region:null, starter:null, town:null };
  view = gameState.started ? 'board' : 'start';
  encounter = null;
  movement = null;
  activeGameTab = 'map';
  dataBuilt = false;
  tmFlow = null;
  pendingTmOffer = false;
  render();
}
// Always a fresh slot (never overwrites an existing adventure) -- the
// player deletes old ones explicitly via deleteSlot instead.
function createNewAdventure(){
  currentSlot = nextFreeSlotId();
  gameState = loadGameState();
  startPick = { region:null, starter:null, town:null };
  challengeModes = { levelCap:false };
  teamBuilderSelectedIds = [];
  view = 'regionPick';
  encounter = null;
  movement = null;
  tutorialSeenTips = new Set(); // a fresh adventure always sees tutorial tips from the start
  render();
}
function deleteSlot(slot){
  const gs = loadGameStateFromSlot(slot);
  const desc = gs ? (gs.starterSpecies+' -- '+(gs.defeatedGymLeaders||[]).length+' badges, Turn '+(gs.turnCount||0)) : ('Slot '+slot);
  if(!confirm('Delete this save (' + desc + ')? This cannot be undone.')) return;
  localStorage.removeItem(gameKey(slot));
  localStorage.removeItem(gamePokemonKey(slot));
  localStorage.removeItem(customRegionDataKey(slot));
  render();
}
// Called from the region-pick screen -- points DATA at the chosen region and
// proceeds to the familiar starter+town screen, now correctly scoped to it.
function pickRegion(key){
  DATA = REGIONS[key].data;
  rebuildNodesById();
  updateRegionBranding(key);
  startPick.region = key;
  // The Tutorial stays a short, guided path straight to starter+town --
  // every other region offers the optional Challenge Modes screen first.
  view = key === 'tutorial' ? 'start' : 'challengeModes';
  activeGameTab = 'map';
  dataBuilt = false;
  tmFlow = null;
  pendingTmOffer = false;
  render();
}
// Commits the currently-previewed Custom Region (browsed/rerolled via
// "Generate Another") to this save slot and starts the same familiar
// starter+town flow as pickRegion() -- just sourced from a freshly built
// DATA object instead of one of the 3 shared REGIONS entries, and persisted
// to its own per-slot key since it's unique to this playthrough.
function playCustomRegion(){
  if(!customRegion) customRegion = generateCustomRegionDataFromSeed();
  // Re-seed for this step too (trainer tables, etc. -- see withSeededRandom)
  // so the same shared seed reproduces the exact same playable experience,
  // not just the previewed map/dex/gyms.
  const { data, label } = customRegion.seed
    ? withSeededRandom(customRegion.seed, () => buildPlayableCustomRegionData(customRegion))
    : buildPlayableCustomRegionData(customRegion);
  try { localStorage.setItem(customRegionDataKey(), JSON.stringify(data)); }
  catch(e){ console.error('Could not save custom region data', e); }
  DATA = data;
  rebuildNodesById();
  STARTERS_BY_REGION.custom = data.starterSpecies;
  updateRegionBranding('custom', label);
  startPick.region = 'custom';
  view = 'challengeModes';
  activeGameTab = 'map';
  dataBuilt = false;
  tmFlow = null;
  pendingTmOffer = false;
  render();
}

// 50-Turn Team Builder: how many of the player's owned Pokemon they're allowed
// to select for export -- 1 per 2 Gym Badges earned, plus 2 more once the
// Elite Four + Champion have been beaten, capped at 6 (the natural max: 8
// badges / 2 = 4, +2).
function teamBuilderMaxSelectable(){
  const badges = (gameState.defeatedGymLeaders||[]).length;
  const bonus = gameState.championDefeated ? 2 : 0;
  return Math.min(6, Math.floor(badges/2) + bonus);
}
function shouldPromptTeamBuilder(){
  return !!(gameState.challengeModes && gameState.challengeModes.teamBuilder50) &&
    (gameState.turnCount||0) >= 50 &&
    !gameState.teamBuilderExported;
}
// Deliberately plain, human-readable text -- not JSON -- so it's easy to eyeball
// and paste into whatever simulator eventually reads it.
function teamBuilderMonExportText(m){
  const level = m.ev.reduce((a,b)=>a+b,0);
  const stats = m.base.map((b,i)=>b+m.ev[i]);
  const typeStr = [m.t1, m.t2].filter(Boolean).join(' / ');
  return m.name+' Lv'+level+'\n' +
    'Type: '+typeStr+'\n' +
    'Attack: '+m.atk+'\n' +
    'HP '+stats[0]+' / Atk '+stats[1]+' / Def '+stats[2]+' / SpA '+stats[3]+' / SpD '+stats[4]+' / Spe '+stats[5];
}
function teamBuilderExportText(){
  const list = loadGamePokemon();
  const selected = teamBuilderSelectedIds.map(id=>list.find(m=>m.id===id)).filter(Boolean);
  return selected.map(teamBuilderMonExportText).join('\n\n');
}
function renderTeamBuilderExportScreen(){
  const max = teamBuilderMaxSelectable();
  const badges = (gameState.defeatedGymLeaders||[]).length;
  const mons = loadGamePokemon();
  const cards = mons.map(m=>{
    const selected = teamBuilderSelectedIds.includes(m.id);
    const atLimit = !selected && teamBuilderSelectedIds.length >= max;
    const label = selected ? 'Selected -- Remove' : (max === 0 ? 'Not Eligible Yet' : (atLimit ? 'Limit Reached' : 'Select'));
    const btn = '<div class="choice-grid" style="margin-top:8px;">' +
      '<button type="button" class="btn'+(selected?' btn-primary':'')+'" data-action="toggleTeamBuilderMon" data-id="'+m.id+'"'+(atLimit?' disabled':'')+'>'+label+'</button>' +
    '</div>';
    return monStatCardHtml(m, btn);
  }).join('');
  const exportText = teamBuilderExportText();
  const exportBlock = exportText
    ? '<div class="field-label" style="margin-top:16px;">Export (click the box, then copy)</div>' +
      '<textarea readonly class="team-export-box" onclick="this.select()">'+exportText.replace(/</g,'&lt;')+'</textarea>'
    : '<div class="empty-note">Select at least one Pokemon to see its export text.</div>';
  return '<div class="card">' +
    '<div class="card-title">Team Builder Export</div>' +
    '<div class="card-sub">Turn 50 reached -- pick your team for the upcoming battle simulator</div>' +
    '<div class="card-flavor">You may select up to '+max+' Pokemon ('+Math.floor(badges/2)+' from '+badges+' badge'+(badges===1?'':'s')+(gameState.championDefeated?' + 2 for beating the Champion':'')+').</div>' +
    '<div class="field-label">Selected: '+teamBuilderSelectedIds.length+' / '+max+'</div>' +
    (mons.length ? cards : '<div class="empty-note">No Pokemon caught yet.</div>') +
    exportBlock +
    '<div class="choice-grid" style="margin-top:16px;"><button type="button" class="btn btn-primary" data-action="confirmTeamBuilderExport">Continue</button></div>' +
  '</div>';
}

// Shared "one Pokemon, full detail" card -- types, attack type (in parens,
// matching the Field Guide's own convention), every stat plus the total, and
// current XP progress. `actionHtml`, if given, is appended inside the card
// (e.g. a "Send Out" button); omit it for a plain read-only roster view.
// Compact evolution status for the owned-mon card's stat row -- sits to the
// right of the XP chip so the player can see what's coming without opening
// the Pokedex tab. Mirrors the level/friendship-vs-item method parsing that
// checkAndApplyLevelEvolution() and evoRequiredLevel() already use.
function monEvolutionChipHtml(m){
  const info = DATA.evoInfo[m.name];
  if(!info || !info.evolvesInto || !info.evolvesInto.length){
    return '';
  }
  const parts = info.evolvesInto.map(branch=>{
    let detail;
    if(branch.method.indexOf('Friendship') !== -1){
      detail = 'Friendship, Lv ' + ((m.catchLevel||0) + 4) + '+';
    } else {
      const req = evoRequiredLevel(branch.method);
      detail = req !== null ? ('Level ' + req) : branch.method;
    }
    return '<b>' + branch.species + '</b> (' + detail + ')';
  });
  return '<span class="stat-chip">Evolves into ' + parts.join(', ') + '</span>';
}
function monStatCardHtml(m, actionHtml){
  const level = m.ev.reduce((a,b)=>a+b,0);
  const finalStats = m.base.map((b,i)=>b+m.ev[i]);
  return '<div class="mon-detail-card">' +
    spriteImgHtml(m.name, 'sprite-lg') +
    '<div class="mon-detail-name">'+m.name+' Lv '+level+'</div>' +
    trainerTypeBlockHtml(m.t1, m.t2, m.atk) +
    statRowHtml(finalStats) +
    '<div class="stat-row"><span class="stat-chip">' + (level >= MAX_LEVEL
      ? 'XP <b>'+(m.xp||0)+'</b> / ∞'
      : 'XP <b>'+(m.xp||0)+'</b> / '+(level*10)+' to next level') + '</span>' +
      monEvolutionChipHtml(m) +
    '</div>' +
    (actionHtml || '') +
  '</div>';
}

function ownedMonPickerHtml(excludeIds, opp){
  const mons = loadGamePokemon().filter(m=>!excludeIds.has(m.id));
  if(!mons.length) return '<div class="empty-note">No available Pokemon left to send out.</div>';
  const ranked = mons.map(m=>{
    const finalStats = m.base.map((b,i)=>b+m.ev[i]);
    const odds = winOdds(finalStats, [m.t1, m.t2], m.atk, opp.statsArr, opp.types, opp.atk);
    return { m, odds };
  }).sort((a,b) => b.odds.winA - a.odds.winA); // best odds first
  return ranked.map(({m, odds})=>{
    const oddsText = odds.unbreakable ? 'Tied forever -- identical matchup' : Math.round(odds.winA*100)+'% to win this exchange';
    const oddsBg = odds.unbreakable ? 'var(--sage)' : (odds.winA >= 0.5 ? '#d7ecd2' : '#f3d9ce');
    return monStatCardHtml(m,
      '<div class="stat-row"><span class="stat-chip" style="background:'+oddsBg+';">Win odds <b>'+oddsText+'</b></span></div>' +
      '<div class="choice-grid" style="margin-top:8px;">' +
        '<button type="button" class="btn btn-primary" data-action="pickPlayerMon" data-id="'+m.id+'">Send Out '+m.name+'</button>' +
      '</div>'
    );
  }).join('');
}

function fmtEffMult(mult){
  if(mult >= 4) return '×4';
  if(mult === 2) return '×2';
  if(mult === 1) return '×1';
  if(mult === 0.5) return '×½';
  if(mult === 0.25) return '×¼';
  return '×0';
}
// One side's whole column: sprite, name, types, attack type, and how effective its
// attack is against the OTHER side -- all stacked in one column so the two sides can
// never drift out of alignment with each other the way two separately-centered rows can.
function battleSideHtml(name, t1, t2, atk, effMult){
  return '<div class="dice-side">' +
    spriteImgHtml(name, 'sprite-battle') +
    '<div class="dice-group-label">'+name+'</div>' +
    '<div class="battle-type-pills">'+typePillHtml(t1)+typePillHtml(t2)+'</div>' +
    '<div class="battle-type-pills">'+typePillHtml(atk)+'</div>' +
    (effMult != null ? '<div class="battle-eff-label">'+fmtEffMult(effMult)+'</div>' : '') +
  '</div>';
}
// Sits right above the dice stage (or the Fight button, when not yet rolling), so it's
// always the header of "who's fighting, with what, and how well it'll work."
function battlePanelHtml(nameA, t1A, t2A, atkA, effA, nameB, t1B, t2B, atkB, effB){
  return '<div class="dice-stage">' +
    battleSideHtml(nameA, t1A, t2A, atkA, effA) +
    '<span class="vs-label">vs</span>' +
    battleSideHtml(nameB, t1B, t2B, atkB, effB) +

}
function diceStageHtml(rb){
  const pick = (arr)=>arr[Math.floor(Math.random()*arr.length)];
  const diceA = Array.from({length: rb.nA}, (_,i)=>'<div class="die" id="battleDieA'+i+'">'+pick(rb.statsA)+'</div>').join('');
  const diceB = Array.from({length: rb.nB}, (_,i)=>'<div class="die" id="battleDieB'+i+'">'+pick(rb.statsB)+'</div>').join('');
  return '<div class="field-label" style="text-align:center;">Rolling...</div>' +

// ============ TM (attack-type change) flow ============
// Walks WHEEL by `radius` steps in each direction from `type` -- negative
// direction (array index going down) is "counterclockwise", positive is
// "clockwise", matching the convention fixedAttackType() already uses for
// gym slot 3 (+1, clockwise) and slot 4 (-1, counterclockwise).
function wheelNeighbors(type, radius){
  const idx = WHEEL.indexOf((type||'').toLowerCase());
  if(idx === -1) return { ccw: [], cw: [] };
  const n = WHEEL.length;
  const ccw = [], cw = [];
  // WHEEL itself is all-lowercase (a lookup table) -- cap() so both the on-screen
  // label and the stored value (picking a button sets m.atk to this string) match
  // the Title Case convention used everywhere else a type is stored, e.g. cap()'d
  // in fixedAttackType()'s own callers.
  for(let d = radius; d >= 1; d--) ccw.push(cap(WHEEL[(idx - d + n*radius) % n]));
  for(let d = 1; d <= radius; d++) cw.push(cap(WHEEL[(idx + d) % n]));
  return { ccw, cw };
}
function tmTypeButtonHtml(type){
  const c = TYPE_COLOR[type.toLowerCase()] || '#888';
  return '<button type="button" class="tm-type-btn" data-action="chooseTmType" data-type="'+type+'" style="background:'+c+';">'+type+'</button>';
}
function startTmPick(){
  pendingTmOffer = false;
  view = 'tmPickMon';
  render();

function skipTm(){
  tmFlow = null;

}
function pickTmMon(monId){

function chooseTmType(type){
  if(!tmFlow) return;
  const list = loadGamePokemon();
  const m = list.find(x=>x.id === tmFlow.monId);
  if(!m) return;
  const oldAtk = m.atk;
  m.atk = type;
  saveGamePokemonList(list);
  tmFlow = null;
  pendingMessage = m.name+'\'s attack type changed from '+oldAtk+' to '+type+'!';
  pendingTmOffer = false;
  view = 'message';
  render();
}

function renderTmPickTypeScreen(){
  const list = loadGamePokemon();
  const m = tmFlow && list.find(x=>x.id === tmFlow.monId);
  if(!m) return renderTmPickMonScreen();
  const current = (m.atk||'').toLowerCase();
  const { ccw, cw } = wheelNeighbors(current, 2);
  const wheelSet = new Set([...ccw, ...cw]);
  const trueTypes = [m.t1, m.t2].filter(Boolean)
    .filter(t => t.toLowerCase() !== current && !wheelSet.has(t.toLowerCase()));

  const currentPill =
    '<span class="tm-wheel-current" style="background:'+(TYPE_COLOR[current]||'#888')+';">' +
      current + '<div class="tm-wheel-current-label">current</div>' +
    '</span>';
  const stripItems = [...ccw.map(tmTypeButtonHtml), currentPill, ...cw.map(tmTypeButtonHtml)];
  const wheelStripHtml = '<div class="tm-wheel-row">' + stripItems.join('<span class="tm-wheel-link">&rarr;</span>') + '</div>';

  const trueTypeHtml = trueTypes.length
    ? '<div class="field-label" style="margin-top:14px;">'+m.name+'\'s own type'+(trueTypes.length>1?'s':'')+'</div>' +
      '<div class="tm-truetype-row">' + trueTypes.map(tmTypeButtonHtml).join('') + '</div>'
    : '';

  return '<div class="card">' +
    '<div class="card-title">Use a TM on '+m.name+'</div>' +
    '<div class="card-sub">Pick a new attack type -- limited to '+m.name+'\'s own type(s) plus the 2 types on either side of its current attack type on the wheel.</div>' +
    monStatCardHtml(m) +
    '<div class="field-label" style="margin-top:14px;">Wheel-adjacent types</div>' +
    wheelStripHtml +
    trueTypeHtml +
    '<div class="choice-grid" style="margin-top:14px;"><button type="button" class="btn" data-action="backToTmPickMon">Back</button></div>' +
  '</div>';
}
