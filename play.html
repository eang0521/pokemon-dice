<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calli Adventure -- Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --paper-deep:#E2D9C4;
    --ink:#1F2E3D;
    --redwood:#2F4538;
    --rust:#C4572E;
    --gold:#D9A441;
    --sage:#8AA399;
    --nogym-green:#5B8A4E;
    --line: rgba(31,46,61,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(196,87,46,0.07), transparent 40%),
      radial-gradient(circle at 85% 82%, rgba(47,69,56,0.08), transparent 45%),
      repeating-linear-gradient(0deg, transparent, transparent 38px, var(--line) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, var(--line) 39px);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 14px 80px;
  }
  .sheet{ width:100%; max-width: 720px; }
  .masthead{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 4px 14px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 16px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 22px;
    color: var(--redwood);
  }
  .nav-link{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    color: var(--ink);
    text-decoration:none;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 6px 10px;
    background: var(--paper-deep);
  }
  .nav-link:hover{ background: var(--gold); }
  .status-strip{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .status-badges{
    background: var(--gold);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
    cursor:pointer;
  }
  .status-badges:hover{ background:#c4923a; }
  .badge-panel{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 12px;
    margin: -6px 0 16px;
  }
  .badge-panel-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge-box{
    width: 46px;
    height: 46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    border: 1.5px solid var(--ink);
    border-radius: 5px;
    letter-spacing:0.02em;
  }
  .status-turns{
    background: var(--sage);
    color: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
  }
  .reset-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--ink);
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 5px 9px;
    cursor:pointer;
  }
  .reset-btn:hover{ background:#e8bdb0; }
  .card{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    margin-bottom: 10px;
  }
  .card-flavor{ font-size:13px; font-style:italic; color:#3c4f45; margin-bottom:10px; }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight:600;
    padding: 10px 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    cursor:pointer;
  }
  .btn:hover{ background: var(--gold); }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--gold); }
  .btn-primary:hover{ background:#c4923a; }
  .btn-wild{ background: var(--nogym-green); color:var(--paper); }
  .btn-wild:hover{ background:#4a7440; }
  .btn-danger{ background: var(--rust); color:var(--paper); }
  .btn-danger:hover{ background:#a8451f; }
  .choice-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .type-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 10px;
    margin-right:4px;
  }
  .stat-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin: 8px 0;
  }
  .stat-chip{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
  }
  .stat-chip b{ color: var(--redwood); }
  .starter-grid{ display:grid; grid-template-columns: 1fr; gap:10px; }
  @media (min-width:560px){ .starter-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .starter-card{
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 12px;
    cursor:pointer;
    text-align:center;
  }
  .starter-card.selected{ border-color: var(--rust); background: #f3d9ce; }
  .starter-card h3{ font-family:'Fraunces', serif; margin: 6px 0 4px; }
  .town-grid{ display:flex; flex-wrap:wrap; gap:6px; max-height:220px; overflow-y:auto; margin-top:6px; padding:2px; }
  .town-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    cursor:pointer;
  }
  .town-btn.selected{ background: var(--gold); }
  .mon-detail-card{
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 10px;
  }
  .mon-detail-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .trainer-type-block{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .trainer-type-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .trainer-mon-types{ display:flex; gap:5px; }
  .trainer-atk-paren{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .trainer-type-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight:600;
    color:#fff;
    padding: 3px 9px;
    border-radius: 12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .trainer-atk-pill{ box-shadow: 0 0 0 2px var(--gold); }
  .opp-team-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0 12px; }
  .opp-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .opp-chip.current{ background: var(--gold); font-weight:700; }
  .opp-chip.defeated{ opacity:0.45; text-decoration: line-through; }
  .log-box{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    max-height: 220px;
    overflow-y:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin-top: 10px;
  }
  .log-line{ padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log-line:last-child{ border-bottom:none; }
  .empty-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--sage);
    text-align:center;
    padding: 12px 0;
  }
  .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    display:block;
    margin: 10px 0 4px;
  }
  .dice-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin: 14px 0 4px;
  }
  .dice-group{ display:flex; gap:8px; }
  .dice-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--sage);
    text-align:center;
    margin-bottom:6px;
  }
  .dice-side{ display:flex; flex-direction:column; align-items:center; }
  .die{
    min-width:44px; height:44px;
    padding: 0 5px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight:600;
    font-variant-numeric: tabular-nums;
  }
  .die.rolling{ animation: dieTumble .09s linear infinite; }
  .die.die-kept{
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
  }
  @keyframes dieTumble{
    0%{ transform: rotate(0deg) scale(1); }
    50%{ transform: rotate(8deg) scale(1.05); }
    100%{ transform: rotate(-6deg) scale(1); }
  }
  .vs-label{
    font-family:'Fraunces', serif;
    font-size:18px;
    color: var(--redwood);
    align-self:center;
    margin-top: 18px;
  }
  .map-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-swatch{ display:inline-block; width:11px; height:11px; }
  .legend-town{ background: var(--gold); border: 1.5px solid var(--ink); }
  .legend-town-nogym{ background: var(--nogym-green); border: 1.5px solid var(--ink); }
  .legend-dungeon{
    width:0; height:0;
    background: transparent;
    border-left: 5.5px solid transparent;
    border-right: 5.5px solid transparent;
    border-bottom: 10px solid var(--rust);
  }
  .legend-route{ background: var(--sage); border: 1.5px solid var(--ink); border-radius:50%; }
  .map-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    -webkit-overflow-scrolling: touch;
  }
  #mapSvg{ display:block; }
  .map-node{ cursor:pointer; }
  .map-node-shape{
    stroke: var(--ink);
    stroke-width: 1.5;
    transition: stroke-width .12s ease, filter .12s ease;
  }
  .map-node:hover .map-node-shape{ stroke-width: 2.5; }
  .map-node.player-here .map-node-shape{
    stroke: var(--rust);
    stroke-width: 3.5;
    filter: drop-shadow(0 0 4px var(--rust));
  }
  .map-node.can-move .map-node-shape{
    stroke: var(--gold);
    stroke-width: 3;
    filter: drop-shadow(0 0 5px var(--gold));
  }
  .map-node.can-move{ cursor:pointer; }
  .map-node.selected .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  .map-node-label{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    pointer-events:none;
    fill: var(--ink);
  }
  .map-node-label-light{ fill: var(--paper); }
  .map-node-divider{
    stroke: var(--ink);
    stroke-width: 1.5;
    pointer-events:none;
  }
  .map-edge{
    stroke: var(--ink);
    stroke-width: 1.5;
    opacity: 0.35;
  }
  .map-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--redwood);
    margin-top: 8px;
    min-height: 16px;
  }
  .map-info{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1.5px dashed var(--ink);
    min-height: 50px;
  }
  .map-info-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--sage);
    text-align:center;
  }
  .map-info-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 18px;
    margin-bottom:4px;
  }
  .map-info-kind{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-bottom: 8px;
  }
  .map-info-desc{
    font-size: 13px;
    line-height:1.5;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-info-evo{
    font-size: 12.5px;
    line-height:1.5;
    color: var(--ink);
    background: rgba(201, 162, 39, 0.16);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 10px;
  }
  .map-go-btn{
    padding: 9px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    background: var(--rust);
    color: var(--paper);
    border:none;
    border-radius: 4px;
    cursor:pointer;
    margin-bottom: 10px;
  }
  .map-go-btn:hover{ background:#a9481f; }
  .map-encounter-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-top: 10px;
    margin-bottom: 7px;
  }
  .map-encounter-list{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .map-encounter-row{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 8px;
  }
  .map-encounter-sum{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size: 11px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 3px;
    width: 18px;
    height: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .map-encounter-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 13px;
    flex: 1;
  }
  .map-encounter-types{ display:flex; gap:4px; }
  .section-toggle{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:0;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 17px;
    color: var(--ink);
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <span class="brand">Calli Adventure</span>
    <a class="nav-link" href="index.html">&larr; Field Guide</a>
  </div>
  <div class="status-strip" id="statusStrip"></div>
  <div class="badge-panel" id="badgePanel" style="display:none;"></div>
  <div id="app"></div>
  <div class="card" id="mapCard" style="display:none;">
    <div class="map-legend">
      <span><span class="legend-swatch legend-town"></span>Gym town</span>
      <span><span class="legend-swatch legend-town-nogym"></span>Town, no gym</span>
      <span><span class="legend-swatch legend-dungeon"></span>Dungeon</span>
      <span><span class="legend-swatch legend-route"></span>Route</span>
    </div>
    <div class="map-scroll"><svg id="mapSvg" viewBox="0 0 0 0"></svg></div>
    <div class="map-hint" id="mapHint"></div>
    <div class="map-info" id="mapInfo"></div>
  </div>
  <div class="card" id="myPokemonCard" style="display:none;">
    <button type="button" class="section-toggle" id="myPokemonToggle"></button>
    <div id="myPokemonList" style="display:none;"></div>
  </div>
</div>

<script>
try {

/* ============ Calli data (duplicated from index.html -- see Dice_Region_Ruleset.md

function buildThresholds(){

  return [
    {min:0, max:0, T:2},
    {min:1, max:q1, T:3},
    {min:q1+1, max:q2, T:4},
    {min:q2+1, max:q3, T:5},
    {min:q3+1, max:max, T:6},
  ];
}

// Cycles a die square through the Pokemon's own possible stat values (its face is
// literally which stat got picked), then settles on finalFace -- the actual rolled
// result, not a cosmetic one.
async function tumble(el, durationMs, possibleValues, finalFace){
  if(!el) return;
  el.classList.add('rolling');
  const steps = Math.max(1, Math.round(durationMs/85));
  for(let i=0;i<steps-1;i++){
    el.textContent = possibleValues[Math.floor(Math.random()*possibleValues.length)];
    await sleep(85);
  }
  el.textContent = finalFace;
  el.classList.remove('rolling');
  await sleep(85);
}
function wheelShift(sum){
  if(sum===2) return -2;
  if(sum===3||sum===4) return -1;
  if(sum>=5 && sum<=9) return 0;
  if(sum===10||sum===11) return 1;
  if(sum===12) return 2;
  return 0;
}
function randomAttackType(t1, t2){
  const types = [t1, t2].filter(Boolean).map(t=>t.toLowerCase());
  const baseType = types[Math.floor(Math.random()*types.length)];
  const shift = wheelShift(rand(6) + rand(6));
  const baseIdx = WHEEL.indexOf(baseType);
  const finalIdx = ((baseIdx + shift) % WHEEL.length + WHEEL.length) % WHEEL.length;
  return cap(WHEEL[finalIdx]);
}
function pickHighestIndex(stats){
  const max = Math.max(...stats);
  const candidates = [];
  stats.forEach((v,i)=>{ if(v===max) candidates.push(i); });
  return candidates[Math.floor(Math.random()*candidates.length)];
}
function distributeLevelBonus(stats, level){
  const idx = [0,1,2,3,4,5];
  for(let i=idx.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]] = [idx[j],idx[i]];
  }
  idx.sort((a,b) => stats[b]-stats[a]);
  const bonus = [0,0,0,0,0,0];
  const fullCycles = Math.floor(level/6);
  const remainder = level%6;
  for(let k=0;k<6;k++){ bonus[idx[k]] = fullCycles; }
  for(let k=0;k<remainder;k++){ bonus[idx[k]] += 1; }
  return bonus;
}
function trainerTeamSize(badges){
  if(badges===0) return 1;
  if(badges<=2) return 2;
  if(badges<=4) return 3;
  if(badges<=6) return 4;
  return 5;
}
function pickStageForLevel(rootEntry, level){
  const root = Array.isArray(rootEntry) ? rootEntry[0] : rootEntry;
  const forcedBranch = Array.isArray(rootEntry) ? rootEntry[1] : null;
  const chain = DATA.trainerChain[root] || [root];
  let chosen = chain[0];
  for(const stage of chain){
    if(Array.isArray(stage)){
      const eligible = stage.filter(sp => {
        const lvl = DATA.trainerMinLevel[sp];
        return lvl !== undefined && lvl <= level;
      });
      if(eligible.length){
        chosen = (forcedBranch && eligible.includes(forcedBranch))
          ? forcedBranch
          : eligible[Math.floor(Math.random() * eligible.length)];
      }
      continue;
    }
    const lvl = DATA.trainerMinLevel[stage];
    if(lvl !== undefined && lvl <= level){
      chosen = stage;
    }
  }
  return chosen;
}
function fixedAttackType(finalSpecies, slotKey){
  const types = DATA.types[finalSpecies] || ['Normal', null];
  const primary = (types[0] || 'normal').toLowerCase();
  const secondary = types[1] ? types[1].toLowerCase() : null;
  const baseType = (slotKey === '2') ? (secondary || primary) : primary;
  const idx = WHEEL.indexOf(baseType);
  let shift = 0;
  if(slotKey === '3') shift = 1;
  if(slotKey === '4') shift = -1;
  const finalIdx = ((idx + shift) % WHEEL.length + WHEEL.length) % WHEEL.length;
  return WHEEL[finalIdx];
}

// One die per cfg.n: its displayed face is the value of whichever of the 6 stats
// (including EVs) got picked, PLUS this side's STAB bonus baked in on every die (not
// just the kept one) -- since STAB is a flat +1 either way, showing it pre-added lets
// the two sides' dice be compared face-to-face to see who's ahead, no mental math
// needed. The kept die (best-or-worst per cfg.mode) is flagged by index for the UI.
function rollSide(finalStats, cfg, stabBonus){
  const picks = [];
  let kept = null, keptIdx = 0;
  for(let i=0;i<cfg.n;i++){
    const idx = Math.floor(Math.random()*6);
    const val = finalStats[idx];
    picks.push(val + stabBonus);
    if(kept===null || (cfg.mode==='worst' ? val<kept : val>kept)){
      kept = val;
      keptIdx = i;
    }
  }
  return { picks, keptIdx, kept, final: kept + stabBonus };
}

    }
    for(let i=0;i<6;i++){
      const val = finalStats[i];
      const nextKept = (kept === null) ? val
        : (cfg.mode === 'worst' ? Math.min(kept, val) : Math.max(kept, val));
      rec(depth+1, nextKept);
    }
  }
  rec(0, null);
  const dist = new Map();
  for(const [v,c] of counts) dist.set(v, c/total);
  return dist;
}
// Ties reroll rather than counting as a draw -- since every reroll repeats
// the same two distributions, the post-reroll odds are just the one-shot
// win probabilities renormalized by 1/(1-P(tie)). A "perpetual tie" (every
// pairing ties) can never resolve -- flagged via `unbreakable`.
function crossOdds(distA, distB){
  let winA=0, winB=0, tie=0;
  for(const [a,pa] of distA){
    for(const [b,pb] of distB){
      const p = pa*pb;
      if(a>b) winA += p;
      else if(b>a) winB += p;
      else tie += p;
    }
  }
  const decided = winA + winB;
  if(decided <= 1e-12) return {winA:0, winB:0, unbreakable:true};
  return {winA: winA/decided, winB: winB/decided, unbreakable:false};
}
// Exact post-reroll odds that A beats B in one exchange (§14) -- same STAB
// and attacker-vs-opponent-types wiring as resolveBattle, just computing the
// full distribution instead of rolling once.
function winOdds(statsA, typesA, atkA, statsB, typesB, atkB){
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? 1 : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? 1 : 0;
  return crossOdds(resultDistribution(statsA, cfgA, stabA), resultDistribution(statsB, cfgB, stabB));
}

function neighborsOf(nodeId){
  const out = [];
  DATA.mapEdges.forEach(([a,b])=>{
    if(a===nodeId) out.push(b);
    else if(b===nodeId) out.push(a);
  });
  return out;
}
// Every node reachable within 1..maxDist steps of startId, shortest-path distance,
// as a Map<nodeId, distance> -- startId itself is never included, since a move
// always has to go somewhere (no staying put and "using" the roll on nothing).
function reachableWithin(startId, maxDist){
  const dist = new Map();
  let frontier = [startId];
  dist.set(startId, 0);
  for(let d=1; d<=maxDist; d++){
    const next = [];
    frontier.forEach(id=>{
      neighborsOf(id).forEach(nid=>{
        if(!dist.has(nid)){ dist.set(nid, d); next.push(nid); }
      });
    });
    frontier = next;
    if(!frontier.length) break;
  }
  dist.delete(startId);
  return dist;
}

}

/* ============ XP & leveling ============ */
function splitXP(total, participantIds){
  const n = participantIds.length;
  if(n===0) return [];
  const base = Math.floor(total/n);
  const remainder = total - base*n;
  return participantIds.map((id,i)=>({ id, xp: base + (i >= n-remainder ? 1 : 0) }));
}
function grantXP(entry, xpGain, highIdx){
  entry.xp = (entry.xp || 0) + xpGain;
  let level = entry.ev.reduce((a,b)=>a+b,0);
  while(entry.xp >= level*10 && level>0){
    entry.xp -= level*10;
    entry.ev[highIdx] = (entry.ev[highIdx]||0) + 1;
    level += 1;
  }
}
function statTotal(statsArr){ return statsArr.reduce((a,b)=>a+b,0); }

// Only methods with an explicit "Level N" have a level this can check directly
// (friendship's threshold is relative to catch level, handled separately).
function evoRequiredLevel(method){
  const m = method.match(/Level (\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

// Level-up (and friendship) evolution -- checked right after XP is granted,
// separate from the town-item evolve flow (which only ever handles item/trade
// branches). Triggers automatically, no confirmation, matching mainline: a
// friendship branch's threshold is "level >= level caught at + 4" (SS11 of the
// ruleset); a plain level branch just needs an explicit "Level N" in its
// method text. Loops in case evolving lands it on another already-eligible
// stage. Returns an array of "X evolved into Y!" messages for the caller to
// surface (e.g. into the encounter log).
function checkAndApplyLevelEvolution(entry){
  const messages = [];
  while(true){
    const info = DATA.evoInfo[entry.name];
    if(!info || !info.evolvesInto || !info.evolvesInto.length) break;
    const level = entry.ev.reduce((a,b)=>a+b,0);
    let target = null;
    for(const branch of info.evolvesInto){
      if(branch.method.indexOf('Friendship') !== -1){
        if(level >= (entry.catchLevel||0) + 4){ target = branch.species; break; }
      } else {
        const req = evoRequiredLevel(branch.method);
        if(req !== null && level >= req){ target = branch.species; break; }
      }
    }
    if(!target) break;

    const oldName = entry.name;
    entry.name = target;
    const types = DATA.types[target] || [null, null];
    entry.t1 = types[0] || null;
    entry.t2 = types[1] || null;
    entry.base = (DATA.dice[target] || [0,0,0,0,0,0]).slice();
    messages.push(oldName + ' evolved into ' + target + '!');

    const rolledAtk = randomAttackType(entry.t1, entry.t2);
    if(rolledAtk !== entry.atk && confirm('Change '+entry.name+'\'s attack type from '+entry.atk+' to '+rolledAtk+'?')){
      entry.atk = rolledAtk;
    }
  }
  return messages;
}

// Level-up evolution is checked once the WHOLE encounter is over, not after
// each individual opponent's XP grant -- a Pokemon that levels up against
// opponent 2 of 5 keeps fighting the rest of that battle as its pre-evolution
// self, only evolving once there's no more of the encounter left for the
// change to affect. `recipientIds` is every Pokemon that gained XP anywhere
// during the encounter, tracked as it happens and resolved here at the end.
function resolveDeferredEvolutions(recipientIds){
  if(!recipientIds || !recipientIds.size) return '';
  const list = loadGamePokemon();
  const messages = [];
  recipientIds.forEach(id=>{
    const mon = list.find(x=>x.id===id);
    if(mon) checkAndApplyLevelEvolution(mon).forEach(msg => messages.push(msg));
  });
  saveGamePokemonList(list);
  return messages.length ? (' ' + messages.join(' ')) : '';
}

/* ============ Rolling opponents ============ */
function rollOneDieWithThreshold(T){
  let v = rand(6);
  while(v>T){ v = rand(6); }
  return v;
}
function rollTrueTypeAttack(types){
  const typesLower = types.filter(Boolean).map(t=>t.toLowerCase());
  const baseType = typesLower[Math.floor(Math.random()*typesLower.length)];
  const shift = wheelShift(rand(6)+rand(6));
  const baseIdx = WHEEL.indexOf(baseType);
  const finalIdx = ((baseIdx+shift)%WHEEL.length+WHEEL.length)%WHEEL.length;
  return cap(WHEEL[finalIdx]);
}
function buildOpponent(species, level){
  const stats = DATA.dice[species] || [0,0,0,0,0,0];
  const levelBonus = distributeLevelBonus(stats, level);
  const statsArr = stats.map((n,i)=>n+levelBonus[i]);
  const highIdx = pickHighestIndex(statsArr);
  const types = DATA.types[species] || ['Normal', null];
  return { species, level, statsArr, levelBonus, base:stats, types, highIdx };
}
function rollWildEncounter(locationId){
  const loc = DATA.locations.find(l=>l.id===locationId);
  const badges = gameState.defeatedGymLeaders.length;
  const T = thresholdFor(badges);
  const sum = rollOneDieWithThreshold(T) + rollOneDieWithThreshold(T);
  const rolledSpecies = loc.table[sum-2];

  const rawLevel = rand(6);
  const finalLevel = levelMap[rawLevel] + badges;

  let species = rolledSpecies;
  let downgraded = false;
  while(DATA.predecessor[species] && (DATA.minLevel[species]||1) > finalLevel){
    species = DATA.predecessor[species];
    downgraded = true;
  }

  const opp = buildOpponent(species, finalLevel);
  opp.atk = rollTrueTypeAttack(opp.types);
  opp.downgraded = downgraded;
  opp.rolledSpecies = rolledSpecies;
  opp.locationName = loc.name;
  return opp;
}
function rollTrainerTeam(){
  const badges = gameState.defeatedGymLeaders.length;
  const classSum = rand(6)+rand(6);
  const className = DATA.trainerClassBySum[String(classSum)];
  const teamSize = trainerTeamSize(badges);
  const trainerLevel = 3 + badges;
  const table = DATA.trainerTables[className];
  const team = [];
  for(let i=0;i<teamSize;i++){
    const msum = rand(6)+rand(6);
    const root = table[msum-2];
    const finalSpecies = pickStageForLevel(root, trainerLevel);
    const opp = buildOpponent(finalSpecies, trainerLevel);
    opp.atk = rollTrueTypeAttack(opp.types);
    team.push(opp);
  }
  return { className, team };
}
function rollGymTeam(leaderName){
  const badges = gameState.defeatedGymLeaders.length;
  const info = DATA.gymLeaders[leaderName];
  const slotDefs = [
    {slot:1, minBadges:0, level: badges+5},
    {slot:2, minBadges:0, level: badges+4},
    {slot:3, minBadges:2, level: badges+4},
    {slot:4, minBadges:4, level: badges+5},
    {slot:5, minBadges:6, level: badges+3},
  ];
  const sendOrder = [5,2,3,4,1];
  const team = [];
  sendOrder.forEach(slotNum=>{
    const def = slotDefs.find(d=>d.slot===slotNum);
    if(badges < def.minBadges) return;
    const root = info.slots[String(slotNum)] || info.slots[slotNum];
    const finalSpecies = pickStageForLevel(root, def.level);
    const opp = buildOpponent(finalSpecies, def.level);
    opp.atk = cap(fixedAttackType(finalSpecies, String(slotNum)));
    team.push(opp);
  });
  return { info, team };
}
function eliteFourMembers(){ return DATA.eliteFour.concat([DATA.champion]); }
function eliteFourMemberLabelForIndex(idx){
  const members = eliteFourMembers();
  const m = members[idx];
  return (idx === members.length-1) ? ('Champion '+m.name) : m.name;
}
function rollEliteFourMemberTeam(member){
  const order = Object.prototype.hasOwnProperty.call(member.slots, '5') ? ['1','2','3','4','5','ace'] : ['1','2','3','4','ace'];
  const team = [];
  order.forEach(slotKey=>{
    const root = member.slots[slotKey];
    const level = member.levels[slotKey];
    const finalSpecies = pickStageForLevel(root, level);
    const opp = buildOpponent(finalSpecies, level);
    opp.atk = cap(fixedAttackType(finalSpecies, slotKey));
    team.push(opp);
  });
  return team;
}

let movement = null;      // { total } -- while the player is choosing a tile to move to

let encounter = null;     // active battle state

let pendingEvolveOptions = []; // for the evolve-a-Pokemon-with-a-town-item screen
let startPick = { starter:null, town:null };
let myPokemonOpen = false; // collapsed/expanded state of the "My Pokemon" roster section

// a gold ring on that pill to set it apart from the true-type ones.
function trainerStylePill(type, extraClass){

// One box per gym leader, in the same left-to-right order the region's gym

function renderBadgePanel(){
  const panel = document.getElementById('badgePanel');
  panel.style.display = badgePanelOpen ? '' : 'none';
  if(!badgePanelOpen) return;
  const boxes = Object.keys(DATA.gymLeaders).map(name=>{

// Shared "one Pokemon, full detail" card -- types, attack type (in parens,
// matching the Field Guide's own convention), every stat plus the total, and
// current XP progress. `actionHtml`, if given, is appended inside the card
// (e.g. a "Send Out" button); omit it for a plain read-only roster view.
function monStatCardHtml(m, actionHtml){
  const level = m.ev.reduce((a,b)=>a+b,0);
  const finalStats = m.base.map((b,i)=>b+m.ev[i]);
  return '<div class="mon-detail-card">' +
    '<div class="mon-detail-name">'+m.name+' Lv '+level+'</div>' +
    trainerTypeBlockHtml(m.t1, m.t2, m.atk) +
    statRowHtml(finalStats) +
    '<div class="stat-row"><span class="stat-chip">XP <b>'+(m.xp||0)+'</b> / '+(level*10)+' to next level</span></div>' +
    (actionHtml || '') +
  '</div>';
}

function ownedMonPickerHtml(excludeIds, opp){
  const mons = loadGamePokemon().filter(m=>!excludeIds.has(m.id));
  if(!mons.length) return '<div class="empty-note">No available Pokemon left to send out.</div>';
  const ranked = mons.map(m=>{
    const finalStats = m.base.map((b,i)=>b+m.ev[i]);
    const odds = winOdds(finalStats, [m.t1, m.t2], m.atk, opp.statsArr, opp.types, opp.atk);
    return { m, odds };
  }).sort((a,b) => b.odds.winA - a.odds.winA); // best odds first
  return ranked.map(({m, odds})=>{
    const oddsText = odds.unbreakable ? 'Tied forever -- identical matchup' : Math.round(odds.winA*100)+'% to win this exchange';
    const oddsBg = odds.unbreakable ? 'var(--sage)' : (odds.winA >= 0.5 ? '#d7ecd2' : '#f3d9ce');
    return monStatCardHtml(m,
      '<div class="stat-row"><span class="stat-chip" style="background:'+oddsBg+';">Win odds <b>'+oddsText+'</b></span></div>' +
      '<div class="choice-grid" style="margin-top:8px;">' +
        '<button type="button" class="btn btn-primary" data-action="pickPlayerMon" data-id="'+m.id+'">Send Out '+m.name+'</button>' +
      '</div>'
    );
  }).join('');
}

function opponentDisplayHtml(opp, statusClass){
  return '<span class="opp-chip'+(statusClass?(' '+statusClass):'')+'">'+opp.species+' Lv'+opp.level+'</span>';
}

function diceStageHtml(rb, nameA, nameB){
  const pick = (arr)=>arr[Math.floor(Math.random()*arr.length)];
  const diceA = Array.from({length: rb.nA}, (_,i)=>'<div class="die" id="battleDieA'+i+'">'+pick(rb.statsA)+'</div>').join('');
  const diceB = Array.from({length: rb.nB}, (_,i)=>'<div class="die" id="battleDieB'+i+'">'+pick(rb.statsB)+'</div>').join('');
  return '<div class="field-label" style="text-align:center;">Rolling...</div>' +
    '<div class="dice-stage">' +
      '<div class="dice-side"><div class="dice-group-label">'+nameA+'</div><div class="dice-group">'+diceA+'</div></div>' +
      '<span class="vs-label">vs</span>' +
      '<div class="dice-side"><div class="dice-group-label">'+nameB+'</div><div class="dice-group">'+diceB+'</div></div>' +
    '</div>';
}

function renderEncounterScreen(){
  const e = encounter;
  const isWild = e.type === 'wild';
  let teamRow;
  if(isWild){
    teamRow = '';
  } else if(e.type === 'elite4'){
    const range = currentEliteFourMemberRange(e);
    teamRow = '<div class="opp-team-row">' + e.opponents.slice(range.start, range.end).map((o,i)=>{
      const idx = range.start + i;
      return opponentDisplayHtml(o, idx<e.oppIdx ? 'defeated' : (idx===e.oppIdx ? 'current' : ''));
    }).join('') + '</div>';
  } else {
    teamRow = '<div class="opp-team-row">' + e.opponents.map((o,i)=>
      opponentDisplayHtml(o, i<e.oppIdx ? 'defeated' : (i===e.oppIdx ? 'current' : ''))
    ).join('') + '</div>';
  }

  const current = e.opponents[e.oppIdx];
  const oppCard =
    '<div class="card-title">'+current.species+' Lv '+current.level+'</div>' +
    trainerTypeBlockHtml(current.types[0], current.types[1], current.atk) +
    statRowHtml(current.statsArr);

  let actionHtml;
  if(rollingBattle){
    const m = loadGamePokemon().find(x=>x.id===e.currentPlayerId);
    actionHtml = diceStageHtml(rollingBattle, m?m.name:'?', current.species);
  } else if(e.currentPlayerId){
    const m = loadGamePokemon().find(x=>x.id===e.currentPlayerId);
    actionHtml = '<div class="field-label">Currently battling: '+(m?m.name:'?')+'</div>' +
      '<div class="choice-grid"><button type="button" class="btn btn-primary" data-action="fight">Fight!</button></div>';
  } else {
    const excludeIds = e.type === 'elite4' ? eliteFourExcludeIds(e) : e.lostIds;
    actionHtml = '<div class="field-label">Choose a Pokemon to send out (best odds first)</div>' + ownedMonPickerHtml(excludeIds, current);
  }

  const logHtml = e.log.length
    ? '<div class="log-box">' + e.log.slice().reverse().map(l=>'<div class="log-line">'+l+'</div>').join('') + '</div>'
    : '';

  const cardSub = isWild ? 'Wild Encounter'
    : e.type === 'gym' ? 'Gym Battle -- '+e.gymLeaderName
    : e.type === 'elite4' ? 'Elite Four -- '+currentEliteFourMemberLabel(e)
    : 'Trainer Battle -- '+e.className;

  return '<div class="card">' +
    '<div class="card-sub">'+cardSub+'</div>' +
    teamRow +
    oppCard +
    '<hr style="border:none;border-top:1px dashed var(--line);margin:12px 0;">' +
    actionHtml +
    logHtml +
  '</div>';
}

/* ============ Actions ============ */
function pickStarter(species){ startPick.starter = species; render(); }
function pickTown(nodeId){ startPick.town = nodeId; render(); }

function beginAdventure(){
  if(!startPick.starter || !startPick.town) return;
  const sp = startPick.starter;
  const types = DATA.types[sp] || ['Normal', null];
  const base = DATA.dice[sp] || [0,0,0,0,0,0];
  const ev = [0,0,0,0,0,0];
  for(let i=0;i<2;i++){ ev[rand(6)-1] += 1; }
  saveGamePokemonList([]); // a new game starts with a clean team, no carryover from a previous playthrough
  addGamePokemon({
    name: sp,
    t1: types[0] || null,
    t2: types[1] || null,
    atk: randomAttackType(types[0], types[1]),
    base: base,
    ev: ev,
    catchLevel: ev.reduce((a,b)=>a+b,0),
    note: 'Starter',
  });
  gameState = { started:true, starterSpecies: sp, currentNodeId: startPick.town, defeatedGymLeaders: [], turnCount: 0, eliteFourProgress: null, eliteFourTeamIds: [] };
  saveGameState();
  view = 'board';
  render();
}

function resetGame(){
  if(!confirm('Reset your adventure? This clears your map progress, badges, and in-game Pokemon team. Your Field Guide My Pokemon collection is a separate list and is not affected.')) return;
  localStorage.removeItem(GAME_KEY);
  saveGamePokemonList([]);
  gameState = loadGameState();
  startPick = { starter:null, town:null };
  view = 'start';
  movement = null;
  encounter = null;
  render();
}

function rollMovement(){
  const n = rand(6);
  movement = { total:n };
  gameState.turnCount = (gameState.turnCount || 0) + 1;
  saveGameState();
  view = 'moving';
  render();
}
function resolveLanding(nodeId, forfeited){
  const node = nodesById[nodeId];
  pendingForfeit = forfeited;
  movement = null;
  if(node.kind === 'dungeon'){
    beginEncounter('wild', { locationId: node.locationId });
  } else if(node.kind === 'route'){
    view = 'routeRoll';
    render();
  } else {
    view = 'townMenu';
    render();
  }
}

function townAction(choice){
  const node = nodesById[gameState.currentNodeId];
  if(choice === 'dungeon'){
    beginEncounter('wild', { locationId: node.dungeonLocationId });
  } else if(choice === 'evolveItem'){
    pendingEvolveOptions = evolveOptionsForTown(node);
    if(!pendingEvolveOptions.length) return; // shouldn't be reachable via the UI, but don't allow it even so
    view = 'evolveChoice';
    render();
  } else if(choice === 'gym'){
    if(gameState.defeatedGymLeaders.includes(node.gymLeader)) return; // already beaten -- shouldn't be reachable via the UI, but don't allow it even so
    beginEncounter('gym', { leaderName: node.gymLeader });
  } else if(choice === 'eliteFour'){
    if(gameState.defeatedGymLeaders.length < gymCount()) return; // shouldn't be reachable via the UI, but don't allow it even so
    gameState.eliteFourTeamIds = []; // a fresh run always starts with a fresh choice of 6
    saveGameState();
    beginEliteFourChallenge(0);
  }
}

function chooseEvolveOption(monId, targetSpecies){
  const list = loadGamePokemon();
  const entry = list.find(m=>m.id===monId);
  if(!entry) return;
  if(!confirm('Evolve '+entry.name+' into '+targetSpecies+'?')) return;
  entry.name = targetSpecies;
  const types = DATA.types[targetSpecies] || [null, null];
  entry.t1 = types[0] || null;
  entry.t2 = types[1] || null;
  entry.base = (DATA.dice[targetSpecies] || [0,0,0,0,0,0]).slice();
  const rolledAtk = randomAttackType(entry.t1, entry.t2);
  if(rolledAtk !== entry.atk && confirm('Change '+entry.name+'\'s attack type from '+entry.atk+' to '+rolledAtk+'?')){
    entry.atk = rolledAtk;
  }
  saveGamePokemonList(list);
  pendingMessage = entry.name + ' evolved!';
  view = 'message';
  render();
}
function backToTownMenu(){
  view = 'townMenu';
  render();
}

function rollRoute(adjust){
  const node = nodesById[gameState.currentNodeId];
  const raw = rand(6);
  const result = raw + adjust;
  if(result <= 3){
    beginEncounter('wild', { locationId: node.locationId });
  } else {
    beginEncounter('trainer', {});
  }
}

function beginEncounter(type, ctx){
  let opponents, extra = {};
  if(type === 'wild'){
    opponents = [rollWildEncounter(ctx.locationId)];
  } else if(type === 'trainer'){
    const r = rollTrainerTeam();
    opponents = r.team;
    extra.className = r.className;
  } else {
    const r = rollGymTeam(ctx.leaderName);
    opponents = r.team;
    extra.gymLeaderName = ctx.leaderName;
  }
  encounter = Object.assign({
    type, opponents, oppIdx:0,
    currentPlayerId: null,
    lostIds: new Set(),
    sentOutIds: [],
    currentOpponentParticipants: [],
    xpRecipientIds: new Set(), // who to check for level-up evolution once the WHOLE encounter ends, not mid-battle
    log: [],
  }, extra);
  view = 'encounter';
  render();
}

function beginEliteFourChallenge(startIndex){
  const members = eliteFourMembers();
  const opponents = [];
  const memberBoundaries = [];
  for(let mi=startIndex; mi<members.length; mi++){
    memberBoundaries.push({ memberIndex: mi, startAt: opponents.length, name: members[mi].name, isChampion: mi === members.length-1 });
    rollEliteFourMemberTeam(members[mi]).forEach(o=>opponents.push(o));
  }
  encounter = {
    type: 'elite4',
    opponents, oppIdx: 0,
    currentPlayerId: null,
    lostIds: new Set(), // unused for elite4 -- per-member "revival" tracking lives in currentMemberLostIds instead
    sentOutIds: (gameState.eliteFourTeamIds || []).slice(),
    currentMemberLostIds: new Set(), // reset only when moving to a NEW member -- who has already lost within this member's battle
    currentOpponentParticipants: [],
    xpRecipientIds: new Set(), // no XP or evolution in the Elite Four
    memberBoundaries,
    log: [],
  };
  gameState.eliteFourProgress = startIndex;
  saveGameState();
  view = 'encounter';
  render();
}

function currentEliteFourMemberLabel(e){
  let b = e.memberBoundaries[0];
  e.memberBoundaries.forEach(x=>{ if(e.oppIdx >= x.startAt) b = x; });
  return b.isChampion ? ('Champion '+b.name) : b.name;
}
function currentEliteFourMemberRange(e){
  let idx = 0;
  e.memberBoundaries.forEach((x,i)=>{ if(e.oppIdx >= x.startAt) idx = i; });
  const start = e.memberBoundaries[idx].startAt;
  const end = (idx+1 < e.memberBoundaries.length) ? e.memberBoundaries[idx+1].startAt : e.opponents.length;
  return { start, end };
}
// Up to 6 distinct Pokemon total for the whole Elite Four + Champion run (locked once 6 have
// been used); within that pool, a Pokemon that has already lost within the CURRENT member's
// battle is unavailable for the rest of that battle, but is revived again for the next member.
function eliteFourExcludeIds(e){
  const pool = gameState.eliteFourTeamIds || [];
  const excl = new Set(e.currentMemberLostIds);
  if(pool.length >= 6){
    loadGamePokemon().forEach(m=>{ if(!pool.includes(m.id)) excl.add(m.id); });
  }
  return excl;
}

function continueEliteFour(){
  if(!encounter) return;
  view = 'encounter';
  render();
}
function resumeEliteFour(){
  if(gameState.eliteFourProgress == null) return;
  beginEliteFourChallenge(gameState.eliteFourProgress);
}
function leaveShoreline(){
  if(!confirm('Leave Shoreline City? This resets your Elite Four progress and your locked-in team of 6.')) return;
  gameState.eliteFourProgress = null;
  gameState.eliteFourTeamIds = [];
  saveGameState();
  rollMovement();
}

function pickPlayerMon(id){
  encounter.currentPlayerId = id;
  if(!encounter.sentOutIds.includes(id)) encounter.sentOutIds.push(id);
  if(encounter.type === 'elite4'){
    if(!gameState.eliteFourTeamIds) gameState.eliteFourTeamIds = [];
    if(!gameState.eliteFourTeamIds.includes(id) && gameState.eliteFourTeamIds.length < 6){
      gameState.eliteFourTeamIds.push(id);
      saveGameState();
    }
  }
  render();
}

async function fight(){
  if(rollingBattle) return; // guard against double-clicks mid-animation
  const e = encounter;
  const entry = loadGamePokemon().find(x=>x.id===e.currentPlayerId);
  const opp = e.opponents[e.oppIdx];
  e.currentOpponentParticipants.push(e.currentPlayerId);

  const statsA = entry.base.map((b,i)=>b+entry.ev[i]);
  const statsB = opp.statsArr;
  const typesA = [entry.t1, entry.t2], typesB = opp.types;
  const atkA = entry.atk, atkB = opp.atk;
  // Dice count/keep-best-or-worst depends on how effective each side's OWN attack
  // type is against the OTHER side's defending types -- not against its own.
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? 1 : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? 1 : 0;
  // STAB is baked into every die face shown (not just the kept one) so the two sides'
  // dice can be compared face-to-face -- the cycling animation shows the same
  // STAB-inclusive numbers the dice will actually land on, not a mismatched raw value.
  const displayStatsA = stabA ? statsA.map(v=>v+stabA) : statsA;
  const displayStatsB = stabB ? statsB.map(v=>v+stabB) : statsB;

  // The dice you see ARE the actual roll -- animate real rounds (including real ties,
  // paused on-screen so the player can see what happened) rather than faking a replay.
  let rA, rB, roundNum = 0, animate = true;
  do {
    roundNum++;
    rA = rollSide(statsA, cfgA, stabA);
    rB = rollSide(statsB, cfgB, stabB);
    if(animate){
      rollingBattle = { nA: cfgA.n, nB: cfgB.n, statsA: displayStatsA, statsB: displayStatsB };
      render();
      await Promise.all([
        ...rA.picks.map((face,i)=>tumble(document.getElementById('battleDieA'+i), 900, displayStatsA, face)),
        ...rB.picks.map((face,i)=>tumble(document.getElementById('battleDieB'+i), 900, displayStatsB, face)),
      ]);
      const dieA = document.getElementById('battleDieA'+rA.keptIdx);
      const dieB = document.getElementById('battleDieB'+rB.keptIdx);
      if(dieA) dieA.classList.add('die-kept');
      if(dieB) dieB.classList.add('die-kept');
      await sleep(rA.final === rB.final ? 900 : 500);
      if(roundNum >= 8) animate = false; // an extreme tie streak stops animating and fast-forwards
    }
  } while(rA.final === rB.final && roundNum < 300);
  rollingBattle = null;

  const result = (rA.final === rB.final)
    ? { winner: 'tie', finalA: null, finalB: null }
    : { winner: rA.final > rB.final ? 'A' : 'B', finalA: rA.final, finalB: rB.final };

  if(result.winner === 'A'){
    e.log.push(entry.name+' ('+result.finalA+') defeated '+opp.species+' ('+result.finalB+')!');
    const isLastOpponent = (e.oppIdx === e.opponents.length - 1);

    if(e.type === 'elite4'){
      const memberRange = currentEliteFourMemberRange(e); // still the range of the member just being fought
      const isLastOfMember = (e.oppIdx === memberRange.end - 1);
      const beatenLabel = currentEliteFourMemberLabel(e);
      if(isLastOpponent){
        const team = (gameState.eliteFourTeamIds || [])
          .map(id => loadGamePokemon().find(m=>m.id===id))
          .filter(Boolean);
        pendingMessage = 'You have become the Calli champion! Congratulations!' +
          '<div class="field-label" style="margin-top:14px;">Your Championship Team</div>' +
          team.map(m=>monStatCardHtml(m)).join('');
        gameState.eliteFourProgress = null;
        gameState.eliteFourTeamIds = [];
        saveGameState();
        view = 'message';
        encounter = null;
      } else {
        e.oppIdx += 1;
        e.currentOpponentParticipants = [];
        if(isLastOfMember){
          // Sweeping a member's whole team is its own separate battle -- Pokemon are only
          // revived here, at the member boundary, never mid-battle against the same member.
          e.currentMemberLostIds = new Set();
          // Acknowledge it, let the player pick a fresh lead for the next member instead of
          // auto-continuing with whoever happened to land the last hit, at no extra turn cost.
          e.currentPlayerId = null;
          pendingMessage = 'You defeated '+beatenLabel+'\'s whole team!';
          view = 'elite4Ack';
        }
      }
      render();
      return;
    }

    if(e.type === 'wild'){
      e.pendingXP = { total: statTotal(opp.statsArr), participants: e.currentOpponentParticipants.slice(), highIdx: opp.highIdx };
      view = 'catchOrDefeat';
      render();
      return;
    }
    const xpTotal = Math.floor(statTotal(opp.statsArr) * 1.5);
    const splits = splitXP(xpTotal, e.currentOpponentParticipants);
    const list = loadGamePokemon();
    splits.forEach(({id, xp})=>{
      const mon = list.find(x=>x.id===id);
      if(mon) grantXP(mon, xp, opp.highIdx);
    });
    splits.forEach(s=>{
      const m=list.find(x=>x.id===s.id);
      if(!m) return;
      e.log.push(m.name+' gained '+s.xp+' XP.');
      e.xpRecipientIds.add(s.id); // evolution check deferred until the whole encounter ends, not mid-battle
    });
    saveGamePokemonList(list);

    e.oppIdx += 1;
    e.currentOpponentParticipants = [];
    if(isLastOpponent){
      if(e.type === 'gym'){
        if(!gameState.defeatedGymLeaders.includes(e.gymLeaderName)){
          gameState.defeatedGymLeaders.push(e.gymLeaderName);
          saveGameState();
        }
        pendingMessage = 'You defeated '+e.gymLeaderName+' and earned a badge!';
      } else {
        pendingMessage = 'You defeated the trainer\'s whole team!';
      }
      pendingMessage += resolveDeferredEvolutions(e.xpRecipientIds);
      view = 'message';
      encounter = null;
    }
    render();
    return;
  }

  // Loss
  e.log.push(entry.name+' ('+result.finalA+') lost to '+opp.species+' ('+result.finalB+').');

  if(e.type === 'elite4'){
    e.currentMemberLostIds.add(e.currentPlayerId);
    e.currentPlayerId = null;
    const stillAvailable = loadGamePokemon().filter(m=>!eliteFourExcludeIds(e).has(m.id));
    if(stillAvailable.length === 0){
      const label = currentEliteFourMemberLabel(e);
      let memberIdx = 0;
      e.memberBoundaries.forEach(b=>{ if(e.oppIdx >= b.startAt) memberIdx = b.memberIndex; });
      gameState.eliteFourProgress = memberIdx;
      gameState.turnCount = (gameState.turnCount || 0) + 1; // resuming at the member they lost to counts as a new turn
      saveGameState();
      pendingMessage = 'Your Elite Four challenge ends against '+label+'. Return to Shoreline City to continue, or leave to reset your run.';
      view = 'message';
      encounter = null;
    }
    render();
    return;
  }

  e.lostIds.add(e.currentPlayerId);
  e.currentPlayerId = null;

  const remainingOwned = loadGamePokemon().filter(m=>!e.lostIds.has(m.id));
  if(e.sentOutIds.length >= 6 || remainingOwned.length === 0){
    pendingMessage = (e.type==='wild') ? 'The wild '+opp.species+' got away.' : 'You had no Pokemon left and had to withdraw.';
    pendingMessage += resolveDeferredEvolutions(e.xpRecipientIds);
    view = 'message';
    encounter = null;
  }
  render();
}

function chooseCatch(){
  const opp = encounter.opponents[0];
  addGamePokemon({
    name: opp.species,
    t1: opp.types[0] || null,
    t2: opp.types[1] || null,
    atk: opp.atk,
    base: opp.base,
    ev: opp.levelBonus.slice(),
    catchLevel: opp.levelBonus.reduce((a,b)=>a+b,0),
    note: 'Caught in the wild',
  });
  pendingMessage = 'Caught '+opp.species+'!';
  view = 'message';
  encounter = null;
  render();
}
function chooseDefeat(){
  const e = encounter;
  const opp = e.opponents[0];
  const splits = splitXP(e.pendingXP.total, e.pendingXP.participants);
  const list = loadGamePokemon();
  const evoMessages = [];
  splits.forEach(({id, xp})=>{
    const mon = list.find(x=>x.id===id);
    if(!mon) return;
    grantXP(mon, xp, e.pendingXP.highIdx);
    checkAndApplyLevelEvolution(mon).forEach(msg => evoMessages.push(msg));
  });
  saveGamePokemonList(list);
  pendingMessage = 'Defeated the wild '+opp.species+'. ' +
    splits.map(s=>{ const m=list.find(x=>x.id===s.id); return m ? (m.name+' +'+s.xp+' XP') : ''; }).join(', ') +
    (evoMessages.length ? ' ' + evoMessages.join(' ') : '');
  view = 'message';
  encounter = null;
  render();
}

function endTurn(){
  view = 'board';
  movement = null;
  render();
}

/* ============ Event delegation ============ */
document.getElementById('app').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(action === 'pickStarter') pickStarter(btn.dataset.species);
  else if(action === 'pickTown') pickTown(btn.dataset.node);
  else if(action === 'beginAdventure') beginAdventure();
  else if(action === 'rollMovement') rollMovement();
  else if(action === 'townAction') townAction(btn.dataset.choice);
  else if(action === 'chooseEvolveOption') chooseEvolveOption(btn.dataset.mon, btn.dataset.target);
  else if(action === 'backToTownMenu') backToTownMenu();
  else if(action === 'rollRoute') rollRoute(parseInt(btn.dataset.adjust, 10));
  else if(action === 'pickPlayerMon') pickPlayerMon(btn.dataset.id);
  else if(action === 'fight') fight();
  else if(action === 'chooseCatch') chooseCatch();
  else if(action === 'chooseDefeat') chooseDefeat();
  else if(action === 'endTurn') endTurn();
  else if(action === 'resumeEliteFour') resumeEliteFour();
  else if(action === 'leaveShoreline') leaveShoreline();
  else if(action === 'continueEliteFour') continueEliteFour();
});
document.getElementById('statusStrip').addEventListener('click', (e)=>{
  if(e.target.closest('[data-action="resetGame"]')){ resetGame(); return; }
  if(e.target.closest('[data-action="toggleBadgePanel"]')){
    badgePanelOpen = !badgePanelOpen;
    renderBadgePanel();
  }
});
document.getElementById('mapInfo').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action="moveToNode"]');
  if(btn) moveToNode(btn.dataset.node);
});
document.getElementById('myPokemonToggle').addEventListener('click', ()=>{
  myPokemonOpen = !myPokemonOpen;
  renderMyPokemonSection();
});

render();

} catch (err) {
  document.body.innerHTML =
    '<div style="max-width:600px;margin:60px auto;padding:24px;' +
    'font-family:monospace;background:#fff3f0;border:2px solid #C4572E;' +
    'border-radius:6px;color:#1F2E3D;line-height:1.6;">' +
    '<b style="color:#C4572E;">The game failed to load.</b><br><br>' +
    'Error: ' + err.message + '<br><br>' +
    '<span style="font-size:13px;">Check the browser console for details.</span></div>';
  console.error(err);
}
