<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pok&eacute;mon Adventure -- Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --paper-deep:#E2D9C4;
    --ink:#1F2E3D;
    --redwood:#2F4538;
    --rust:#C4572E;
    --gold:#D9A441;
    --sage:#8AA399;
    --nogym-green:#5B8A4E;
    --elite-purple:#A98FC9;
    --line: rgba(31,46,61,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(196,87,46,0.07), transparent 40%),
      radial-gradient(circle at 85% 82%, rgba(47,69,56,0.08), transparent 45%),
      repeating-linear-gradient(0deg, transparent, transparent 38px, var(--line) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, var(--line) 39px);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 14px 80px;
  }
  .sheet{ width:100%; max-width: 720px; }
  .masthead{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 4px 14px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 16px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 22px;
    color: var(--redwood);
  }
  .nav-link{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    color: var(--ink);
    text-decoration:none;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 6px 10px;
    background: var(--paper-deep);
  }
  .nav-link:hover{ background: var(--gold); }
  .status-strip{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .status-badges{
    background: var(--gold);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
    cursor:pointer;
  }
  .status-badges:hover{ background:#c4923a; }
  .badge-panel{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 12px;
    margin: -6px 0 16px;
  }
  .badge-panel-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge-box{
    width: 46px;
    height: 46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    border: 1.5px solid var(--ink);
    border-radius: 5px;
    letter-spacing:0.02em;
  }
  .status-turns{
    background: var(--sage);
    color: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
  }
  .reset-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--ink);
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 5px 9px;
    cursor:pointer;
  }
  .status-slot{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .save-slot-card{
    position:relative;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .save-slot-card.save-slot-empty{ border-style:dashed; opacity:0.75; }
  .save-slot-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .save-slot-main{ flex:1; min-width:0; }
  .save-slot-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .save-slot-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--sage);
    margin-bottom: 8px;
  }
  .save-slot-team{
    flex-shrink:0;
    margin-top: -8px;
    margin-right: 30px;
    display:grid;
    grid-template-columns: repeat(3, 65px);
    grid-template-rows: repeat(2, 50px); /* shorter than the sprites -- rows
      overlap vertically since the art itself doesn't fill its box height */
    gap:0;
  }
  .save-slot-team img{ width:65px; height:65px; object-fit:contain; image-rendering:auto; transform: translateY(-20%); }
  .save-slot-delete-btn{
    position:absolute; top:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--rust);
    background:var(--paper);
    color:var(--rust);
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:13px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .save-slot-delete-btn:hover{ background:var(--rust); color:var(--paper); }
  .howtoplay-body{
    font-family:'Work Sans', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    margin-top: 14px;
  }
  .howtoplay-body p{ margin:0 0 12px; }
  .howtoplay-body p:last-child{ margin-bottom:0; }
  .tutorial-tip{
    background: var(--paper-deep);
    border: 1.5px dashed var(--gold);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-family:'Work Sans', sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  .tutorial-tip-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color: var(--rust);
    margin-bottom: 4px;
  }
  .reset-btn:hover{ background:#e8bdb0; }
  .card{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    margin-bottom: 10px;
  }
  .opp-card-wrap{ position:relative; padding-right:120px; }
  .card-flavor{ font-size:13px; font-style:italic; color:#3c4f45; margin-bottom:10px; }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight:600;
    padding: 10px 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    cursor:pointer;
  }
  .btn:hover{ background: var(--gold); }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--gold); }
  .btn-primary:hover{ background:#c4923a; }
  .btn-wild{ background: var(--nogym-green); color:var(--paper); }
  .btn-wild:hover{ background:#4a7440; }
  .btn-danger{ background: var(--rust); color:var(--paper); }
  .btn-danger:hover{ background:#a8451f; }
  .choice-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .type-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 10px;
    margin-right:4px;
  }
  .stat-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin: 8px 0;
  }
  .stat-chip{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
  }
  .stat-chip b{ color: var(--redwood); }
  .starter-grid{ display:grid; grid-template-columns: 1fr; gap:10px; }
  @media (min-width:560px){ .starter-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .starter-card{
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 12px;
    cursor:pointer;
    text-align:center;
  }
  .starter-card.selected{ border-color: var(--rust); background: #f3d9ce; }
  .starter-card h3{ font-family:'Fraunces', serif; margin: 6px 0 4px; }
  .town-grid{ display:flex; flex-wrap:wrap; gap:6px; max-height:220px; overflow-y:auto; margin-top:6px; padding:2px; }
  .town-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    cursor:pointer;
  }
  .town-btn.selected{ background: var(--gold); }
  .mon-detail-card{
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 10px 120px 10px 12px;
    margin-top: 10px;
    position: relative;
  }
  .mon-detail-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .sprite-lg{
    position:absolute;
    top:10px; right:12px;
    width:96px; height:96px;
    object-fit:contain;
    image-rendering:auto;
    transform: translateY(-20%); /* pokemondb icons sit low in their own box -- nudge up */
  }
  .trainer-type-block{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .trainer-type-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .trainer-mon-types{ display:flex; gap:5px; }
  .trainer-atk-paren{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .trainer-type-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight:600;
    color:#fff;
    padding: 3px 9px;
    border-radius: 12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .trainer-atk-pill{ box-shadow: 0 0 0 2px var(--gold); }
  .battle-type-pills{ display:flex; justify-content:center; gap:4px; margin-top:4px; }
  .battle-eff-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--redwood);
    text-align:center;
    margin-top:3px;
  }
  .sprite-battle{ width:108px; height:108px; object-fit:contain; image-rendering:auto; transform: translateY(-20%); }
  .opp-team-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0 12px; }
  .opp-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .opp-chip.current{ background: var(--gold); font-weight:700; }
  .opp-chip.defeated{ opacity:0.45; text-decoration: line-through; }
  .e4-team-row{ display:flex; flex-wrap:wrap; gap:6px; margin: 8px 0 12px; }
  .e4-team-chip{
    display:flex; align-items:center; gap:3px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    white-space: nowrap;
    padding: 2px 7px 2px 3px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .e4-team-chip.current{ background: var(--gold); font-weight:700; }
  /* Smaller than the usual .sprite-sm so all 6 possible team members -- the max
     under the Elite Four's 6-Pokemon limit -- fit on one row instead of wrapping. */
  .e4-team-chip img{ width:22px; height:22px; }
  .team-export-box{
    width:100%;
    min-height:140px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    resize:vertical;
    box-sizing:border-box;
  }
  .log-box{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    max-height: 220px;
    overflow-y:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin-top: 10px;
  }
  .log-line{ padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log-line:last-child{ border-bottom:none; }
  .empty-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--sage);
    text-align:center;
    padding: 12px 0;
  }
  .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    display:block;
    margin: 10px 0 4px;
  }
  .dice-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin: 14px 0 4px;
  }
  .dice-group{ display:flex; gap:8px; }
  .dice-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--sage);
    text-align:center;
    margin-bottom:6px;
  }
  .dice-side{ display:flex; flex-direction:column; align-items:center; }
  .die{
    min-width:44px; height:44px;
    padding: 0 5px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight:600;
    font-variant-numeric: tabular-nums;
  }
  .die.rolling{ animation: dieTumble .09s linear infinite; }
  .die.die-kept{
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
  }
  @keyframes dieTumble{
    0%{ transform: rotate(0deg) scale(1); }
    50%{ transform: rotate(8deg) scale(1.05); }
    100%{ transform: rotate(-6deg) scale(1); }
  }
  .vs-label{
    font-family:'Fraunces', serif;
    font-size:18px;
    color: var(--redwood);
    align-self:center;
    margin-top: 18px;
  }
  .map-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-swatch{ display:inline-block; width:11px; height:11px; }
  .legend-town{ background: var(--gold); border: 1.5px solid var(--ink); }
  .legend-town-nogym{ background: var(--nogym-green); border: 1.5px solid var(--ink); }
  .legend-dungeon{
    width:0; height:0;
    background: transparent;
    border-left: 5.5px solid transparent;
    border-right: 5.5px solid transparent;
    border-bottom: 10px solid var(--rust);
  }
  .legend-route{ background: var(--sage); border: 1.5px solid var(--ink); border-radius:50%; }
  .legend-elite{ background: var(--elite-purple); border: 1.5px solid var(--ink); }
  .map-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    -webkit-overflow-scrolling: touch;
  }
  #mapSvg{ display:block; }
  .map-node{ cursor:pointer; }
  .map-node-shape{
    stroke: var(--ink);
    stroke-width: 1.5;
    transition: stroke-width .12s ease, filter .12s ease;
  }
  .map-node:hover .map-node-shape{ stroke-width: 2.5; }
  .map-node.player-here .map-node-shape{
    stroke: var(--rust);
    stroke-width: 3.5;
    filter: drop-shadow(0 0 4px var(--rust));
  }
  .map-node.can-move .map-node-shape{
    stroke: var(--gold);
    stroke-width: 3;
    filter: drop-shadow(0 0 5px var(--gold));
  }
  .map-node.can-move{ cursor:pointer; }
  .map-node.selected .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  /* Static (non-interactive) map preview -- used by the Custom Region generator,
     which has no player position or click behavior to wire up yet. */
  .map-node-static .map-node-shape{ stroke: var(--ink); stroke-width: 1.5; }
  .map-node-central .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  .map-node-label{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    pointer-events:none;
    fill: var(--ink);
  }
  .map-node-label-light{ fill: var(--paper); }
  .map-node-divider{
    stroke: var(--ink);
    stroke-width: 1.5;
    pointer-events:none;
  }
  .map-edge{
    stroke: var(--ink);
    stroke-width: 1.5;
    opacity: 0.35;
  }
  .map-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--redwood);
    margin-top: 8px;
    min-height: 16px;
  }
  .map-info{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1.5px dashed var(--ink);
    min-height: 50px;
  }
  .map-info-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--sage);
    text-align:center;
  }
  .map-info-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 18px;
    margin-bottom:4px;
  }
  .map-info-kind{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-bottom: 8px;
  }
  .map-info-desc{
    font-size: 13px;
    line-height:1.5;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-info-evo{
    font-size: 12.5px;
    line-height:1.5;
    color: var(--ink);
    background: rgba(201, 162, 39, 0.16);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 10px;
  }
  .map-go-btn{
    padding: 9px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    background: var(--rust);
    color: var(--paper);
    border:none;
    border-radius: 4px;
    cursor:pointer;
    margin-bottom: 10px;
  }
  .map-go-btn:hover{ background:#a9481f; }
  .map-encounter-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-top: 10px;
    margin-bottom: 7px;
  }
  .map-encounter-list{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .map-encounter-row{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 8px;
  }
  .map-encounter-sum{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size: 11px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 3px;
    width: 18px;
    height: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .map-encounter-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 13px;
    flex: 1;
  }
  .map-encounter-types{ display:flex; gap:4px; }
  .sprite-sm{ width:36px; height:36px; object-fit:contain; image-rendering:auto; flex-shrink:0; transform: translateY(-20%); }
  .tab-row{ display:flex; gap:6px; margin-bottom:16px; }
  .tab-btn{
    flex:1; min-width:0; padding:9px 4px;
    font-family:'Fraunces', serif; font-weight:600; font-size:14px; line-height:1.15;
    text-align:center; background:var(--paper); color:var(--ink);
    border:1.5px solid var(--ink); border-radius:4px; cursor:pointer;
  }
  @media (max-width:560px){ .tab-btn{ font-size:11.5px; padding:8px 2px; } }
  .tab-btn.active{ background:var(--redwood); color:var(--paper); border-color:var(--redwood); }
  /* Elite Four / Champion roster preview -- more tabs than fit at flex:1, so these
     keep their natural width and the row scrolls horizontally instead of squeezing. */

function buildThresholds(){

}

// Cycles a die square through the Pokemon's own possible stat values (its face is
// literally which stat got picked), then settles on finalFace -- the actual rolled
// result, not a cosmetic one.
async function tumble(el, durationMs, possibleValues, finalFace){
  if(!el) return;
  el.classList.add('rolling');
  const steps = Math.max(1, Math.round(durationMs/85));
  for(let i=0;i<steps-1;i++){
    el.textContent = possibleValues[Math.floor(Math.random()*possibleValues.length)];
    await sleep(85);
  }
  el.textContent = finalFace;
  el.classList.remove('rolling');
  await sleep(85);
}
function wheelShift(sum){
  if(sum===2) return -2;
  if(sum===3||sum===4) return -1;
  if(sum>=5 && sum<=9) return 0;
  if(sum===10||sum===11) return 1;
  if(sum===12) return 2;
  return 0;
}
function randomAttackType(t1, t2){
  const types = [t1, t2].filter(Boolean).map(t=>t.toLowerCase());
  const baseType = types[Math.floor(Math.random()*types.length)];
  const shift = wheelShift(rand(6) + rand(6));
  const baseIdx = WHEEL.indexOf(baseType);
  const finalIdx = ((baseIdx + shift) % WHEEL.length + WHEEL.length) % WHEEL.length;
  return cap(WHEEL[finalIdx]);
}
function pickHighestIndex(stats){
  const max = Math.max(...stats);
  const candidates = [];
  stats.forEach((v,i)=>{ if(v===max) candidates.push(i); });
  return candidates[Math.floor(Math.random()*candidates.length)];
}
function distributeLevelBonus(stats, level){
  const idx = [0,1,2,3,4,5];
  for(let i=idx.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]] = [idx[j],idx[i]];
  }
  idx.sort((a,b) => stats[b]-stats[a]);
  const bonus = [0,0,0,0,0,0];
  const fullCycles = Math.floor(level/6);
  const remainder = level%6;
  for(let k=0;k<6;k++){ bonus[idx[k]] = fullCycles; }
  for(let k=0;k<remainder;k++){ bonus[idx[k]] += 1; }
  return bonus;
}
function trainerTeamSize(badges){
  if(badges===0) return 1;
  if(badges<=2) return 2;
  if(badges<=4) return 3;
  if(badges<=6) return 4;
  return 5;
}
function pickStageForLevel(rootEntry, level){
  const root = Array.isArray(rootEntry) ? rootEntry[0] : rootEntry;
  const forcedBranch = Array.isArray(rootEntry) ? rootEntry[1] : null;
  const chain = DATA.trainerChain[root] || [root];
  let chosen = chain[0];
  for(const stage of chain){
    if(Array.isArray(stage)){
      const eligible = stage.filter(sp => {
        const lvl = DATA.trainerMinLevel[sp];
        return lvl !== undefined && lvl <= level;
      });
      if(eligible.length){
        chosen = (forcedBranch && eligible.includes(forcedBranch))
          ? forcedBranch
          : eligible[Math.floor(Math.random() * eligible.length)];
      }
      continue;
    }
    const lvl = DATA.trainerMinLevel[stage];
    if(lvl !== undefined && lvl <= level){
      chosen = stage;
    }
  }
  return chosen;
}
function fixedAttackType(finalSpecies, slotKey){
  const types = DATA.types[finalSpecies] || ['Normal', null];
  const primary = (types[0] || 'normal').toLowerCase();
  const secondary = types[1] ? types[1].toLowerCase() : null;
  const baseType = (slotKey === '2') ? (secondary || primary) : primary;
  const idx = WHEEL.indexOf(baseType);
  let shift = 0;
  if(slotKey === '3') shift = 1;
  if(slotKey === '4') shift = -1;
  const finalIdx = ((idx + shift) % WHEEL.length + WHEEL.length) % WHEEL.length;
  return WHEEL[finalIdx];
}

function effectiveness(atkType, defType1, defType2){
  const row = TYPE_CHART[atkType] || {};

function diceConfig(mult){
  if(mult >= 4) return {n:3, mode:'best', label:'4× doubly super effective'};
  if(mult === 2) return {n:2, mode:'best', label:'2× super effective'};
  if(mult === 1) return {n:1, mode:'single', label:'1× normal'};
  if(mult === 0.5) return {n:2, mode:'worst', label:'0.5× not very effective'};
  if(mult === 0.25) return {n:3, mode:'worst', label:'0.25× doubly resisted'};
  return {n:3, mode:'worst', label:'0× immune'};
}
// One die per cfg.n: its displayed face is the value of whichever of the 6 stats
// (including EVs) got picked, PLUS this side's STAB bonus baked in on every die (not
// just the kept one) -- since STAB is a flat +1 either way, showing it pre-added lets
// the two sides' dice be compared face-to-face to see who's ahead, no mental math
// needed. The kept die (best-or-worst per cfg.mode) is flagged by index for the UI.
function rollSide(finalStats, cfg, stabBonus){
  const picks = [];
  let kept = null, keptIdx = 0;
  for(let i=0;i<cfg.n;i++){
    const idx = Math.floor(Math.random()*6);
    const val = finalStats[idx];
    picks.push(val + stabBonus);
    if(kept===null || (cfg.mode==='worst' ? val<kept : val>kept)){
      kept = val;
      keptIdx = i;
    }
  }
  return { picks, keptIdx, kept, final: kept + stabBonus };
}

// Exact result distribution for one side: Map<finalValue, probability> --
// full enumeration (6^n outcomes for n dice), not sampling.
function resultDistribution(finalStats, cfg, stabBonus){
  const n = cfg.n;
  const counts = new Map();
  const total = Math.pow(6, n);
  function rec(depth, kept){
    if(depth === n){
      const v = kept + stabBonus;
      counts.set(v, (counts.get(v)||0) + 1);
      return;
    }
    for(let i=0;i<6;i++){
      const val = finalStats[i];
      const nextKept = (kept === null) ? val
        : (cfg.mode === 'worst' ? Math.min(kept, val) : Math.max(kept, val));
      rec(depth+1, nextKept);
    }
  }
  rec(0, null);
  const dist = new Map();
  for(const [v,c] of counts) dist.set(v, c/total);
  return dist;
}
// Ties reroll rather than counting as a draw -- since every reroll repeats
// the same two distributions, the post-reroll odds are just the one-shot
// win probabilities renormalized by 1/(1-P(tie)). A "perpetual tie" (every
// pairing ties) can never resolve -- flagged via `unbreakable`.
function crossOdds(distA, distB){
  let winA=0, winB=0, tie=0;
  for(const [a,pa] of distA){
    for(const [b,pb] of distB){
      const p = pa*pb;
      if(a>b) winA += p;
      else if(b>a) winB += p;
      else tie += p;
    }
  }
  const decided = winA + winB;
  if(decided <= 1e-12) return {winA:0, winB:0, unbreakable:true};
  return {winA: winA/decided, winB: winB/decided, unbreakable:false};
}
// Exact post-reroll odds that A beats B in one exchange (§14) -- same STAB
// and attacker-vs-opponent-types wiring as resolveBattle, just computing the
// full distribution instead of rolling once.
function winOdds(statsA, typesA, atkA, statsB, typesB, atkB){
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? 1 : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? 1 : 0;
  return crossOdds(resultDistribution(statsA, cfgA, stabA), resultDistribution(statsB, cfgB, stabB));
}

const GAME_STATE_KEY_PREFIX = 'pokemonDiceGameStateV1_slot';
// Every slot number that currently has a real, started adventure saved,
// discovered by scanning localStorage directly (no fixed slot count to
// iterate) -- ascending by slot number.
function listSaveSlots(){
  const slots = [];
  for(let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if(!key || key.indexOf(GAME_STATE_KEY_PREFIX) !== 0) continue;
    const slot = parseInt(key.slice(GAME_STATE_KEY_PREFIX.length), 10);
    if(!Number.isFinite(slot)) continue;
    const gs = loadGameStateFromSlot(slot);
    if(gs && gs.started) slots.push(slot);
  }
  return slots.sort((a,b)=>a-b);
}
// One past the highest slot number ever actually saved -- an abandoned
// in-progress creation (region picked but never began) never wrote a game
// state, so it doesn't reserve a number and this same id gets reused next
// time, instead of counting up forever.
function nextFreeSlotId(){
  let max = 0;
  for(let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if(!key || key.indexOf(GAME_STATE_KEY_PREFIX) !== 0) continue;
    const slot = parseInt(key.slice(GAME_STATE_KEY_PREFIX.length), 10);
    if(Number.isFinite(slot) && slot > max) max = slot;
  }
  return max + 1;

const nodesById = {};
// Rebuilds the id->node lookup from whichever region's DATA is currently active --
// must be called every time DATA is (re)assigned (picking a region, resuming a slot).
function rebuildNodesById(){
  for(const k in nodesById) delete nodesById[k];
  if(DATA) DATA.mapNodes.forEach(n=>{ nodesById[n.id] = n; });
  mapBuilt = false; // the SVG was built from the previous region's nodes -- force a rebuild
  selectedMapNodeId = null; // stale node id from a previous region wouldn't resolve anymore
}
function neighborsOf(nodeId){
  const out = [];
  DATA.mapEdges.forEach(([a,b])=>{
    if(a===nodeId) out.push(b);
    else if(b===nodeId) out.push(a);
  });
  return out;
}
// Every node reachable within 1..maxDist steps of startId, shortest-path distance,
// as a Map<nodeId, distance> -- startId itself is never included, since a move
// always has to go somewhere (no staying put and "using" the roll on nothing).
function reachableWithin(startId, maxDist){
  const dist = new Map();
  let frontier = [startId];
  dist.set(startId, 0);
  for(let d=1; d<=maxDist; d++){
    const next = [];
    frontier.forEach(id=>{
      neighborsOf(id).forEach(nid=>{
        if(!dist.has(nid)){ dist.set(nid, d); next.push(nid); }
      });
    });
    frontier = next;
    if(!frontier.length) break;
  }
  dist.delete(startId);
  return dist;
}
function nodeDisplayName(node){
  return node.kind === 'combo' ? (node.townName + ' / ' + node.dungeonName) : node.name;

function locationIdFor(node){
  if(node.kind === 'route' || node.kind === 'dungeon') return node.locationId;
  if(node.kind === 'combo') return node.dungeonLocationId;

// Every (owned Pokemon, evolution branch) pair this town's own evolution item(s)
// can trigger -- same method-text substring match the Field Guide uses to link
// an evolution to the town it's found in.
function evolveOptionsForTown(node){
  const townId = node.kind === 'combo' ? node.townId : node.id;
  const items = (DATA.evoItems && DATA.evoItems[townId]) || [];
  if(!items.length) return [];
  const options = [];
  loadGamePokemon().forEach(m=>{
    const info = DATA.evoInfo[m.name];
    if(!info || !info.evolvesInto) return;
    info.evolvesInto.forEach(e=>{
      const item = items.find(it => e.method.indexOf(it) !== -1);
      if(item) options.push({ monId: m.id, monName: m.name, targetSpecies: e.species, item });
    });
  });
  return options;
}

const DEX_SORTS = [

  { mode:'alpha', label:'A-Z' },

];
// "Regional #" order: each offered starter's full line (base -> final,
// grouped line by line, in STARTERS_BY_REGION's own order), then every
// other species in the order it was originally added to this region's own
// dex (DATA.dice's natural key-insertion order -- true for both a real
// region's hand-authored data and a generated one, since both build that
// object by inserting keys in a meaningful order rather than reassigning
// them), non-Legendary/Mythical/Ultra-Beast/Paradox species before ones
// LEGENDARY_DEX recognizes (a universal fact about a species, independent
// of which region it's in).
function dexRegionalOrder(){
  const allSpecies = Object.keys(DATA.dice);
  const allSpeciesSet = new Set(allSpecies);
  const starterOrder = [];
  const starterSet = new Set();
  (STARTERS_BY_REGION[gameState.region] || []).forEach(base=>{
    let sp = base;
    while(sp && allSpeciesSet.has(sp) && !starterSet.has(sp)){
      starterOrder.push(sp);
      starterSet.add(sp);
      const branch = (DATA.evoInfo[sp] && DATA.evoInfo[sp].evolvesInto) || [];
      sp = branch.length ? branch[0].species : null;
    }
  });
  const rest = allSpecies.filter(sp=>!starterSet.has(sp));
  const normal = rest.filter(sp=>!LEGENDARY_DEX[sp]);
  const legendary = rest.filter(sp=>LEGENDARY_DEX[sp]);
  return starterOrder.concat(normal, legendary);
}
function dexStatTotalOrder(){
  return Object.keys(DATA.dice).sort((a,b)=>
    statTotal(DATA.dice[b] || [0,0,0,0,0,0]) - statTotal(DATA.dice[a] || [0,0,0,0,0,0]));
}
function dexSortedSpeciesList(){
  if(dexSort === 'alpha') return Object.keys(DATA.dice).sort((a,b)=>a.localeCompare(b));
  if(dexSort === 'stat') return dexStatTotalOrder();

}

// The "Move here" affordance for whichever node is currently selected in the
// sidebar -- only offered while actively rolling movement, and only for a node

// must-move rule).
function moveHereHtml(node){
  if(view !== 'moving' || !movement) return '';
  if(node.id === gameState.currentNodeId){
    return '<div class="map-info-desc" style="opacity:0.65;">You are here -- you must move somewhere else this turn.</div>';
  }
  const reachable = reachableWithin(gameState.currentNodeId, movement.total);
  if(!reachable.has(node.id)){
    return '<div class="map-info-desc" style="opacity:0.65;">Not reachable with this roll.</div>';
  }
  const spacesUsed = reachable.get(node.id);
  const forfeited = movement.total - spacesUsed;
  return '<button type="button" class="map-go-btn" data-action="moveToNode" data-node="'+node.id+'">Move Here (uses '+spacesUsed+
    (forfeited ? ', forfeits '+forfeited : '') + ')</button>';

function buildGameMap(){
  mapBuilt = true;
  const maxRow = Math.max(...DATA.mapNodes.map(n=>n.row));
  const maxCol = Math.max(...DATA.mapNodes.map(n=>n.col));
  const svg = document.getElementById('mapSvg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 ' + (maxCol*CELL) + ' ' + (maxRow*CELL));
  svg.setAttribute('width', (maxCol*CELL));
  svg.setAttribute('height', (maxRow*CELL));

  DATA.mapEdges.forEach(([a,b])=>{
    const na = nodesById[a], nb = nodesById[b];
    if(!na || !nb) return;
    const pa = nodeXY(na), pb = nodeXY(nb);
    svg.appendChild(svgEl('line', { class:'map-edge', x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y }));
  });

  DATA.mapNodes.forEach(n=>{
    const p = nodeXY(n);
    const g = svgEl('g', {class:'map-node', 'data-id': n.id});

    if(n.kind === 'town'){
      const s = 11;
      const townFill = n.id === DATA.eliteFourTownId ? 'var(--elite-purple)' : (n.gymLeader ? 'var(--gold)' : 'var(--nogym-green)');
      g.appendChild(svgEl('rect', { class:'map-node-shape', x:p.x-s, y:p.y-s, width:s*2, height:s*2, fill:townFill }));
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y+3, 'text-anchor':'middle', 'font-size':8})).textContent = n.mapLabel || n.id;
    } else if(n.kind === 'dungeon'){
      const s = 11;
      const points = [ [p.x, p.y-s], [p.x-s, p.y+s*0.8], [p.x+s, p.y+s*0.8] ].map(pt=>pt.join(',')).join(' ');
      g.appendChild(svgEl('polygon', { class:'map-node-shape', points, fill:'var(--rust)' }));
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y+21, 'text-anchor':'middle', 'font-size':6.5})).textContent = n.mapLabel || n.id;
    } else if(n.kind === 'combo'){
      const w = 12, hTop = 10, hBottom = 12;
      const topFill = n.gymLeader ? 'var(--gold)' : 'var(--nogym-green)';
      const topPts = [ [p.x-w,p.y-hTop], [p.x+w,p.y-hTop], [p.x+w,p.y], [p.x-w,p.y] ].map(pt=>pt.join(',')).join(' ');
      const bottomPts = [ [p.x-w,p.y], [p.x+w,p.y], [p.x,p.y+hBottom] ].map(pt=>pt.join(',')).join(' ');
      g.appendChild(svgEl('polygon', {class:'map-node-shape', points: topPts, fill:topFill}));
      g.appendChild(svgEl('polygon', {class:'map-node-shape', points: bottomPts, fill:'var(--rust)'}));
      g.appendChild(svgEl('line', {class:'map-node-divider', x1:p.x-w, y1:p.y, x2:p.x+w, y2:p.y}));
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y-3, 'text-anchor':'middle', 'font-size':7})).textContent = n.mapLabel || n.townId;
      g.appendChild(svgEl('text', {class:'map-node-label map-node-label-light', x:p.x, y:p.y+9, 'text-anchor':'middle', 'font-size':6})).textContent = n.dungeonMapLabel || n.dungeonId;
    } else {
      const r = 11;
      g.appendChild(svgEl('circle', {class:'map-node-shape', cx:p.x, cy:p.y, r, fill:'var(--sage)'}));
      const fontSize = n.id.length >= 3 ? 6.5 : 7.5;
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y+2.5, 'text-anchor':'middle', 'font-size':fontSize})).textContent = n.id;
    }

    g.addEventListener('click', ()=> selectMapNode(n.id));
    svg.appendChild(g);
  });
}

// Every type across a starter line's whole evolution (Basic + Stage1 + Stage2),
// not just the Basic form shown on the card -- looked up from NATIONAL_DEX
// (declared below) since STARTER_LINE_POOL only carries the Basic's own types.
function allTypesForStarterLine(line){
  const types = new Set();
  [line.basic, line.stage1, line.stage2].forEach(name=>{
    const row = NATIONAL_DEX[name];
    if(row){ types.add(row[0]); if(row[1]) types.add(row[1]); }
  });
  return types;
}
// Randomly draws 3 starter lines with zero type overlap between them anywhere
// in their evolution (e.g. picking Charmander -- Fire/Fire/Fire+Flying -- rules
// out every other line that carries Fire OR Flying at any stage, not just ones
// whose Basic form does). Reshuffles and retries on the rare shuffle order that
// can't complete a valid trio via a single greedy left-to-right pass.
function pickRandomStarterLines(){
  const pool = STARTER_LINE_POOL.slice();
  for(let attempt=0; attempt<200; attempt++){
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const picked = [];
    const usedTypes = new Set();
    for(const line of pool){
      const lineTypes = allTypesForStarterLine(line);
      let conflict = false;
      for(const t of lineTypes){ if(usedTypes.has(t)){ conflict = true; break; } }
      if(conflict) continue;
      picked.push(line);
      lineTypes.forEach(t=>usedTypes.add(t));
      if(picked.length === 3) break;
    }
    if(picked.length === 3) return picked;
  }
  // Practically unreachable given the pool's type spread -- keep the UI
  // functional rather than leaving starters unpicked.
  return pool.slice(0,3);
}

// ---- Type wheel: each type's (east,north) unit direction on the compass --
// sin = East-West component (positive = East), cos = South-North component
// (positive = North). Drives which compass direction of the generated map
// each type "belongs" in.
const TYPE_WHEEL = {
  Dragon:{e:0.90631,n:0.42262}, Flying:{e:0.99619,n:0.08716}, Normal:{e:0.96593,n:-0.25882},
  Fighting:{e:0.81915,n:-0.57358}, Dark:{e:0.57358,n:-0.81915}, Fire:{e:0.25882,n:-0.96593},
  Ghost:{e:-0.08716,n:-0.99619}, Psychic:{e:-0.42262,n:-0.90631}, Fairy:{e:-0.70711,n:-0.70711},
  Grass:{e:-0.90631,n:-0.42262}, Poison:{e:-0.99619,n:-0.08716}, Bug:{e:-0.96593,n:0.25882},
  Electric:{e:-0.81915,n:0.57358}, Steel:{e:-0.57358,n:0.81915}, Rock:{e:-0.25882,n:0.96593},
  Ground:{e:0.08716,n:0.99619}, Ice:{e:0.42262,n:0.90631}, Water:{e:0.70711,n:0.70711},
};

// { type: fraction } across every form in the family (branches included) -- a
// dual-type form contributes one slot to each of its two types.
function familyTypeScore(family){
  const counts = {};
  let total = 0;
  for(const [name] of family){
    const row = NATIONAL_DEX[name];
    counts[row[0]] = (counts[row[0]]||0) + 1; total++;
    if(row[1]){ counts[row[1]] = (counts[row[1]]||0) + 1; total++; }
  }
  const score = {};
  for(const t in counts) score[t] = counts[t] / total;
  return score;
}
// The family's type score, projected through the type wheel -- its own
// weighted-average compass direction.
function typeScoreDirection(score){
  let e = 0, n = 0;
  for(const t in score){ const w = TYPE_WHEEL[t]; e += score[t]*w.e; n += score[t]*w.n; }
  return { e, n };
}
function tableTypeScore(table){
  const score = {};
  for(const t in table.typeCounts) score[t] = table.typeCounts[t] / table.typeTotal;
  return score;
}
// Step 3 of the region-dex algorithm: current-type-score dot line-type-score,
// plus the line's compass direction dotted with the table's own (normalized)
// map coordinate, plus a random tiebreaker.
function scoreTableForFamily(table, lineScore, lineDir){
  const routeScore = tableTypeScore(table);
  let dotType = 0;
  for(const t in lineScore){ if(routeScore[t]) dotType += routeScore[t]*lineScore[t]; }
  const dotDir = lineDir.e*table.normEast + lineDir.n*table.normNorth;
  return dotType*5 + dotDir + Math.random();
}
// The stat total of the family's own fully-evolved form(s) -- averaged across
// branch endpoints when the family's final stage splits (e.g. Vileplume/
// Bellossom) -- applied to every member of the family regardless of that
// member's own stage, as a signal of "how strong does this line end up."
function familyFinalEvoTotal(family){
  const maxStage = Math.max(...family.map(([,s])=>s));
  const finals = family.filter(([,s])=>s===maxStage).map(([n])=>n);
  const totals = finals.map(n => NATIONAL_DEX[n].slice(2).reduce((a,b)=>a+b,0));
  return totals.reduce((a,b)=>a+b,0) / totals.length;
}
function placeFormsInTable(table, forms, finalEvoTotal){
  forms.forEach(([name, stage])=>{
    table.members.push({ name, stage, finalEvoTotal });
    const row = NATIONAL_DEX[name];
    table.typeCounts[row[0]] = (table.typeCounts[row[0]]||0) + 1; table.typeTotal++;
    if(row[1]){ table.typeCounts[row[1]] = (table.typeCounts[row[1]]||0) + 1; table.typeTotal++; }
  });
}

// Groups the generated map's route/dungeon tiles into encounter-table units:
// every route tile sharing the same leading route number is one table (e.g.
// "3a"/"3b"/"3c" -> "Route 3"), every standalone dungeon tile is its own
// table, and every combo node's dungeon half is its own table. Town tiles
// (and the town half of a combo) never get a wild encounter table. Each
// table's coordinate is the average of its member tiles' (east,north)
// offsets from the Central City, normalized by the map's own max radius so
// far-flung tables don't just win every type match on distance alone.
function buildRegionTables(region){
  const central = region.mapNodes.find(n=>n.central) || region.mapNodes[0];
  const originRow = central.row, originCol = central.col;
  const groups = {};
  region.mapNodes.forEach(n=>{
    if(n.kind === 'route'){
      const routeNum = (n.id.match(/^\d+/) || [n.id])[0];
      const key = 'route:'+routeNum;
      (groups[key] = groups[key] || { kind:'route', id:'Route '+routeNum, tiles:[] }).tiles.push(n);
    } else if(n.kind === 'dungeon'){
      groups['dungeon:'+n.id] = { kind:'dungeon', id:n.id, tiles:[n], standalone:true };
    } else if(n.kind === 'combo'){
      groups['dungeon:'+n.dungeonId] = { kind:'dungeon', id:n.dungeonId, tiles:[n], standalone:false };
    }
  });
  const tables = Object.values(groups).map(g=>{
    const avgRow = g.tiles.reduce((a,t)=>a+t.row,0) / g.tiles.length;
    const avgCol = g.tiles.reduce((a,t)=>a+t.col,0) / g.tiles.length;
    return {
      id: g.id, kind: g.kind, standalone: !!g.standalone,
      east: avgCol - originCol, north: originRow - avgRow,
      members: [], typeCounts: {}, typeTotal: 0, capacity: 11, legendary: null,
    };
  });
  const maxRadius = Math.max(1e-9, ...tables.map(t=>Math.hypot(t.east, t.north)));
  tables.forEach(t=>{ t.normEast = t.east/maxRadius; t.normNorth = t.north/maxRadius; });
  return tables;
}

// The main region-dex loop: randomly draw evolution families (no repeats)
// and slot each whole family into its 2 best-scoring tables that have room
// for every one of its forms. When fewer than 2 tables can fit the whole
// family (including when none can), the table with the most room left
// (tiebroken by score) takes as much of the family as fits, Basic form
// first -- this guarantees every table eventually fills to exactly 11/11
// even once the remaining families are all "too big" for what's left.
function populateRegionTables(tables, gymDraft, excludeSpecies){
  const families = excludeSpecies
    ? EVOLUTION_FAMILIES.filter(fam => !fam.some(([n]) => excludeSpecies.has(n)))
    : EVOLUTION_FAMILIES.slice();
  for(let i=families.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [families[i], families[j]] = [families[j], families[i]];
  }

  for(const family of families){
    const openTables = tables.filter(t=>t.members.length < t.capacity);
    if(!openTables.length) break;

    const lineScore = familyTypeScore(family);
    const lineDir = typeScoreDirection(lineScore);
    const finalEvoTotal = familyFinalEvoTotal(family);
    const scored = openTables.map(t=>({ t, score: scoreTableForFamily(t, lineScore, lineDir) }));
    const qualifying = scored.filter(s => (s.t.capacity - s.t.members.length) >= family.length);

    if(qualifying.length >= 2){
      qualifying.sort((a,b)=>b.score-a.score);
      placeFormsInTable(qualifying[0].t, family, finalEvoTotal);
      placeFormsInTable(qualifying[1].t, family, finalEvoTotal);
    } else {
      scored.sort((a,b)=>{
        const roomA = a.t.capacity-a.t.members.length, roomB = b.t.capacity-b.t.members.length;
        return roomB !== roomA ? roomB-roomA : b.score-a.score;
      });
      const target = scored[0].t;
      placeFormsInTable(target, family.slice(0, target.capacity-target.members.length), finalEvoTotal);
    }

    if(gymDraft) draftGymCandidate(family, gymDraft);
  }
}

/* ============ Gym / Elite Four / Champion drafting ============
   Runs alongside populateRegionTables() (same loop, same draw order) so it
   naturally stops once every table is full, same as the wild-encounter side.
   See conversation: for every family drawn, pick a random final evolution
   (if the family branches at the top) and a random type that runs through
   every single form in the line -- or, when no type is common to every form
   (e.g. Eevee's branches), a random type off the chosen final evolution
   instead. That {chosenFinal, type} pair is logged in draw order (used later
   for gym-list backfilling and the Champion's leftover pool) and, if that
   type's list has fewer than 5 members so far, added to it. */
function statTotalOf(name){
  return NATIONAL_DEX[name].slice(2).reduce((a,b)=>a+b, 0);
}
function draftGymCandidate(family, gymDraft){
  const maxStage = Math.max(...family.map(([,s])=>s));
  const finals = family.filter(([,s])=>s===maxStage).map(([n])=>n);
  const chosenFinal = finals[Math.floor(Math.random()*finals.length)];

  let common = null;
  family.forEach(([name])=>{
    const row = NATIONAL_DEX[name];
    const types = new Set([row[0], row[1]].filter(Boolean));
    common = common === null ? types : new Set([...common].filter(t=>types.has(t)));
  });
  let type;
  if(common && common.size){
    const arr = [...common];
    type = arr[Math.floor(Math.random()*arr.length)];
  } else {
    const frow = NATIONAL_DEX[chosenFinal];
    const farr = [frow[0], frow[1]].filter(Boolean);
    type = farr[Math.floor(Math.random()*farr.length)];
  }

  gymDraft.log.push({ chosenFinal, type });
  const list = gymDraft.lists[type];
  if(list.length === 0) gymDraft.firstAdded[type] = gymDraft.log.length - 1;
  if(list.length < 5){
    list.push(chosenFinal);
    if(list.length === 5) gymDraft.completionOrder.push(type);
  }
}

// Step 5/final sort: every member of a table is ranked by adjusted stat
// total + a per-stage bonus (0/3/7 for Basic/Stage1/Stage2) + the family's own
// final-evolution stat total squared/100 (rewards lines that end up strong,
// even for a member that's still an early stage itself) + rand()*7, then
// filed lowest-to-highest into the table's 11 encounter slots (2d6 sums 2-12
// in order).
function sortAndFillTable(table){
  const ranked = table.members.map(m=>{
    const dice = NATIONAL_DEX[m.name].slice(2);
    const base = dice.reduce((a,b)=>a+b, 0);
    const bonus = m.stage === 0 ? 0 : (m.stage === 1 ? 3 : 7);
    const finalEvoBoost = (m.finalEvoTotal * m.finalEvoTotal) / 100;
    return { name: m.name, sort: base + bonus + finalEvoBoost + Math.random()*7 };
  });
  ranked.sort((a,b)=>a.sort-b.sort);
  const names = ranked.map(r=>r.name);
  if(table.legendary) names.push(table.legendary); // always the 12 slot, never scored into the normal sort
  table.table = names;
}

// { type: fraction } for a single Legendary/Mythical species -- same shape as
// familyTypeScore()'s output, sourced from LEGENDARY_DEX instead of
// NATIONAL_DEX since these species are excluded from the normal dex.
function legendaryTypeScore(name){
  const row = LEGENDARY_DEX[name];
  const score = {};
  if(row[1]){ score[row[0]] = 0.5; score[row[1]] = 0.5; } else { score[row[0]] = 1; }
  return score;
}
function placeLegendaryInTable(table, name){
  table.legendary = name;
  table.capacity = 10; // reserve the 12 slot -- the normal family loop only ever sees 10 open here
  const row = LEGENDARY_DEX[name];
  table.typeCounts[row[0]] = (table.typeCounts[row[0]]||0) + 1; table.typeTotal++;
  if(row[1]){ table.typeCounts[row[1]] = (table.typeCounts[row[1]]||0) + 1; table.typeTotal++; }
}
// Randomly draws whole Legendary/Mythical groups (duo/trio/quad members always
// placed together, everything else solo) until `n` individual species have
// been gathered or no remaining group fits what's left -- a group that can't
// fit in the remaining budget is discarded and a different one is tried, per
// the "if not, try to select a different legend/mythic Pokemon" rule.
function selectLegendaryUnits(n){
  const pool = LEGENDARY_GROUPS.slice();
  const selected = [];
  let remaining = n;
  while(remaining > 0 && pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    const group = pool.splice(idx, 1)[0];
    if(group.length <= remaining){
      selected.push(...group);
      remaining -= group.length;
    }
  }
  return selected;
}
// Step 0 of region-dex generation: one Legendary/Mythical per standalone
// (non-town-attached) dungeon, filling its 12 slot, placed one at a time in
// selection order into whichever remaining eligible dungeon scores highest
// for that specific species (same dotType*5 + dotDir + rand() formula as the
// normal loop) -- so a group's members tend to scatter into dungeons that
// each suit their own individual typing, not pile into one.
function placeLegendariesInDungeons(tables){
  const eligible = tables.filter(t=>t.standalone);
  const legendaries = selectLegendaryUnits(eligible.length);
  const available = eligible.slice();
  legendaries.forEach(name=>{
    if(!available.length) return;
    const lineScore = legendaryTypeScore(name);
    const lineDir = typeScoreDirection(lineScore);
    const scored = available.map(t=>({ t, score: scoreTableForFamily(t, lineScore, lineDir) }));
    scored.sort((a,b)=>b.score-a.score);
    const target = scored[0].t;
    placeLegendaryInTable(target, name);
    available.splice(available.indexOf(target), 1);
  });
}

// Ranks `names` by adjusted stat total + rand()*randMax, highest first
// (index 0 = rank 1). Returns just the reordered names.
function rankByStatPlusRand(names, randMax){
  return names
    .map(n=>({ n, score: statTotalOf(n) + Math.random()*randMax }))
    .sort((a,b)=>b.score-a.score)
    .map(r=>r.n);
}
// orderMap[finalPosition] = index into the rank-1..N array (0-indexed) that
// lands at that final position -- e.g. E4_ORDER[4]===0 means rank 1 (the
// highest) ends up at final position 5 (index 4), the "ace", last in the team.
const E4_ORDER = [2,4,1,3,0];
const CHAMP_ORDER = [5,2,4,1,3,0];
function orderTeam(names, orderMap, randMax){
  const ranked = rankByStatPlusRand(names, randMax);
  // Filters out slots the fixed permutation expects but `names` came up short
  // of (e.g. a very small region's Champion pool running dry before 6 picks)
  // rather than leaving gaps -- the team's just smaller, still gap-free.
  return orderMap.map(idx=>ranked[idx]).filter(Boolean);
}

// ---- Levels + attack types (see Calli_Gym_Leaders.md / Calli_Elite_Four.md
// and the real fixedAttackType()/rollGymTeam() code for where these come
// from). No live badge counter exists yet for a Custom Region preview, so
// gyms are shown as if the player were on their 8th badge (badges=7) --
// levels = badges + {5,4,4,5,3} for the ace/2nd/3rd/4th/5th slots, same
// formula rollGymTeam() uses. Elite Four/Champion reuse Calli's own fixed
// per-slot level table verbatim (E4 escalates gently 1->4, Champion sits at
// the same ceiling as E4 #4 with one extra slot).
const GYM_SLOT_LEVELS = { '1':12, '2':11, '3':11, '4':12, '5':10 };
const E4_SLOT_LEVELS = [
  { '1':11, '2':12, '3':12, '4':13, 'ace':13 },
  { '1':12, '2':12, '3':13, '4':13, 'ace':14 },
  { '1':12, '2':13, '3':13, '4':14, 'ace':14 },
  { '1':13, '2':13, '3':14, '4':14, 'ace':15 },
];
const CHAMPION_SLOT_LEVELS = { '1':13, '2':13, '3':14, '4':14, '5':15, 'ace':15 };
const SLOT_SEQUENCE_5 = ['1','2','3','4','ace'];
const SLOT_SEQUENCE_6 = ['1','2','3','4','5','ace'];

// Same rule as the real game's fixedAttackType(), but sourced from
// NATIONAL_DEX -- Custom Region generation runs independently of the active
// game's DATA (which fixedAttackType() itself reads from, and which may not
// even exist yet if no adventure has been started).
function customRegionFixedAttackType(species, slotKey){
  const row = NATIONAL_DEX[species];
  const primary = (row[0] || 'Normal').toLowerCase();
  const secondary = row[1] ? row[1].toLowerCase() : null;
  const baseType = (slotKey === '2') ? (secondary || primary) : primary;
  const idx = WHEEL.indexOf(baseType);
  let shift = 0;
  if(slotKey === '3') shift = 1;
  if(slotKey === '4') shift = -1;
  const finalIdx = ((idx + shift) % WHEEL.length + WHEEL.length) % WHEEL.length;
  return WHEEL[finalIdx];
}
function memberInfo(species, slotKey, level){
  return { species, level, slotKey, atk: cap(customRegionFixedAttackType(species, slotKey)) };
}
// Gyms: attack-type "slot" follows stat RANK (rank 1/highest = slot "1", the
// ace) rather than final display position, matching how Calli's own gym data
// authors slot identity independently of rollGymTeam()'s sendOrder reshuffle.
function buildGymTeamMembers(names){
  const ranked = rankByStatPlusRand(names, 5);
  const info = ranked.map((sp,i)=>{
    const slotKey = String(i+1);
    return memberInfo(sp, slotKey, GYM_SLOT_LEVELS[slotKey]);
  });
  // Displayed in ascending level (never a dip, per the "5 for the ace, 4 for
  // the 2nd added, 4 for the 3rd..." add-order levels) with the ace (slot
  // "1") always sorted last even on a level tie with slot 4 (also +5) --
  // "always last in the team" still holds regardless of the level match.
  return info.slice().sort((a,b)=>{
    if(a.slotKey==='1') return 1;
    if(b.slotKey==='1') return -1;
    return a.level - b.level;
  });
}
// Elite Four/Champion: slot identity follows final display POSITION instead
// (position 0 -> "1", ..., last -> "ace"), matching how the real E4/Champion
// data lists slots 1..ace in that exact left-to-right order with no separate
// send-order reshuffle.
function buildEscalatingTeamMembers(names, orderMap, slotSequence, levels){
  const ordered = orderTeam(names, orderMap, 5);
  return ordered.map((sp,i)=>{
    const slotKey = slotSequence[i] || 'ace';
    return memberInfo(sp, slotKey, levels[slotKey] || levels.ace);
  });
}

// Grows up to `neededCount` MORE type lists to 5 members, entirely from this
// region's own drafted candidates (gymDraft.log) -- never the national dex,
// and never touching a type in `skipTypes` (already locked in elsewhere).
// Per type, increasingly permissive strategies: same type + unused, same
// type + reuse (already sitting in some other list), then -- last resort --
// one step around the attack-type wheel (random direction first, then the
// other) to borrow a candidate of an adjacent type instead, also
// unused-then-reuse. Stops as soon as `neededCount` new completions happen.
function growTypeListsUntil(gymDraft, usedFinals, skipTypes, neededCount){
  const newlyCompleted = [];
  if(neededCount <= 0) return newlyCompleted;

  function tryFillOne(searchType, list, allowReuse){
    const match = gymDraft.log.find(e => e.type===searchType && !list.includes(e.chosenFinal) &&
      (allowReuse || !usedFinals.has(e.chosenFinal)));
    if(!match) return false;
    list.push(match.chosenFinal);
    usedFinals.add(match.chosenFinal);
    return true;
  }
  function growList(type){
    const list = gymDraft.lists[type];
    if(list.length === 5) return;
    while(list.length < 5 && tryFillOne(type, list, false)){}
    while(list.length < 5 && tryFillOne(type, list, true)){}
    while(list.length < 5){
      const idx = WHEEL.indexOf(type.toLowerCase());
      const firstDir = Math.random() < 0.5 ? 1 : -1;
      let filled = false;
      for(const d of [firstDir, -firstDir]){
        const adjType = cap(WHEEL[(idx + d + WHEEL.length) % WHEEL.length]);
        if(tryFillOne(adjType, list, false) || tryFillOne(adjType, list, true)){ filled = true; break; }
      }
      if(!filled) break; // truly stuck -- not enough regional candidates exist, list stays short
    }
    if(list.length === 5) newlyCompleted.push(type);
  }

  for(const size of [4,3,2,1,0]){
    if(newlyCompleted.length >= neededCount) break;
    const candidates = Object.keys(gymDraft.lists)
      .filter(t => gymDraft.lists[t].length === size && !skipTypes.has(t))
      .sort((a,b)=> (gymDraft.firstAdded[a]??Infinity) - (gymDraft.firstAdded[b]??Infinity));
    for(const type of candidates){
      if(newlyCompleted.length >= neededCount) break;
      growList(type);
    }
  }
  return newlyCompleted;
}

// to the neutral pool the other 1/3, and whenever `type` is null e.g. no
// clean primary type to key off of), then falls back across pools/to a
// numbered placeholder only once every real option is already taken.
function pickLeaderName(type, usedNames){
  const useType = !!type && Math.random() < (2/3);
  const primary = useType ? (LEADER_NAME_POOL[type]||[]) : LEADER_NAME_NEUTRAL;
  const fallback = useType ? LEADER_NAME_NEUTRAL : (LEADER_NAME_POOL[type]||[]);
  let name = shuffled(primary).find(nm=>!usedNames.has(nm));
  if(!name) name = shuffled(fallback).find(nm=>!usedNames.has(nm));

    const all = LEADER_NAME_NEUTRAL.concat(...Object.values(LEADER_NAME_POOL));
    name = shuffled(all).find(nm=>!usedNames.has(nm));
  }
  if(!name){
    let i = 2;
    while(usedNames.has('Trainer'+i)) i++;
    name = 'Trainer'+i;
  }
  usedNames.add(name);
  return name;
}

// Elite Four is decided FIRST, from naturally-complete (pure single-type)
// lists only, top 4 by total team stat -- the type-growth/rescue chain only
// runs for Elite Four if there aren't even 4 naturally-complete lists to
// choose from, and even then grows only as many extra types as needed to
// reach exactly 4, so an Elite Four team is cross-type (via wheel rotation)
// only when truly unavoidable. The 8 regular gyms are decided AFTER, from
// whatever complete lists are left (natural first, in draw order, then
// grown/rescued same as before) -- and the Champion is the leftover lines
// never used in a gym/E4 team, drawn 3 at a time (highest stat total in each
// trio, skipping a trio whose pick would be a type's 3rd appearance on the
// team) until 6 members are seated. See conversation for the full spec;
// final in-team ordering for each uses its own fixed ordering (gyms sort
// ascending by level, ace last on a tie; E4/Champion use their own fixed
// rank->position permutation, E4_ORDER/CHAMP_ORDER).
function buildGymEliteFourChampion(gymDraft){
  const usedFinals = new Set();
  Object.values(gymDraft.lists).forEach(list=>list.forEach(n=>usedFinals.add(n)));

  let e4CandidateTypes = gymDraft.completionOrder.slice();
  if(e4CandidateTypes.length < 4){
    const grown = growTypeListsUntil(gymDraft, usedFinals, new Set(e4CandidateTypes), 4 - e4CandidateTypes.length);
    e4CandidateTypes = e4CandidateTypes.concat(grown);
  }
  const withSums = e4CandidateTypes.map(type=>({
    type,
    sum: gymDraft.lists[type].reduce((a,n)=>a+statTotalOf(n), 0),
  }));
  withSums.sort((a,b)=>b.sum-a.sum);
  const e4Types = withSums.slice(0,4).map(w=>w.type).reverse();
  const e4TypeSet = new Set(e4Types);
  const eliteFour = e4Types.map((type,i)=>({
    type,
    members: buildEscalatingTeamMembers(gymDraft.lists[type], E4_ORDER, SLOT_SEQUENCE_5, E4_SLOT_LEVELS[i]),
  }));

  let gymCandidateTypes = gymDraft.completionOrder.filter(t=>!e4TypeSet.has(t));
  if(gymCandidateTypes.length < 8){
    const grown = growTypeListsUntil(gymDraft, usedFinals, new Set([...e4TypeSet, ...gymCandidateTypes]), 8 - gymCandidateTypes.length);
    gymCandidateTypes = gymCandidateTypes.concat(grown);
  }
  const gymTypes = gymCandidateTypes.slice(0,8);
  const gyms = gymTypes.map(type=>({
    type,
    members: buildGymTeamMembers(gymDraft.lists[type]),
  }));

  const leftover = gymDraft.log.filter(e => !usedFinals.has(e.chosenFinal));
  const champTypeCounts = {};
  const championPicks = [];
  const usedChampionFinals = new Set();
  let i = 0;
  while(championPicks.length < 6 && i + 3 <= leftover.length){
    const group = leftover.slice(i, i+3);
    i += 3;
    group.sort((a,b)=> statTotalOf(b.chosenFinal)-statTotalOf(a.chosenFinal));
    const best = group[0];
    if((champTypeCounts[best.type]||0) >= 2) continue;
    championPicks.push(best.chosenFinal);
    usedChampionFinals.add(best.chosenFinal);
    champTypeCounts[best.type] = (champTypeCounts[best.type]||0) + 1;
  }
  // Rescue: drawing 3-at-a-time can run out of leftover candidates before
  // reaching 6 (most of the region's drafted lines already went to a gym or
  // E4 team). Finish the roster one pick at a time instead -- still best-
  // stat-first, still respecting the 2-per-type cap where possible -- then
  // relax the type cap, then finally allow reusing a species already on a
  // gym/E4 team (never a species already on the Champion's own roster) as
  // an absolute last resort. The Champion's team must always reach 6, the
  // same "always guarantee the count" rule already applied to the 8 gyms.
  if(championPicks.length < 6){
    leftover.filter(e => !usedChampionFinals.has(e.chosenFinal))
      .sort((a,b)=> statTotalOf(b.chosenFinal)-statTotalOf(a.chosenFinal))
      .forEach(e => {
        if(championPicks.length >= 6 || (champTypeCounts[e.type]||0) >= 2) return;
        championPicks.push(e.chosenFinal);
        usedChampionFinals.add(e.chosenFinal);
        champTypeCounts[e.type] = (champTypeCounts[e.type]||0) + 1;
      });
  }
  if(championPicks.length < 6){
    leftover.filter(e => !usedChampionFinals.has(e.chosenFinal))
      .sort((a,b)=> statTotalOf(b.chosenFinal)-statTotalOf(a.chosenFinal))
      .forEach(e => {
        if(championPicks.length >= 6) return;
        championPicks.push(e.chosenFinal);
        usedChampionFinals.add(e.chosenFinal);
      });
  }
  if(championPicks.length < 6){
    gymDraft.log.map(e=>e.chosenFinal).filter(n => !usedChampionFinals.has(n))
      .sort((a,b)=> statTotalOf(b)-statTotalOf(a))
      .forEach(n => {
        if(championPicks.length >= 6) return;
        championPicks.push(n);
        usedChampionFinals.add(n);
      });
  }
  const champion = { members: buildEscalatingTeamMembers(championPicks, CHAMP_ORDER, SLOT_SEQUENCE_6, CHAMPION_SLOT_LEVELS) };

  // Names: gyms and E4 key off their team's single type; the Champion has
  // no single type of its own, so its name is weighted off its ace's type
  // instead (the last-sent, top-billed member of the roster).
  const usedLeaderNames = new Set();
  eliteFour.forEach(e => { e.leaderName = pickLeaderName(e.type, usedLeaderNames); });
  gyms.forEach(g => { g.leaderName = pickLeaderName(g.type, usedLeaderNames); });
  const champAce = champion.members.find(m => m.slotKey === 'ace');
  const champAceRow = champAce && NATIONAL_DEX[champAce.species];
  champion.leaderName = pickLeaderName(champAceRow ? champAceRow[0] : null, usedLeaderNames);

  return { eliteFour, gyms, champion };
}

// ---- Type tables (dungeons/routes: % breakdown of their own encounter
// table; towns: % breakdown pooled across every route directly connected to
// them). Every location/town gets one -- only the 8 gym towns' tables are
// actually used yet (for the gym assignment below); the rest are stored on
// region.locations[].typeTable / region.mapNodes[].typeTable for later. ----
function typesOf(species){
  const row = NATIONAL_DEX[species] || LEGENDARY_DEX[species];
  return row ? [row[0], row[1]] : [null, null];
}
function typeTableForSpeciesList(names){
  const counts = {};
  let total = 0;
  names.forEach(sp=>{
    typesOf(sp).forEach(t=>{ if(t){ counts[t] = (counts[t]||0) + 1; total++; } });
  });
  if(!total) return {};
  const pct = {};
  for(const t in counts) pct[t] = (counts[t] / total) * 100;
  return pct;
}
function computeTownTypeTable(region, nodeId){
  const routeIds = new Set();
  region.mapEdges.forEach(([a,b])=>{
    const otherId = a===nodeId ? b : (b===nodeId ? a : null);
    if(otherId == null) return;
    const otherNode = region.mapNodes.find(n=>n.id===otherId);
    if(otherNode && otherNode.kind==='route') routeIds.add(customRegionTableIdForNode(otherNode));
  });
  const species = [];
  routeIds.forEach(rid=>{
    const loc = region.locations.find(l=>l.id===rid);
    if(loc) species.push(...loc.table);
  });
  return typeTableForSpeciesList(species);
}
// Exhaustive search (n<=8, so at most 8! branches, pruned) for the gym-type
// -> gym-town assignment that maximizes the total sum of "this gym's type's
// percentage in that town's own type table" -- a true optimum, not a greedy
// approximation, since 8! is trivial to fully explore.
function optimalTypeAssignment(gymTypes, townTypeTables){
  const n = gymTypes.length;
  const used = new Array(n).fill(false);
  const cur = new Array(n);
  let best = null, bestScore = -Infinity;
  function dfs(i, score){
    if(score + (n-i)*100 <= bestScore) return;
    if(i === n){
      if(score > bestScore){ bestScore = score; best = cur.slice(); }
      return;
    }
    for(let t=0;t<n;t++){
      if(used[t]) continue;
      used[t] = true;
      cur[i] = t;
      dfs(i+1, score + ((townTypeTables[t] && townTypeTables[t][gymTypes[i]]) || 0));
      used[t] = false;
    }
  }
  dfs(0, 0);
  return best; // best[gymIdx] = town index
}

// Weighted random type pick from a type table, weight = percentage SQUARED
// -- disproportionately favors whichever type(s) already dominate the
// table over a flatter, more-evenly-spread one.
function pickWeightedType(typeTable){
  const entries = Object.entries(typeTable||{});
  if(!entries.length) return null;
  const weights = entries.map(([t,pct])=>[t, pct*pct]);
  const total = weights.reduce((a,[,w])=>a+w, 0);
  if(total <= 0) return null;
  let r = Math.random()*total;
  for(const [t,w] of weights){
    r -= w;
    if(r <= 0) return t;
  }
  return weights[weights.length-1][0];
}
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Rolls a weighted type from typeTable (weight = percentage squared, same
// scheme pickWeightedType uses), but if the type that comes up represents
// NAME_NEUTRAL_WEIGHT_THRESHOLD or less of the table's total weight,
// redirects to the neutral pool (null) instead of committing to that
// weakly-represented type. Called once per individual whole word / prefix /
// suffix (not once per name), so a combo name's prefix and suffix each get
// their own independent type-or-neutral roll -- Fire+Grass, Fire+Fire, or a
// typed half paired with a neutral half are all possible from one town.
let NAME_NEUTRAL_WEIGHT_THRESHOLD = 0.11; // tuned empirically so ~20% of individual picks land neutral -- see conversation
function pickTypeOrNeutral(typeTable){
  const entries = Object.entries(typeTable||{});
  if(!entries.length) return null;
  const weights = entries.map(([t,pct])=>[t, pct*pct]);
  const total = weights.reduce((a,[,w])=>a+w, 0);
  if(total <= 0) return null;
  let r = Math.random()*total;
  let chosen = weights[weights.length-1];
  for(const w of weights){ r -= w[1]; if(r <= 0){ chosen = w; break; } }
  return (chosen[1]/total) <= NAME_NEUTRAL_WEIGHT_THRESHOLD ? null : chosen[0];
}
function tryWholeWord(typeTable, usedNames){
  const type = pickTypeOrNeutral(typeTable);
  const wholes = type ? (TOWN_NAME_WHOLE[type]||[]) : TOWN_NAME_WHOLE_NEUTRAL;
  return shuffled(wholes).find(w=>!usedNames.has(w)) || null;
}
function tryComboWord(typeTable, usedNames, usedPrefixes, usedSuffixes){
  const prefixType = pickTypeOrNeutral(typeTable);
  const suffixType = pickTypeOrNeutral(typeTable);
  const prefixes = shuffled(prefixType ? (TOWN_NAME_PREFIX[prefixType]||[]) : TOWN_NAME_PREFIX_NEUTRAL)
    .filter(p=>!usedPrefixes.has(p));
  const suffixes = shuffled(suffixType ? (TOWN_NAME_SUFFIX[suffixType]||[]) : TOWN_NAME_SUFFIX_NEUTRAL)
    .filter(s=>!usedSuffixes.has(s));
  for(const p of prefixes) for(const s of suffixes){
    const combo = p + s;
    if(!usedNames.has(combo)){
      usedPrefixes.add(p);
      usedSuffixes.add(s);
      return combo;
    }
  }
  return null;
}
// Picks a name themed to the town's own type table. About 1/4 of towns get
// a single invented whole word (colors/descriptive terms, never a real
// Pokemon town name outright); the rest get a combination of two generic
// word-fragments (which CAN coincidentally land on a real name, unlike the
// whole-word pool, but isn't built from one on purpose) -- prefix and
// suffix each roll their own type independently. Then a probabilistic
// City/Town suffix -- gym towns lean City, non-gym towns lean Town, but
// neither is guaranteed. Tracks used base names (pre-suffix) in `usedNames`.
function generateTownName(typeTable, hasGym, usedNames, usedPrefixes, usedSuffixes){
  const cityChance = hasGym ? 0.75 : 0.25;
  const suffix = Math.random() < cityChance ? 'City' : 'Town';
  const preferWhole = Math.random() < 0.25;

  let base = null;
  for(let attempt=0; attempt<12 && !base; attempt++){
    base = preferWhole
      ? (tryWholeWord(typeTable, usedNames) || tryComboWord(typeTable, usedNames, usedPrefixes, usedSuffixes))
      : (tryComboWord(typeTable, usedNames, usedPrefixes, usedSuffixes) || tryWholeWord(typeTable, usedNames));
  }
  if(!base){
    // Last resort -- every typed AND neutral pool exhausted (hundreds of
    // combinations vs. a region's max of 16 towns, so practically
    // unreachable) -- sweep every whole-word pool directly.
    for(const t of Object.keys(TOWN_NAME_WHOLE).concat([null])){
      const wholes = t ? TOWN_NAME_WHOLE[t] : TOWN_NAME_WHOLE_NEUTRAL;
      base = shuffled(wholes).find(w=>!usedNames.has(w)) || null;
      if(base) break;
    }
  }
  if(!base){
    let n = 2;
    while(usedNames.has('Region'+n)) n++;
    base = 'Region'+n;
  }
  usedNames.add(base);
  return base + ' ' + suffix;
}
function nameAllTowns(region){
  const usedNames = new Set();
  const usedPrefixes = new Set();
  const usedSuffixes = new Set();
  region.mapNodes
    .filter(n=>n.kind==='town' || n.kind==='combo')
    .forEach(n=>{ n.name = generateTownName(n.typeTable, !!n.gymLeader, usedNames, usedPrefixes, usedSuffixes); });
}
// Map-tile short label: first 3 letters of the generated name. On a
// collision, the first 2 letters stay fixed and the 3rd slides further
// into the name (a "later letter") until a free code turns up -- e.g.
// Sandgem and Sandburst collide on SAN, so Sandburst becomes SAD (the next
// letter after the shared "San" that isn't already spoken for). Falls back
// to a 2-letter-plus-digit variant only if the whole name is exhausted.
function assignMapLabels(region){
  const used = new Set();
  region.mapNodes
    .filter(n=>n.kind==='town' || n.kind==='combo')
    .forEach(n=>{
      const clean = n.name.replace(/[^A-Za-z]/g, '').toUpperCase();
      const head = clean.slice(0,2);
      let label = clean.slice(0,3);
      if(used.has(label)){
        let alt = null;
        for(let i=3; i<clean.length && !alt; i++){
          const cand = head + clean[i];
          if(!used.has(cand)) alt = cand;
        }
        if(!alt){
          let i = 2;
          while(used.has(head+i)) i++;
          alt = head+i;
        }
        label = alt;
      }
      used.add(label);
      n.mapLabel = label;
    });
}

// Descriptor picks from the same whole-word pools towns use (weighted by
// type percentage squared, retrying a different type if that type's pool is

function generateDungeonName(typeTable, usedDescriptors){

// Region name: NOT a type-themed English word like the town/dungeon
// generators (Kanto/Johto/Hoenn/Sinnoh/Unova/Kalos/Alola/Galar/Paldea don't
// mean anything -- they just need to sound like a place). Built the way a
// conlang/fantasy name generator would: onset+vowel(+coda) syllables strung
// together, with a phoneme set chosen to land in that same foreign-but-
// pronounceable register, 2-3 syllables long (matching every real example).
const REGION_NAME_ONSETS = ['K','T','H','S','N','G','P','D','M','L','R','V','B','F','Z','J','W','Y','C','Th','Ch','Sh'];
const REGION_NAME_VOWELS = ['a','a','a','a','e','e','e','i','i','i','o','o','o','u','u','ai','eo','oa'];
const REGION_NAME_CODAS = ['n','r','l','s','m'];
function generateRegionName(){
  const realNames = new Set(['kanto','johto','hoenn','sinnoh','unova','kalos','alola','galar','paldea']);
  let name;
  do {
    const syllableCount = Math.random() < 0.55 ? 2 : 3;
    const syllables = [];
    for(let i=0; i<syllableCount; i++){
      // Every syllable but the first can occasionally lead with just a
      // vowel (Unova, Alola both open on a bare vowel) -- the first always
      // gets an onset so the name doesn't start mid-syllable.
      const onset = (i===0 || Math.random() < 0.85)
        ? REGION_NAME_ONSETS[Math.floor(Math.random()*REGION_NAME_ONSETS.length)] : '';
      syllables.push(onset + REGION_NAME_VOWELS[Math.floor(Math.random()*REGION_NAME_VOWELS.length)]);
    }
    // At most ONE syllable (never the last) picks up a trailing consonant
    // bridging into the next syllable's onset -- real region names carry at
    // most one such cluster (Kan-to, Sin-noh, Ga-lar), never several, so
    // stacking more than one here is what made early drafts unpronounceable.
    if(syllableCount > 1 && Math.random() < 0.55){
      const idx = Math.floor(Math.random() * (syllableCount - 1));
      syllables[idx] += REGION_NAME_CODAS[Math.floor(Math.random()*REGION_NAME_CODAS.length)];
    }
    const raw = syllables.join('');
    name = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
  } while(realNames.has(name.toLowerCase()) || name.length < 4 || name.length > 9);
  return name;
}
// Dungeon short code: the starting letters of the name's first two words
// (e.g. "Tide Crag" -> TC). On a collision, the first word's initial stays
// fixed and the second letter slides further into the second word -- e.g.
// Tide Crag and Tide Cliffs both start TC, so Cliffs' code becomes TL (the
// next letter of "Cliffs" that isn't already taken) -- mirroring the same
// later-letter resolution used for town labels. Falls back to a digit only
// if the second word itself is exhausted.
function assignDungeonMapLabels(region){
  const used = new Set();
  region.locations
    .filter(l=>l.kind==='dungeon')
    .forEach(l=>{
      const words = (l.name||'').split(' ').filter(Boolean);
      const w1 = (words[0]||'').replace(/[^A-Za-z]/g, '').toUpperCase();
      const w2 = (words[1]||'').replace(/[^A-Za-z]/g, '').toUpperCase();
      const first = w1.slice(0,1);
      let label = first + w2.slice(0,1);
      if(used.has(label)){
        let alt = null;
        for(let i=1; i<w2.length && !alt; i++){
          const cand = first + w2[i];
          if(!used.has(cand)) alt = cand;
        }
        if(!alt){
          let i = 2;
          while(used.has(first+i)) i++;
          alt = first+i;
        }
        label = alt;
      }
      used.add(label);
      l.mapLabel = label;
    });
}

function assignGymTowns(region, gyms){
  const gymNodes = region.mapNodes.filter(n=>(n.kind==='town'||n.kind==='combo') && n.gymLeader && !n.eliteFour);
  const n = Math.min(gymNodes.length, gyms.length);
  const usableGyms = gyms.slice(0, n);
  const usableNodes = gymNodes.slice(0, n);
  const assignment = optimalTypeAssignment(usableGyms.map(g=>g.type), usableNodes.map(node=>node.typeTable));

  const teams = {};
  gymNodes.forEach(node=>{ node.gymLeader = null; });
  assignment.forEach((townIdx, gymIdx)=>{
    const gym = usableGyms[gymIdx];
    const node = usableNodes[townIdx];
    const label = gym.leaderName;
    node.gymLeader = label;
    teams[label] = gym;
  });
  return teams;
}
