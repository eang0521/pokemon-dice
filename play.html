<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pok&eacute;mon Adventure -- Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --paper-deep:#E2D9C4;
    --ink:#1F2E3D;
    --redwood:#2F4538;
    --rust:#C4572E;
    --gold:#D9A441;
    --sage:#8AA399;
    --nogym-green:#5B8A4E;
    --line: rgba(31,46,61,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(196,87,46,0.07), transparent 40%),
      radial-gradient(circle at 85% 82%, rgba(47,69,56,0.08), transparent 45%),
      repeating-linear-gradient(0deg, transparent, transparent 38px, var(--line) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, var(--line) 39px);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 14px 80px;
  }
  .sheet{ width:100%; max-width: 720px; }
  .masthead{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 4px 14px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 16px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 22px;
    color: var(--redwood);
  }
  .nav-link{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    color: var(--ink);
    text-decoration:none;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 6px 10px;
    background: var(--paper-deep);
  }
  .nav-link:hover{ background: var(--gold); }
  .status-strip{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .status-badges{
    background: var(--gold);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
    cursor:pointer;
  }
  .status-badges:hover{ background:#c4923a; }
  .badge-panel{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 12px;
    margin: -6px 0 16px;
  }
  .badge-panel-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge-box{
    width: 46px;
    height: 46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    border: 1.5px solid var(--ink);
    border-radius: 5px;
    letter-spacing:0.02em;
  }
  .status-turns{
    background: var(--sage);
    color: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
  }
  .reset-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--ink);
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 5px 9px;
    cursor:pointer;
  }
  .status-slot{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .save-slot-card{
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .save-slot-card.save-slot-empty{ border-style:dashed; opacity:0.75; }
  .save-slot-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .save-slot-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--sage);
    margin-bottom: 8px;
  }
  .reset-btn:hover{ background:#e8bdb0; }
  .card{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    margin-bottom: 10px;
  }
  .opp-card-wrap{ position:relative; padding-right:120px; }
  .card-flavor{ font-size:13px; font-style:italic; color:#3c4f45; margin-bottom:10px; }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight:600;
    padding: 10px 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    cursor:pointer;
  }
  .btn:hover{ background: var(--gold); }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--gold); }
  .btn-primary:hover{ background:#c4923a; }
  .btn-wild{ background: var(--nogym-green); color:var(--paper); }
  .btn-wild:hover{ background:#4a7440; }
  .btn-danger{ background: var(--rust); color:var(--paper); }
  .btn-danger:hover{ background:#a8451f; }
  .choice-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .type-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 10px;
    margin-right:4px;
  }
  .stat-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin: 8px 0;
  }
  .stat-chip{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
  }
  .stat-chip b{ color: var(--redwood); }
  .starter-grid{ display:grid; grid-template-columns: 1fr; gap:10px; }
  @media (min-width:560px){ .starter-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .starter-card{
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 12px;
    cursor:pointer;
    text-align:center;
  }
  .starter-card.selected{ border-color: var(--rust); background: #f3d9ce; }
  .starter-card h3{ font-family:'Fraunces', serif; margin: 6px 0 4px; }
  .town-grid{ display:flex; flex-wrap:wrap; gap:6px; max-height:220px; overflow-y:auto; margin-top:6px; padding:2px; }
  .town-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    cursor:pointer;
  }
  .town-btn.selected{ background: var(--gold); }
  .mon-detail-card{
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 10px 120px 10px 12px;
    margin-top: 10px;
    position: relative;
  }
  .mon-detail-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .sprite-lg{
    position:absolute;
    top:10px; right:12px;
    width:96px; height:96px;
    object-fit:contain;
    image-rendering:pixelated;
    transform: translateY(-20%); /* pokemondb icons sit low in their own box -- nudge up */
  }
  .trainer-type-block{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .trainer-type-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .trainer-mon-types{ display:flex; gap:5px; }
  .trainer-atk-paren{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .trainer-type-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight:600;
    color:#fff;
    padding: 3px 9px;
    border-radius: 12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .trainer-atk-pill{ box-shadow: 0 0 0 2px var(--gold); }
  .battle-type-pills{ display:flex; justify-content:center; gap:4px; margin-top:4px; }
  .battle-eff-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--redwood);
    text-align:center;
    margin-top:3px;
  }
  .sprite-battle{ width:108px; height:108px; object-fit:contain; image-rendering:pixelated; transform: translateY(-20%); }
  .opp-team-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0 12px; }
  .opp-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .opp-chip.current{ background: var(--gold); font-weight:700; }
  .opp-chip.defeated{ opacity:0.45; text-decoration: line-through; }
  .log-box{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    max-height: 220px;
    overflow-y:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin-top: 10px;
  }
  .log-line{ padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log-line:last-child{ border-bottom:none; }
  .empty-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--sage);
    text-align:center;
    padding: 12px 0;
  }
  .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    display:block;
    margin: 10px 0 4px;
  }
  .dice-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin: 14px 0 4px;
  }
  .dice-group{ display:flex; gap:8px; }
  .dice-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--sage);
    text-align:center;
    margin-bottom:6px;
  }
  .dice-side{ display:flex; flex-direction:column; align-items:center; }
  .die{
    min-width:44px; height:44px;
    padding: 0 5px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight:600;
    font-variant-numeric: tabular-nums;
  }
  .die.rolling{ animation: dieTumble .09s linear infinite; }
  .die.die-kept{
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
  }
  @keyframes dieTumble{
    0%{ transform: rotate(0deg) scale(1); }
    50%{ transform: rotate(8deg) scale(1.05); }
    100%{ transform: rotate(-6deg) scale(1); }
  }
  .vs-label{
    font-family:'Fraunces', serif;
    font-size:18px;
    color: var(--redwood);
    align-self:center;
    margin-top: 18px;
  }
  .map-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-swatch{ display:inline-block; width:11px; height:11px; }
  .legend-town{ background: var(--gold); border: 1.5px solid var(--ink); }
  .legend-town-nogym{ background: var(--nogym-green); border: 1.5px solid var(--ink); }
  .legend-dungeon{
    width:0; height:0;
    background: transparent;
    border-left: 5.5px solid transparent;
    border-right: 5.5px solid transparent;
    border-bottom: 10px solid var(--rust);
  }
  .legend-route{ background: var(--sage); border: 1.5px solid var(--ink); border-radius:50%; }
  .map-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    -webkit-overflow-scrolling: touch;
  }
  #mapSvg{ display:block; }
  .map-node{ cursor:pointer; }
  .map-node-shape{
    stroke: var(--ink);
    stroke-width: 1.5;
    transition: stroke-width .12s ease, filter .12s ease;
  }
  .map-node:hover .map-node-shape{ stroke-width: 2.5; }
  .map-node.player-here .map-node-shape{
    stroke: var(--rust);
    stroke-width: 3.5;
    filter: drop-shadow(0 0 4px var(--rust));
  }
  .map-node.can-move .map-node-shape{
    stroke: var(--gold);
    stroke-width: 3;
    filter: drop-shadow(0 0 5px var(--gold));
  }
  .map-node.can-move{ cursor:pointer; }
  .map-node.selected .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  /* Static (non-interactive) map preview -- used by the Custom Region generator,
     which has no player position or click behavior to wire up yet. */
  .map-node-static .map-node-shape{ stroke: var(--ink); stroke-width: 1.5; }
  .map-node-central .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  .map-node-label{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    pointer-events:none;
    fill: var(--ink);
  }
  .map-node-label-light{ fill: var(--paper); }
  .map-node-divider{
    stroke: var(--ink);
    stroke-width: 1.5;
    pointer-events:none;
  }
  .map-edge{
    stroke: var(--ink);
    stroke-width: 1.5;
    opacity: 0.35;
  }
  .map-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--redwood);
    margin-top: 8px;
    min-height: 16px;
  }
  .map-info{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1.5px dashed var(--ink);
    min-height: 50px;
  }
  .map-info-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--sage);
    text-align:center;
  }
  .map-info-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 18px;
    margin-bottom:4px;
  }
  .map-info-kind{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-bottom: 8px;
  }
  .map-info-desc{
    font-size: 13px;
    line-height:1.5;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-info-evo{
    font-size: 12.5px;
    line-height:1.5;
    color: var(--ink);
    background: rgba(201, 162, 39, 0.16);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 10px;
  }
  .map-go-btn{
    padding: 9px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    background: var(--rust);
    color: var(--paper);
    border:none;
    border-radius: 4px;
    cursor:pointer;
    margin-bottom: 10px;
  }
  .map-go-btn:hover{ background:#a9481f; }
  .map-encounter-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-top: 10px;
    margin-bottom: 7px;
  }
  .map-encounter-list{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .map-encounter-row{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 8px;
  }
  .map-encounter-sum{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size: 11px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 3px;
    width: 18px;
    height: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .map-encounter-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 13px;
    flex: 1;
  }
  .map-encounter-types{ display:flex; gap:4px; }
  .sprite-sm{ width:36px; height:36px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; transform: translateY(-20%); }
  .tab-row{ display:flex; gap:6px; margin-bottom:16px; }
  .tab-btn{
    flex:1; min-width:0; padding:9px 4px;
    font-family:'Fraunces', serif; font-weight:600; font-size:14px; line-height:1.15;
    text-align:center; background:var(--paper); color:var(--ink);
    border:1.5px solid var(--ink); border-radius:4px; cursor:pointer;
  }
  @media (max-width:560px){ .tab-btn{ font-size:11.5px; padding:8px 2px; } }
  .tab-btn.active{ background:var(--redwood); color:var(--paper); border-color:var(--redwood); }
  /* Elite Four / Champion roster preview -- more tabs than fit at flex:1, so these
     keep their natural width and the row scrolls horizontally instead of squeezing. */
  .tab-row-scroll{ display:flex; gap:6px; margin:8px 0; overflow-x:auto; }
  .tab-row-scroll .tab-btn{ flex:0 0 auto; padding:8px 12px; }
  /* TM attack-type picker -- a little 5-slice strip of the wheel centered on the
     Pokemon's current attack type, plus its own type(s) as a separate shortcut row. */
  .tm-wheel-row{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; margin:10px 0; }
  .tm-type-btn, .tm-wheel-current{
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:#fff;
    text-transform:uppercase; letter-spacing:0.03em; border-radius:6px;
    padding:10px 13px; text-align:center; text-shadow:0 1px 1px rgba(0,0,0,0.25);
  }
  .tm-type-btn{ border:none; cursor:pointer; }
  .tm-type-btn:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .tm-wheel-current{ opacity:0.55; }
  .tm-wheel-current-label{ font-size:8px; letter-spacing:0.05em; margin-top:1px; font-weight:500; }
  .tm-wheel-link{ color:var(--sage); font-size:15px; }
  .tm-truetype-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .field{ margin-bottom:14px; }
  .dex-search{
    width:100%; font-family:'Work Sans', sans-serif; font-size:15px;
    padding:10px 12px; background:var(--paper); border:1.5px solid var(--ink);
    border-radius:2px; color:var(--ink);
  }
  .dex-count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--sage); margin:10px 0 4px; }
  .dex-evo-line{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink); line-height:1.5; }
  .dex-evo-line b{ color:var(--rust); }
  .dex-loc-line{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--redwood);
    line-height:1.5; margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
  }
  .dex-loc-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--rust);
    background:none; border:none; padding:0; text-decoration:underline; cursor:pointer;
  }
  .dex-loc-btn:hover{ color:var(--redwood); }
  .dex-no-results{ text-align:center; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--sage); padding:20px 0; }
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <span class="brand" id="brandLabel">Pok&eacute;mon Adventure</span>
    <a class="nav-link" href="index.html">&larr; Field Guide</a>
  </div>
  <div class="status-strip" id="statusStrip"></div>
  <div class="badge-panel" id="badgePanel" style="display:none;"></div>
  <div id="app"></div>
  <div class="tab-row" id="gameTabRow" style="display:none;">
    <button type="button" class="tab-btn active" id="tabMapBtn" data-tab="map">Map</button>
    <button type="button" class="tab-btn" id="tabMyPokemonBtn" data-tab="mypokemon">My Pokemon</button>

// Cycles a die square through the Pokemon's own possible stat values (its face is
// literally which stat got picked), then settles on finalFace -- the actual rolled
// result, not a cosmetic one.
async function tumble(el, durationMs, possibleValues, finalFace){
  if(!el) return;
  el.classList.add('rolling');
  const steps = Math.max(1, Math.round(durationMs/85));
  for(let i=0;i<steps-1;i++){
    el.textContent = possibleValues[Math.floor(Math.random()*possibleValues.length)];
    await sleep(85);
  }
  el.textContent = finalFace;
  el.classList.remove('rolling');
  await sleep(85);

function wheelShift(sum){
  if(sum===2) return -2;
  if(sum===3||sum===4) return -1;
  if(sum>=5 && sum<=9) return 0;
  if(sum===10||sum===11) return 1;
  if(sum===12) return 2;
  return 0;
}

  const baseType = types[Math.floor(Math.random()*types.length)];
  const shift = wheelShift(rand(6) + rand(6));
  const baseIdx = WHEEL.indexOf(baseType);
  const finalIdx = ((baseIdx + shift) % WHEEL.length + WHEEL.length) % WHEEL.length;
  return cap(WHEEL[finalIdx]);
}
function pickHighestIndex(stats){
  const max = Math.max(...stats);
  const candidates = [];
  stats.forEach((v,i)=>{ if(v===max) candidates.push(i); });
  return candidates[Math.floor(Math.random()*candidates.length)];
}
function distributeLevelBonus(stats, level){
  const idx = [0,1,2,3,4,5];
  for(let i=idx.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]] = [idx[j],idx[i]];
  }
  idx.sort((a,b) => stats[b]-stats[a]);
  const bonus = [0,0,0,0,0,0];
  const fullCycles = Math.floor(level/6);
  const remainder = level%6;
  for(let k=0;k<6;k++){ bonus[idx[k]] = fullCycles; }
  for(let k=0;k<remainder;k++){ bonus[idx[k]] += 1; }
  return bonus;
}

function pickStageForLevel(rootEntry, level){
  const root = Array.isArray(rootEntry) ? rootEntry[0] : rootEntry;
  const forcedBranch = Array.isArray(rootEntry) ? rootEntry[1] : null;
  const chain = DATA.trainerChain[root] || [root];
  let chosen = chain[0];
  for(const stage of chain){
    if(Array.isArray(stage)){
      const eligible = stage.filter(sp => {
        const lvl = DATA.trainerMinLevel[sp];
        return lvl !== undefined && lvl <= level;
      });
      if(eligible.length){
        chosen = (forcedBranch && eligible.includes(forcedBranch))
          ? forcedBranch
          : eligible[Math.floor(Math.random() * eligible.length)];
      }
      continue;
    }
    const lvl = DATA.trainerMinLevel[stage];
    if(lvl !== undefined && lvl <= level){
      chosen = stage;
    }
  }
  return chosen;
}

  const baseType = (slotKey === '2') ? (secondary || primary) : primary;
  const idx = WHEEL.indexOf(baseType);

  if(slotKey === '3') shift = 1;

function effectiveness(atkType, defType1, defType2){
  const row = TYPE_CHART[atkType] || {};

function diceConfig(mult){
  if(mult >= 4) return {n:3, mode:'best', label:'4× doubly super effective'};
  if(mult === 2) return {n:2, mode:'best', label:'2× super effective'};
  if(mult === 1) return {n:1, mode:'single', label:'1× normal'};
  if(mult === 0.5) return {n:2, mode:'worst', label:'0.5× not very effective'};
  if(mult === 0.25) return {n:3, mode:'worst', label:'0.25× doubly resisted'};
  return {n:3, mode:'worst', label:'0× immune'};
}
// One die per cfg.n: its displayed face is the value of whichever of the 6 stats
// (including EVs) got picked, PLUS this side's STAB bonus baked in on every die (not
// just the kept one) -- since STAB is a flat +1 either way, showing it pre-added lets
// the two sides' dice be compared face-to-face to see who's ahead, no mental math
// needed. The kept die (best-or-worst per cfg.mode) is flagged by index for the UI.
function rollSide(finalStats, cfg, stabBonus){
  const picks = [];
  let kept = null, keptIdx = 0;
  for(let i=0;i<cfg.n;i++){
    const idx = Math.floor(Math.random()*6);
    const val = finalStats[idx];
    picks.push(val + stabBonus);
    if(kept===null || (cfg.mode==='worst' ? val<kept : val>kept)){
      kept = val;
      keptIdx = i;
    }
  }
  return { picks, keptIdx, kept, final: kept + stabBonus };
}

// Exact result distribution for one side: Map<finalValue, probability> --
// full enumeration (6^n outcomes for n dice), not sampling.
function resultDistribution(finalStats, cfg, stabBonus){
  const n = cfg.n;
  const counts = new Map();
  const total = Math.pow(6, n);
  function rec(depth, kept){
    if(depth === n){
      const v = kept + stabBonus;
      counts.set(v, (counts.get(v)||0) + 1);
      return;
    }
    for(let i=0;i<6;i++){
      const val = finalStats[i];
      const nextKept = (kept === null) ? val
        : (cfg.mode === 'worst' ? Math.min(kept, val) : Math.max(kept, val));
      rec(depth+1, nextKept);
    }
  }
  rec(0, null);
  const dist = new Map();
  for(const [v,c] of counts) dist.set(v, c/total);
  return dist;
}
// Ties reroll rather than counting as a draw -- since every reroll repeats
// the same two distributions, the post-reroll odds are just the one-shot
// win probabilities renormalized by 1/(1-P(tie)). A "perpetual tie" (every
// pairing ties) can never resolve -- flagged via `unbreakable`.
function crossOdds(distA, distB){
  let winA=0, winB=0, tie=0;
  for(const [a,pa] of distA){
    for(const [b,pb] of distB){
      const p = pa*pb;
      if(a>b) winA += p;
      else if(b>a) winB += p;
      else tie += p;
    }
  }
  const decided = winA + winB;
  if(decided <= 1e-12) return {winA:0, winB:0, unbreakable:true};
  return {winA: winA/decided, winB: winB/decided, unbreakable:false};
}
// Exact post-reroll odds that A beats B in one exchange (§14) -- same STAB
// and attacker-vs-opponent-types wiring as resolveBattle, just computing the
// full distribution instead of rolling once.
function winOdds(statsA, typesA, atkA, statsB, typesB, atkB){
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? 1 : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? 1 : 0;
  return crossOdds(resultDistribution(statsA, cfgA, stabA), resultDistribution(statsB, cfgB, stabB));
}

function neighborsOf(nodeId){
  const out = [];
  DATA.mapEdges.forEach(([a,b])=>{
    if(a===nodeId) out.push(b);
    else if(b===nodeId) out.push(a);
  });
  return out;
}
// Every node reachable within 1..maxDist steps of startId, shortest-path distance,
// as a Map<nodeId, distance> -- startId itself is never included, since a move
// always has to go somewhere (no staying put and "using" the roll on nothing).
function reachableWithin(startId, maxDist){
  const dist = new Map();
  let frontier = [startId];
  dist.set(startId, 0);
  for(let d=1; d<=maxDist; d++){
    const next = [];
    frontier.forEach(id=>{
      neighborsOf(id).forEach(nid=>{
        if(!dist.has(nid)){ dist.set(nid, d); next.push(nid); }
      });
    });
    frontier = next;
    if(!frontier.length) break;
  }
  dist.delete(startId);
  return dist;
}

function evolveOptionsForTown(node){
  const townId = node.kind === 'combo' ? node.townId : node.id;

  if(!items.length) return [];
  const options = [];

    if(!info || !info.evolvesInto) return;
    info.evolvesInto.forEach(e=>{

      if(item) options.push({ monId: m.id, monName: m.name, targetSpecies: e.species, item });

  const townId = node.kind === 'combo' ? node.townId : node.id;
  const items = (DATA.evoItems && DATA.evoItems[townId]) || [];
  if(!items.length) return '';
  return '<div class="map-info-evo">Evolution item' + (items.length>1?'s':'') + ' here: <b>' + items.join(', ') + '</b></div>';
}
function buildEncounterPreviewHtml(locationId){
  const loc = DATA.locations.find(l => l.id === locationId);
  if(!loc) return '';
  const rows = loc.table.map((species, i)=>{
    const sum = i + 2;
    const types = (DATA.types[species] || ['Normal', null]).filter(Boolean);
    return '<div class="map-encounter-row">' +
      '<span class="map-encounter-sum">' + sum + '</span>' +
      spriteImgHtml(species, 'sprite-sm') +
      '<span class="map-encounter-name">' + species + '</span>' +
      '<span class="map-encounter-types">' + types.map(t=>typePillHtml(t)).join('') + '</span>' +
    '</div>';
  }).join('');
  return '<div class="map-encounter-title">Encounter table (2d6 sum)</div>' +
    '<div class="map-encounter-list">' + rows + '</div>';
}

/* ============ Data tab (Pokedex-style lookup, formatted like the Field Guide's
   Pokemon Data page: type, base stats, evolution info, and where to find it) ============ */
// A location's own id (e.g. "Route 114") isn't a map-node id -- routes/dungeons store
// the reverse link as locationId (plain nodes) or dungeonLocationId (combo nodes), and
// a multi-segment route has several nodes sharing one locationId; any one of them works
// as a jump target, so just take the first match.
function mapNodeIdForLocation(locationId){
  const node = DATA.mapNodes.find(n => n.locationId === locationId || n.dungeonLocationId === locationId);
  return node ? node.id : null;
}
function buildDataLocationIndex(){
  const idx = {};
  DATA.locations.forEach(loc=>{
    loc.table.forEach((species, i)=>{
      if(!species) return;
      (idx[species] = idx[species] || []).push({ id: loc.id, name: loc.name, sum: i + 2 });
    });
  });
  return idx;
}
// Mirrors index.html's evoItemLocationNote(): scans every town's placed items for one
// that's a substring of this evolution branch's method text, and names that town.
function evoItemLocationNote(method){
  if(!DATA.evoItems) return '';
  for(const townId in DATA.evoItems){
    const hit = (DATA.evoItems[townId] || []).find(it => method.indexOf(it) !== -1);
    if(hit){
      const node = nodesById[townId];
      return ' -- find it in ' + (node ? nodeDisplayName(node) : townId);
    }
  }
  return '';
}
function dataEntryHtml(species){
  const types = (DATA.types[species] || ['Normal', null]).filter(Boolean);
  const dice = DATA.dice[species] || [0,0,0,0,0,0];
  const info = DATA.evoInfo[species] || {};
  const evolvesInto = info.evolvesInto || [];

  let evoHtml = '';
  if(info.evolvesFrom) evoHtml += '<div class="dex-evo-line">Evolves from <b>'+info.evolvesFrom+'</b></div>';
  evolvesInto.forEach(e=>{
    evoHtml += '<div class="dex-evo-line">Evolves into <b>'+e.species+'</b> ('+e.method+')'+evoItemLocationNote(e.method)+'</div>';
  });
  if(!info.evolvesFrom && !evolvesInto.length) evoHtml = '<div class="dex-evo-line">Does not evolve</div>';

  const locs = dataLocationIndex[species];
  let locHtml;
  if(locs && locs.length){
    locHtml = locs.map(l => {
      const nodeId = mapNodeIdForLocation(l.id);
      return nodeId
        ? '<button type="button" class="dex-loc-btn" data-action="jumpToMapLocation" data-node="'+nodeId+'">'+l.name+' ('+l.sum+')</button>'
        : (l.name + ' (' + l.sum + ')');
    }).join(', ');
  } else if(info.evolvesFrom){
    locHtml = 'Evolve from <b>'+info.evolvesFrom+'</b> -- not a direct wild encounter';
  } else {
    locHtml = 'Starter or special -- not found in the wild';
  }

  return '<div class="mon-detail-card dex-entry" data-name="'+species.toLowerCase()+'">' +
    spriteImgHtml(species, 'sprite-lg') +
    '<div class="mon-detail-name">'+species+'</div>' +
    '<div class="trainer-type-block"><span class="trainer-type-label">Type</span>' +
      '<span class="trainer-mon-types">'+types.map(t=>trainerStylePill(t)).join('')+'</span></div>' +
    statRowHtml(dice) +
    evoHtml +
    '<div class="dex-loc-line">Found: '+locHtml+'</div>' +
  '</div>';
}
function buildDataTab(){
  dataBuilt = true;
  dataLocationIndex = buildDataLocationIndex();
  const names = Object.keys(DATA.dice).sort((a,b)=>a.localeCompare(b));
  document.getElementById('dataList').innerHTML = names.map(dataEntryHtml).join('');
  document.getElementById('dataCount').textContent = names.length + ' Pokémon';
  filterDataTab(); // re-apply any search text already typed before this lazy build ran
}
function filterDataTab(){
  const q = document.getElementById('dataSearch').value.trim().toLowerCase();
  const entries = document.querySelectorAll('#dataList .dex-entry');
  let shown = 0;
  entries.forEach(el=>{
    const match = el.dataset.name.includes(q);
    el.style.display = match ? '' : 'none';
    if(match) shown++;
  });
  const listEl = document.getElementById('dataList');
  let noResults = listEl.querySelector('.dex-no-results');
  if(shown === 0 && entries.length){
    if(!noResults){
      noResults = document.createElement('div');
      noResults.className = 'dex-no-results';
      noResults.textContent = 'No Pokémon match that search.';
      listEl.appendChild(noResults);
    }
  } else if(noResults){
    noResults.remove();
  }
}
function renderDataTab(){
  const dataCard = document.getElementById('dataCard');
  if(!DATA || !gameState){ dataCard.style.display = 'none'; return; }
  dataCard.style.display = (activeGameTab === 'data') ? '' : 'none';
  if(activeGameTab === 'data' && !dataBuilt) buildDataTab();
}
function showGameTab(which){
  activeGameTab = which;
  document.getElementById('tabMapBtn').classList.toggle('active', which === 'map');
  document.getElementById('tabMyPokemonBtn').classList.toggle('active', which === 'mypokemon');
  document.getElementById('tabDataBtn').classList.toggle('active', which === 'data');
  renderGameMap();
  renderMyPokemonSection();
  renderDataTab();
}

// The "Move here" affordance for whichever node is currently selected in the
// sidebar -- only offered while actively rolling movement, and only for a node
// this roll can actually reach (never the player's own current tile, per the
// must-move rule).
function moveHereHtml(node){
  if(view !== 'moving' || !movement) return '';
  if(node.id === gameState.currentNodeId){
    return '<div class="map-info-desc" style="opacity:0.65;">You are here -- you must move somewhere else this turn.</div>';
  }
  const reachable = reachableWithin(gameState.currentNodeId, movement.total);
  if(!reachable.has(node.id)){
    return '<div class="map-info-desc" style="opacity:0.65;">Not reachable with this roll.</div>';
  }
  const spacesUsed = reachable.get(node.id);
  const forfeited = movement.total - spacesUsed;
  return '<button type="button" class="map-go-btn" data-action="moveToNode" data-node="'+node.id+'">Move Here (uses '+spacesUsed+
    (forfeited ? ', forfeits '+forfeited : '') + ')</button>';
}
// The gym leader's current roster at the player's present badge count -- same
// slot-unlock/level logic actually used to fight them (rollGymTeam), shown as
// a preview so the player can see what they'd be facing before committing.
function gymTeamPreviewHtml(leaderName){
  if(!leaderName || !DATA.gymLeaders[leaderName]) return '';
  const { team } = rollGymTeam(leaderName);
  if(!team.length) return '';
  const badges = gameState.defeatedGymLeaders.length;
  const cards = team.map(o=>
    '<div class="mon-detail-card">' +
      '<div class="mon-detail-name">' + o.species + ' Lv ' + o.level + '</div>' +
      trainerTypeBlockHtml(o.types[0], o.types[1], o.atk) +
      statRowHtml(o.statsArr) +
    '</div>'
  ).join('');
  return '<div class="map-encounter-title">Current team (' + badges + ' badge' + (badges===1?'':'s') + ')</div>' +
    cards;
}
// Elite Four + Champion roster preview for the E4 town, shown when that node
// is selected on the map -- same idea as gymTeamPreviewHtml() above, but with
// one tab per member (there are too many combined rosters to list at once).
function eliteFourTeamPreviewHtml(node){
  if(!node || !DATA.eliteFourTownId || node.id !== DATA.eliteFourTownId) return '';
  const members = eliteFourMembers();
  if(!members.length) return '';
  if(eliteFourPreviewTabIdx >= members.length) eliteFourPreviewTabIdx = 0;
  const tabsHtml = members.map((m, i)=>
    '<button type="button" class="tab-btn' + (i===eliteFourPreviewTabIdx?' active':'') + '" data-action="selectEliteFourPreviewTab" data-idx="' + i + '">' +
      eliteFourMemberLabelForIndex(i) +
    '</button>'
  ).join('');
  const team = rollEliteFourMemberTeam(members[eliteFourPreviewTabIdx]);
  const cards = team.map(o=>
    '<div class="mon-detail-card">' +
      '<div class="mon-detail-name">' + o.species + ' Lv ' + o.level + '</div>' +
      trainerTypeBlockHtml(o.types[0], o.types[1], o.atk) +
      statRowHtml(o.statsArr) +
    '</div>'
  ).join('');
  return '<div class="map-encounter-title">Elite Four &amp; Champion Rosters</div>' +
    '<div class="tab-row-scroll">' + tabsHtml + '</div>' +
    cards;
}
function renderMapSidebar(){
  const infoEl = document.getElementById('mapInfo');
  const n = selectedMapNodeId ? nodesById[selectedMapNodeId] : null;
  if(!n){ infoEl.innerHTML = '<div class="map-info-empty">Click a node to see what\'s there.</div>'; return; }

  if(n.kind === 'combo'){
    const beaten = n.gymLeader && gameState.defeatedGymLeaders.includes(n.gymLeader);
    const gymLine = n.gymLeader ? ('Home of Gym Leader ' + n.gymLeader + (beaten ? ' (already beaten)' : '') + '.') : 'No gym here.';
    infoEl.innerHTML =
      '<div class="map-info-name">' + n.townName + ' / ' + n.dungeonName + '</div>' +
      '<div class="map-info-kind">Town + Dungeon (same spot)</div>' +
      '<div class="map-info-desc">' + gymLine + ' ' + n.dungeonName + ' sits in the same location.</div>' +
      evoItemsLineHtml(n) +
      moveHereHtml(n) +
      gymTeamPreviewHtml(n.gymLeader) +
      eliteFourTeamPreviewHtml(n) +
      buildEncounterPreviewHtml(n.dungeonLocationId);
    return;
  }

  let extra = '';
  let encounterHtml = '';
  if(n.kind === 'town'){
    const beaten = n.gymLeader && gameState.defeatedGymLeaders.includes(n.gymLeader);
    extra = n.gymLeader ? ('Home of Gym Leader ' + n.gymLeader + (beaten ? ' (already beaten)' : '') + '.') : 'No gym here.';
  } else {
    extra = 'Wild encounter location.';
    encounterHtml = buildEncounterPreviewHtml(n.locationId);

    '<div class="map-info-name">' + nodeDisplayName(n) + '</div>' +
    '<div class="map-info-kind">' + nodeKindLabel(n) + '</div>' +
    '<div class="map-info-desc">' + extra + '</div>' +
    (n.kind === 'town' ? evoItemsLineHtml(n) : '') +
    moveHereHtml(n) +

function buildGameMap(){
  mapBuilt = true;
  const maxRow = Math.max(...DATA.mapNodes.map(n=>n.row));
  const maxCol = Math.max(...DATA.mapNodes.map(n=>n.col));
  const svg = document.getElementById('mapSvg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 ' + (maxCol*CELL) + ' ' + (maxRow*CELL));
  svg.setAttribute('width', (maxCol*CELL));
  svg.setAttribute('height', (maxRow*CELL));

  DATA.mapEdges.forEach(([a,b])=>{
    const na = nodesById[a], nb = nodesById[b];
    if(!na || !nb) return;
    const pa = nodeXY(na), pb = nodeXY(nb);
    svg.appendChild(svgEl('line', { class:'map-edge', x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y }));
  });

  DATA.mapNodes.forEach(n=>{
    const p = nodeXY(n);
    const g = svgEl('g', {class:'map-node', 'data-id': n.id});

    if(n.kind === 'town'){
      const s = 11;
      const townFill = n.gymLeader ? 'var(--gold)' : 'var(--nogym-green)';
      g.appendChild(svgEl('rect', { class:'map-node-shape', x:p.x-s, y:p.y-s, width:s*2, height:s*2, fill:townFill }));
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y+3, 'text-anchor':'middle', 'font-size':8})).textContent = n.id;
    } else if(n.kind === 'dungeon'){
      const s = 11;
      const points = [ [p.x, p.y-s], [p.x-s, p.y+s*0.8], [p.x+s, p.y+s*0.8] ].map(pt=>pt.join(',')).join(' ');
      g.appendChild(svgEl('polygon', { class:'map-node-shape', points, fill:'var(--rust)' }));
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y+21, 'text-anchor':'middle', 'font-size':6.5})).textContent = n.id;
    } else if(n.kind === 'combo'){
      const w = 12, hTop = 10, hBottom = 12;
      const topFill = n.gymLeader ? 'var(--gold)' : 'var(--nogym-green)';
      const topPts = [ [p.x-w,p.y-hTop], [p.x+w,p.y-hTop], [p.x+w,p.y], [p.x-w,p.y] ].map(pt=>pt.join(',')).join(' ');
      const bottomPts = [ [p.x-w,p.y], [p.x+w,p.y], [p.x,p.y+hBottom] ].map(pt=>pt.join(',')).join(' ');
      g.appendChild(svgEl('polygon', {class:'map-node-shape', points: topPts, fill:topFill}));
      g.appendChild(svgEl('polygon', {class:'map-node-shape', points: bottomPts, fill:'var(--rust)'}));
      g.appendChild(svgEl('line', {class:'map-node-divider', x1:p.x-w, y1:p.y, x2:p.x+w, y2:p.y}));
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y-3, 'text-anchor':'middle', 'font-size':7})).textContent = n.townId;
      g.appendChild(svgEl('text', {class:'map-node-label map-node-label-light', x:p.x, y:p.y+9, 'text-anchor':'middle', 'font-size':6})).textContent = n.dungeonId;
    } else {
      const r = 11;
      g.appendChild(svgEl('circle', {class:'map-node-shape', cx:p.x, cy:p.y, r, fill:'var(--sage)'}));
      const fontSize = n.id.length >= 3 ? 6.5 : 7.5;
      g.appendChild(svgEl('text', {class:'map-node-label', x:p.x, y:p.y+2.5, 'text-anchor':'middle', 'font-size':fontSize})).textContent = n.id;
    }

    g.addEventListener('click', ()=> selectMapNode(n.id));
    svg.appendChild(g);
  });
}
/* ============ Custom Region Generator (docs/region-generator-rules.md) ============
   Still being built: produces a map layout only -- no dex/gyms/encounters wired
   up yet. Runs entirely independently of DATA/gameState/save slots; the result
   lives only in `customRegion` and is never persisted. */
const REGION_GEN_DIRS = { N:{dx:0,dy:-1}, S:{dx:0,dy:1}, E:{dx:1,dy:0}, W:{dx:-1,dy:0} };
const REGION_GEN_OPPOSITE = { N:'S', S:'N', E:'W', W:'E' };
const REGION_GEN_ALL_DIRS = ['N','S','E','W'];
function regionGenTripleLetter(i){ const c = String.fromCharCode(65+i); return c+c+c; }
function regionGenDoubleLetter(i){ const c = String.fromCharCode(65+i); return c+c; }
function regionGenKey(x,y){ return x+','+y; }

function generateCustomRegionOnce(){
  const grid = new Map();
  const edgeSet = new Set();
  const edges = [];
  let townCount = 0, dungeonCount = 0, routeGroupCounter = 0;
  let minX=0,maxX=0,minY=0,maxY=0;

  function addEdge(k1,k2){
    if(k1 === k2) return;
    const norm = k1 < k2 ? k1+'|'+k2 : k2+'|'+k1;
    if(edgeSet.has(norm)) return;
    edgeSet.add(norm);
    edges.push([k1,k2]);
  }
  function boxAreaWith(x,y){
    const nMinX = Math.min(minX,x), nMaxX = Math.max(maxX,x);
    const nMinY = Math.min(minY,y), nMaxY = Math.max(maxY,y);
    return (nMaxX-nMinX+1) * (nMaxY-nMinY+1);
  }
  function wouldExceedCap(x,y){ return boxAreaWith(x,y) > 160; }
  function expandBoxTo(x,y){
    minX = Math.min(minX,x); maxX = Math.max(maxX,x);
    minY = Math.min(minY,y); maxY = Math.max(maxY,y);
  }
  function placeTown(x,y){
    const tile = { x, y, kind:'town', townIndex: townCount++, hasDungeon:false };
    grid.set(regionGenKey(x,y), tile);
    expandBoxTo(x,y);
    return tile;
  }
  function placeDungeon(x,y){
    const tile = { x, y, kind:'dungeon', dungeonIndex: dungeonCount++ };
    grid.set(regionGenKey(x,y), tile);
    expandBoxTo(x,y);
    return tile;
  }
  function placeRoute(x,y,groupId){
    const tile = { x, y, kind:'route', groupId };
    grid.set(regionGenKey(x,y), tile);
    expandBoxTo(x,y);
    return tile;
  }

  const central = placeTown(0,0);
  central.isCentral = true;

  const queue = [];
  for(const d of REGION_GEN_ALL_DIRS) queue.push({ originX:0, originY:0, dir:d });

  function rollLength(){ return [1,1,2,2,3,3][rand(6)-1]; }

  function findNearestOccupied(fromX, fromY, dir){
    const d = REGION_GEN_DIRS[dir];
    let x = fromX + d.dx, y = fromY + d.dy, gap = 0;
    while(x >= minX && x <= maxX && y >= minY && y <= maxY){
      if(grid.has(regionGenKey(x,y))) return { x, y, gap };
      x += d.dx; y += d.dy; gap++;
    }
    return null;
  }

  function processRouteJob(job){
    const { originX, originY, dir } = job;
    const d = REGION_GEN_DIRS[dir];
    const steps = rollLength();
    const hasDungeonExtra = rand(6) >= 5;
    const tokens = new Array(steps).fill('route');
    if(hasDungeonExtra){
      const slot = Math.floor(Math.random() * (steps+1));
      tokens.splice(slot, 0, 'dungeon');
    }
    const gid = routeGroupCounter++;
    const placedTiles = [], placedAny = [];
    let lastKeyPlaced = regionGenKey(originX, originY);
    let completedFully = true;
    let cx = originX, cy = originY;

    for(let i=0; i<tokens.length; i++){
      const nx = cx + d.dx, ny = cy + d.dy;
      const nk = regionGenKey(nx,ny);
      if(grid.has(nk)){
        addEdge(lastKeyPlaced, nk);
        completedFully = false; cx = null;
        break;
      }
      if(wouldExceedCap(nx,ny)){
        if(placedAny.length){
          const last = placedAny[placedAny.length-1];
          if(last.kind !== 'dungeon'){
            last.kind = 'dungeon';
            last.dungeonIndex = dungeonCount++;
            const idxInRoute = placedTiles.indexOf(last);
            if(idxInRoute !== -1) placedTiles.splice(idxInRoute, 1);
          }
        }
        completedFully = false; cx = null;
        break;
      }
      let tile;
      if(tokens[i] === 'dungeon') tile = placeDungeon(nx,ny);
      else { tile = placeRoute(nx,ny,gid); placedTiles.push(tile); }
      placedAny.push(tile);
      addEdge(lastKeyPlaced, nk);
      lastKeyPlaced = nk; cx = nx; cy = ny;
    }

    if(!completedFully || cx === null) return;

    const tx = cx + d.dx, ty = cy + d.dy;
    const tk = regionGenKey(tx,ty);
    if(grid.has(tk)){ addEdge(lastKeyPlaced, tk); return; }
    if(wouldExceedCap(tx,ty)){
      if(placedTiles.length){
        const last = placedTiles[placedTiles.length-1];
        if(last.kind !== 'dungeon'){ last.kind = 'dungeon'; last.dungeonIndex = dungeonCount++; }
      }
      return;
    }
    const adjacentTowns = [];
    for(const ad of REGION_GEN_ALL_DIRS){
      const ax = tx + REGION_GEN_DIRS[ad].dx, ay = ty + REGION_GEN_DIRS[ad].dy;
      const ak = regionGenKey(ax,ay);
      if(grid.has(ak) && grid.get(ak).kind === 'town') adjacentTowns.push(ak);
    }
    if(adjacentTowns.length){
      const extra = placeRoute(tx,ty,gid);
      placedTiles.push(extra);
      addEdge(lastKeyPlaced, tk);
      for(const ak of adjacentTowns) addEdge(tk, ak);
      return;
    }
    const newTown = placeTown(tx,ty);
    addEdge(lastKeyPlaced, tk);
    if(rand(6) === 6){ newTown.hasDungeon = true; newTown.dungeonIndex = dungeonCount++; }
    for(const od of REGION_GEN_ALL_DIRS){
      if(od === REGION_GEN_OPPOSITE[dir]) continue;
      if(rand(6) >= 4) queue.push({ originX: tx, originY: ty, dir: od });
    }
  }

  while(queue.length) processRouteJob(queue.shift());

  // Spur pass -- every town, in creation order, checks all 4 directions.
  const townTiles = [...grid.values()].filter(t=>t.kind==='town').sort((a,b)=>a.townIndex-b.townIndex);
  for(const town of townTiles){
    for(const d of REGION_GEN_ALL_DIRS){
      const ax = town.x + REGION_GEN_DIRS[d].dx, ay = town.y + REGION_GEN_DIRS[d].dy;
      const ak = regionGenKey(ax,ay), tk = regionGenKey(town.x, town.y);
      if(grid.has(ak)){ addEdge(tk, ak); continue; }
      const found = findNearestOccupied(town.x, town.y, d);
      if(!found || found.gap > 4) continue;
      const gid = routeGroupCounter++;
      const dungeonSlotIdx = (rand(6) >= 5) ? Math.floor(Math.random()*found.gap) : -1;
      let px = town.x, py = town.y, lastK = tk;
      for(let i=0; i<found.gap; i++){
        px += REGION_GEN_DIRS[d].dx; py += REGION_GEN_DIRS[d].dy;
        const pk = regionGenKey(px,py);
        if(i === dungeonSlotIdx) placeDungeon(px,py);
        else placeRoute(px,py,gid);
        addEdge(lastK, pk);
        lastK = pk;
      }
      addEdge(lastK, regionGenKey(found.x, found.y));
    }
  }

  // Renumber routes via a randomly-cornered sweep.
  const nsPick = rand(2)===1 ? 'N' : 'S';
  const ewPick = rand(2)===1 ? 'E' : 'W';
  const outerAxis = (rand(2)===1) ? 'NS' : 'EW';
  function axisRange(axis, pick){
    const arr = [];
    if(axis === 'NS'){
      if(pick === 'S') for(let y=maxY;y>=minY;y--) arr.push(y);
      else for(let y=minY;y<=maxY;y++) arr.push(y);
    } else {
      if(pick === 'E') for(let x=maxX;x>=minX;x--) arr.push(x);
      else for(let x=minX;x<=maxX;x++) arr.push(x);
    }
    return arr;
  }
  let nextRouteNum = 1;
  const groupInfo = new Map();
  function visit(x,y){
    const t = grid.get(regionGenKey(x,y));
    if(!t || t.kind !== 'route') return;
    let gi = groupInfo.get(t.groupId);
    if(!gi){ gi = { number: nextRouteNum++, tiles: [] }; groupInfo.set(t.groupId, gi); }
    gi.tiles.push(t);
  }
  if(outerAxis === 'NS'){
    for(const y of axisRange('NS', nsPick)) for(const x of axisRange('EW', ewPick)) visit(x,y);
  } else {
    for(const x of axisRange('EW', ewPick)) for(const y of axisRange('NS', nsPick)) visit(x,y);
  }
  for(const gi of groupInfo.values()){
    gi.tiles.forEach((t,idx)=>{
      t.finalId = gi.tiles.length === 1 ? String(gi.number) : (gi.number + 'abcdefghijklmnopqrstuvwxyz'[idx]);
    });
  }

  for(const t of grid.values()){
    if(t.kind === 'town') t.finalId = regionGenTripleLetter(t.townIndex);
    else if(t.kind === 'dungeon') t.finalId = regionGenDoubleLetter(t.dungeonIndex);
  }
  for(const t of townTiles){
    if(t.hasDungeon) t.dungeonFinalId = regionGenDoubleLetter(t.dungeonIndex);
  }

  let totalTowns = 0, totalDungeons = 0;
  for(const t of grid.values()){
    if(t.kind === 'town'){ totalTowns++; if(t.hasDungeon) totalDungeons++; }
    else if(t.kind === 'dungeon') totalDungeons++;
  }
  return { grid, edges, minX, maxX, minY, maxY, totalTowns, totalDungeons, totalRoutes: nextRouteNum-1 };
}

// Elite Four spur: a random town that has 3 clear, in-bounds cells in some
// direction gets, in order going outward, one more route tile (the highest
// route number), a Victory Road dungeon ("VR"), and the Elite Four town
// ("ELI") -- fixed ids, so they never collide with the AA/BB.. or AAA/BBB..
// auto-naming (both require two/three of the SAME letter).
function threeClearCellsInDir(r, x, y, dir){
  const d = REGION_GEN_DIRS[dir];
  for(let step=1; step<=3; step++){
    const nx = x + d.dx*step, ny = y + d.dy*step;
    if(nx < r.minX || nx > r.maxX || ny < r.minY || ny > r.maxY) return false;
    if(r.grid.has(regionGenKey(nx,ny))) return false;
  }
  return true;
}
function findEliteFourPlacement(r){
  const towns = [...r.grid.values()].filter(t=>t.kind==='town');
  const candidates = [];
  for(const t of towns){
    const validDirs = REGION_GEN_ALL_DIRS.filter(d => threeClearCellsInDir(r, t.x, t.y, d));
    if(validDirs.length) candidates.push({ town:t, validDirs });
  }
  if(!candidates.length) return null;
  const chosen = candidates[Math.floor(Math.random()*candidates.length)];
  const dir = chosen.validDirs[Math.floor(Math.random()*chosen.validDirs.length)];
  return { town: chosen.town, dir };
}
function attachEliteFour(r, placement){
  const { town, dir } = placement;
  const d = REGION_GEN_DIRS[dir];
  const routeX = town.x + d.dx, routeY = town.y + d.dy;
  const vrX = town.x + d.dx*2, vrY = town.y + d.dy*2;
  const eliX = town.x + d.dx*3, eliY = town.y + d.dy*3;
  const townKey = regionGenKey(town.x, town.y);
  const routeKey = regionGenKey(routeX, routeY);
  const vrKey = regionGenKey(vrX, vrY);
  const eliKey = regionGenKey(eliX, eliY);

  r.grid.set(routeKey, { x:routeX, y:routeY, kind:'route', finalId: String(r.totalRoutes+1) });
  r.grid.set(vrKey, { x:vrX, y:vrY, kind:'dungeon', finalId:'VR' });
  r.grid.set(eliKey, { x:eliX, y:eliY, kind:'town', finalId:'ELI', hasDungeon:false, isEliteFour:true });

  r.edges.push([townKey, routeKey]);
  r.edges.push([routeKey, vrKey]);
  r.edges.push([vrKey, eliKey]);
  r.totalRoutes += 1;
}

function buildCustomRegionOutput(r){
  const mapNodes = [];
  const idByKey = {};
  for(const [k,t] of r.grid) idByKey[k] = t.finalId;
  for(const [,t] of r.grid){
    const col = t.x - r.minX + 1, row = t.y - r.minY + 1;
    if(t.kind === 'route'){
      mapNodes.push({ id:t.finalId, kind:'route', row, col });
    } else if(t.kind === 'dungeon'){
      mapNodes.push({ id:t.finalId, kind:'dungeon', row, col });
    } else if(t.hasDungeon){
      mapNodes.push({ id:t.finalId, kind:'combo', row, col, townId:t.finalId, townName:t.finalId,
        dungeonId:t.dungeonFinalId, dungeonName:t.dungeonFinalId, gymLeader:null, central: !!t.isCentral });
    } else {
      mapNodes.push({ id:t.finalId, kind:'town', row, col, gymLeader:null, central: !!t.isCentral, eliteFour: !!t.isEliteFour });
    }
  }
  const mapEdges = r.edges.map(([k1,k2]) => [idByKey[k1], idByKey[k2]]);

  // The Elite Four town is never a gym town -- excluded from the pool.
  const townBearing = mapNodes.filter(n=>(n.kind==='town' || n.kind==='combo') && !n.eliteFour);
  for(let i=townBearing.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [townBearing[i], townBearing[j]] = [townBearing[j], townBearing[i]];
  }
  townBearing.slice(0, Math.min(8, townBearing.length)).forEach(n=>{ n.gymLeader = true; });

  return {
    mapNodes, mapEdges,
    maxRow: Math.max(...mapNodes.map(n=>n.row)),
    maxCol: Math.max(...mapNodes.map(n=>n.col)),
    totalTowns: mapNodes.filter(n=>n.kind==='town' || n.kind==='combo').length,
    totalDungeons: mapNodes.filter(n=>n.kind==='dungeon' || n.kind==='combo').length,
    totalRoutes: r.totalRoutes,
  };
}

function generateCustomRegionData(){
  for(let i=0;i<500;i++){
    const r = generateCustomRegionOnce();
    if(r.totalTowns < 10 || r.totalTowns > 16) continue;
    if(r.totalDungeons < 8 || r.totalDungeons > 13) continue;
    const placement = findEliteFourPlacement(r);
    if(!placement) continue;
    attachEliteFour(r, placement);
    return buildCustomRegionOutput(r);
  }
  // Practically unreachable given typical map sizes -- keep the UI functional
  // even if 500 attempts somehow never satisfy every constraint at once.
  const r = generateCustomRegionOnce();
  const placement = findEliteFourPlacement(r);
  if(placement) attachEliteFour(r, placement);
  return buildCustomRegionOutput(r);
}

/* ============ XP & leveling ============ */
function splitXP(total, participantIds){
  const n = participantIds.length;
  if(n===0) return [];
  const base = Math.floor(total/n);
  const remainder = total - base*n;
  return participantIds.map((id,i)=>({ id, xp: base + (i >= n-remainder ? 1 : 0) }));
}
const MAX_LEVEL = 20;
function isMaxLevel(entry){ return entry.ev.reduce((a,b)=>a+b,0) >= MAX_LEVEL; }
// XP always keeps accumulating (even past the cap -- it's just no longer "toward"
// anything); the level-up loop itself stops once level 20 is reached.
function grantXP(entry, xpGain, highIdx){
  let level = entry.ev.reduce((a,b)=>a+b,0);
  entry.xp = (entry.xp || 0) + xpGain;
  while(level < MAX_LEVEL && entry.xp >= level*10 && level>0){
    entry.xp -= level*10;
    entry.ev[highIdx] = (entry.ev[highIdx]||0) + 1;
    level += 1;
  }
}
function statTotal(statsArr){ return statsArr.reduce((a,b)=>a+b,0); }

// Only methods with an explicit "Level N" have a level this can check directly
// (friendship's threshold is relative to catch level, handled separately).
function evoRequiredLevel(method){
  const m = method.match(/Level (\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

// Level-up (and friendship) evolution -- checked right after XP is granted,
// separate from the town-item evolve flow (which only ever handles item/trade
// branches). Triggers automatically, no confirmation, matching mainline: a
// friendship branch's threshold is "level >= level caught at + 4" (SS11 of the
// ruleset); a plain level branch just needs an explicit "Level N" in its
// method text; Piloswine -> Mamoswine (Calli) is a one-off "Rock attack type"
// condition standing in for mainline's "knows Ancient Power" (this game has no
// move-tracking system, so attack type is the closest checkable equivalent) --
// no level floor of its own, just needs a level-up tick while atk is Rock.
// Loops in case evolving lands it on another already-eligible stage. Returns
// an array of "X evolved into Y!" messages for the caller to surface (e.g.
// into the encounter log).
function checkAndApplyLevelEvolution(entry, list){
  const messages = [];
  while(true){
    const info = DATA.evoInfo[entry.name];
    if(!info || !info.evolvesInto || !info.evolvesInto.length) break;
    const level = entry.ev.reduce((a,b)=>a+b,0);
    let target = null;
    for(const branch of info.evolvesInto){
      if(branch.method.indexOf('Friendship') !== -1){
        if(level >= (entry.catchLevel||0) + 4){ target = branch.species; break; }
      } else if(branch.method.indexOf('Rock attack type') !== -1){
        if((entry.atk||'').toLowerCase() === 'rock'){ target = branch.species; break; }
      } else {
        const req = evoRequiredLevel(branch.method);
        if(req !== null && level >= req){ target = branch.species; break; }
      }
    }
    if(!target) break;

    // Nincada -> Ninjask also spawns a Shedinja alongside it (mainline mechanic):
    // a brand-new Pokemon added to the collection, at the same level and EVs as
    // the Nincada that just evolved, with its own random attack type. Nincada
    // itself still just becomes Ninjask -- Shedinja is purely a bonus.
    const shedinjaBranch = info.evolvesInto.find(b => b.species === 'Shedinja');
    if(shedinjaBranch && target !== 'Shedinja' && list){
      const sTypes = DATA.types['Shedinja'] || [null, null];
      list.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
        name: 'Shedinja',
        t1: sTypes[0] || null,
        t2: sTypes[1] || null,
        atk: randomAttackType(sTypes[0], sTypes[1]),
        base: (DATA.dice['Shedinja'] || [0,0,0,0,0,0]).slice(),
        ev: entry.ev.slice(),
        xp: entry.xp || 0,
        catchLevel: entry.catchLevel,
        caughtAt: new Date().toISOString(),
        note: 'Appeared alongside ' + entry.name + '\'s evolution',
      });
      messages.push('A Shedinja appeared!');
    }

    const oldName = entry.name;
    entry.name = target;
    const types = DATA.types[target] || [null, null];
    entry.t1 = types[0] || null;
    entry.t2 = types[1] || null;
    entry.base = (DATA.dice[target] || [0,0,0,0,0,0]).slice();
    messages.push(oldName + ' evolved into ' + target + '!');

    const rolledAtk = randomAttackType(entry.t1, entry.t2);
    if(rolledAtk !== entry.atk && confirm('Change '+entry.name+'\'s attack type from '+entry.atk+' to '+rolledAtk+'?')){
      entry.atk = rolledAtk;
    }
  }
  return messages;
}

// Level-up evolution is checked once the WHOLE encounter is over, not after
// each individual opponent's XP grant -- a Pokemon that levels up against
// opponent 2 of 5 keeps fighting the rest of that battle as its pre-evolution
// self, only evolving once there's no more of the encounter left for the
// change to affect. `recipientIds` is every Pokemon that gained XP anywhere
// during the encounter, tracked as it happens and resolved here at the end.
function resolveDeferredEvolutions(recipientIds){
  if(!recipientIds || !recipientIds.size) return '';
  const list = loadGamePokemon();
  const messages = [];
  recipientIds.forEach(id=>{
    const mon = list.find(x=>x.id===id);
    if(mon) checkAndApplyLevelEvolution(mon, list).forEach(msg => messages.push(msg));
  });
  saveGamePokemonList(list);
  return messages.length ? (' ' + messages.join(' ')) : '';
}

/* ============ Rolling opponents ============ */
function rollOneDieWithThreshold(T){
  let v = rand(6);
  while(v>T){ v = rand(6); }
  return v;
}
function rollTrueTypeAttack(types){
  const typesLower = types.filter(Boolean).map(t=>t.toLowerCase());
  const baseType = typesLower[Math.floor(Math.random()*typesLower.length)];
  const shift = wheelShift(rand(6)+rand(6));
  const baseIdx = WHEEL.indexOf(baseType);
  const finalIdx = ((baseIdx+shift)%WHEEL.length+WHEEL.length)%WHEEL.length;
  return cap(WHEEL[finalIdx]);
}
function buildOpponent(species, level){
  const stats = DATA.dice[species] || [0,0,0,0,0,0];
  const levelBonus = distributeLevelBonus(stats, level);
  const statsArr = stats.map((n,i)=>n+levelBonus[i]);
  const highIdx = pickHighestIndex(statsArr);
  const types = DATA.types[species] || ['Normal', null];
  return { species, level, statsArr, levelBonus, base:stats, types, highIdx };
}
function rollWildEncounter(locationId){
  const loc = DATA.locations.find(l=>l.id===locationId);
  const badges = gameState.defeatedGymLeaders.length;
  const T = thresholdFor(badges);
  const sum = rollOneDieWithThreshold(T) + rollOneDieWithThreshold(T);
  const rolledSpecies = loc.table[sum-2];

  const rawLevel = rand(6);
  const finalLevel = levelMap[rawLevel] + badges;

  let species = rolledSpecies;
  let downgraded = false;
  while(DATA.predecessor[species] && (DATA.minLevel[species]||1) > finalLevel){
    species = DATA.predecessor[species];
    downgraded = true;
  }

  const opp = buildOpponent(species, finalLevel);
  opp.atk = rollTrueTypeAttack(opp.types);
  opp.downgraded = downgraded;
  opp.rolledSpecies = rolledSpecies;
  opp.locationName = loc.name;
  return opp;
}
function rollTrainerTeam(){
  const badges = gameState.defeatedGymLeaders.length;
  const classSum = rand(6)+rand(6);
  const className = DATA.trainerClassBySum[String(classSum)];
  const teamSize = trainerTeamSize(badges);
  const trainerLevel = 3 + badges;
  const table = DATA.trainerTables[className];
  const team = [];
  for(let i=0;i<teamSize;i++){
    const msum = rand(6)+rand(6);
    const root = table[msum-2];
    const finalSpecies = pickStageForLevel(root, trainerLevel);
    const opp = buildOpponent(finalSpecies, trainerLevel);
    opp.atk = rollTrueTypeAttack(opp.types);
    team.push(opp);
  }
  return { className, team };
}
function rollGymTeam(leaderName){
  const badges = gameState.defeatedGymLeaders.length;
  const info = DATA.gymLeaders[leaderName];
  const slotDefs = [
    {slot:1, minBadges:0, level: badges+5},
    {slot:2, minBadges:0, level: badges+4},
    {slot:3, minBadges:2, level: badges+4},
    {slot:4, minBadges:4, level: badges+5},
    {slot:5, minBadges:6, level: badges+3},
  ];
  const sendOrder = [5,2,3,4,1];
  const team = [];
  sendOrder.forEach(slotNum=>{
    const def = slotDefs.find(d=>d.slot===slotNum);
    if(badges < def.minBadges) return;
    const root = info.slots[String(slotNum)] || info.slots[slotNum];
    const finalSpecies = pickStageForLevel(root, def.level);
    const opp = buildOpponent(finalSpecies, def.level);
    opp.atk = cap(fixedAttackType(finalSpecies, String(slotNum)));
    team.push(opp);
  });
  return { info, team };
}
function eliteFourMembers(){ return DATA.eliteFour.concat([DATA.champion]); }
function eliteFourMemberLabelForIndex(idx){
  const members = eliteFourMembers();
  const m = members[idx];
  return (idx === members.length-1) ? ('Champion '+m.name) : m.name;
}
function rollEliteFourMemberTeam(member){
  const order = Object.prototype.hasOwnProperty.call(member.slots, '5') ? ['1','2','3','4','5','ace'] : ['1','2','3','4','ace'];
  const team = [];
  order.forEach(slotKey=>{
    const root = member.slots[slotKey];
    const level = member.levels[slotKey];
    const finalSpecies = pickStageForLevel(root, level);
    const opp = buildOpponent(finalSpecies, level);
    opp.atk = cap(fixedAttackType(finalSpecies, slotKey));
    team.push(opp);
  });
  return team;
}

/* ============ Transient (non-persisted) UI/turn state ============ */

let encounter = null;     // active battle state

const STARTERS_BY_REGION = {
  calli: ['Sprigatito','Fennekin','Popplio'],
  neokanto: ['Bulbasaur','Charmander','Squirtle'],
  hoenn: ['Treecko','Torchic','Mudkip'],
};

function typePillHtml(type){
  if(!type) return '';
  const c = TYPE_COLOR[type.toLowerCase()] || '#888';
  return '<span class="type-pill" style="background:'+c+';">'+type+'</span>';
}
// Same visual language as the Field Guide's trainer/gym rows and My Pokemon
// cards -- a "TYPE" label, colored pills, and a parenthesized "(Atk X)" with
// a gold ring on that pill to set it apart from the true-type ones.
function trainerStylePill(type, extraClass){
  if(!type) return '';
  const c = TYPE_COLOR[type.toLowerCase()] || '#888';
  return '<span class="trainer-type-pill'+(extraClass?' '+extraClass:'')+'" style="background:'+c+';">'+type+'</span>';
}
function trainerTypeBlockHtml(t1, t2, atk){
  return '<div class="trainer-type-block">' +
    '<span class="trainer-type-label">Type</span>' +
    '<span class="trainer-mon-types">'+trainerStylePill(t1)+trainerStylePill(t2)+'</span>' +
    '<span class="trainer-atk-paren">(<span class="trainer-type-label">Atk</span> '+trainerStylePill(atk, 'trainer-atk-pill')+')</span>' +
  '</div>';
}
function statRowHtml(statsArr){
  return '<div class="stat-row">' + STAT_NAMES.map((label,i)=>
    '<span class="stat-chip">'+label+' <b>'+statsArr[i]+'</b></span>'
  ).join('') + '<span class="stat-chip">Total <b>'+statTotal(statsArr)+'</b></span></div>';
}

function renderStatus(){
  const el = document.getElementById('statusStrip');
  const panel = document.getElementById('badgePanel');
  if(!gameState || !gameState.started){ el.innerHTML=''; panel.style.display='none'; return; }
  const badges = gameState.defeatedGymLeaders.length;
  el.innerHTML =
    '<span class="status-badges" data-action="toggleBadgePanel">Badges: '+badges+' / '+gymCount()+'</span>' +
    '<span class="status-turns">Turn '+(gameState.turnCount||0)+'</span>' +
    '<span class="status-slot">Slot '+currentSlot+'</span>' +
    '<button type="button" class="reset-btn" data-action="goHome">Home</button>';
  renderBadgePanel();
}
// One box per gym leader, in the same left-to-right order the region's gym
// leaders are defined in (DATA.gymLeaders' own key order), labeled with that
// leader's town's 3-letter map-node id -- tinted by the gym's type once
// beaten, greyed out otherwise.
function renderBadgePanel(){
  const panel = document.getElementById('badgePanel');
  panel.style.display = badgePanelOpen ? '' : 'none';
  if(!badgePanelOpen) return;
  const boxes = Object.keys(DATA.gymLeaders).map(name=>{
    const node = DATA.mapNodes.find(n => n.gymLeader === name);
    const abbrev = node ? node.id : '???';
    const info = DATA.gymLeaders[name];
    const beaten = gameState.defeatedGymLeaders.includes(name);
    const bg = beaten ? (TYPE_COLOR[(info.type||'').toLowerCase()] || '#888') : '#ccc';
    const fg = beaten ? '#fff' : '#777';
    return '<div class="badge-box" style="background:'+bg+'; color:'+fg+';" title="'+name+' -- '+info.town+' ('+info.type+')'+(beaten?' -- beaten':'')+'">'+abbrev+'</div>';
  }).join('');
  panel.innerHTML = '<div class="badge-panel-grid">'+boxes+'</div>';
}

function gameMonLevel(m){ return m.ev.reduce((a,b)=>a+b,0); }
function gameMonStatTotal(m){ return statTotal(m.base.map((b,i)=>b+m.ev[i])); }

const MY_POKEMON_SORTS = [
  { mode:'obtained', label:'Order Obtained' },
  { mode:'stat', label:'Stat Total' },
  { mode:'level', label:'Level' },
];
// 'obtained' leaves the natural (insertion) order alone; the other two are always
// highest-first, each tiebroken by the other measure.
function sortedGamePokemon(mons, mode){
  const arr = mons.slice();
  if(mode === 'stat'){
    arr.sort((a,b) => (gameMonStatTotal(b)-gameMonStatTotal(a)) || (gameMonLevel(b)-gameMonLevel(a)));
  } else if(mode === 'level'){
    arr.sort((a,b) => (gameMonLevel(b)-gameMonLevel(a)) || (gameMonStatTotal(b)-gameMonStatTotal(a)));
  }
  return arr;
}
function myPokemonSortControlsHtml(){
  return '<div class="choice-grid" style="margin-bottom:10px;">' +
    MY_POKEMON_SORTS.map(s =>
      '<button type="button" class="btn'+(myPokemonSort===s.mode?' btn-primary':'')+'" data-action="setMyPokemonSort" data-sort="'+s.mode+'">'+s.label+'</button>'
    ).join('') +
  '</div>';
}

function renderMyPokemonSection(){
  const card = document.getElementById('myPokemonCard');
  if(!DATA || !gameState){ card.style.display = 'none'; return; }
  card.style.display = (activeGameTab === 'mypokemon') ? '' : 'none';
  const mons = loadGamePokemon();
  const sorted = sortedGamePokemon(mons, myPokemonSort);
  document.getElementById('myPokemonList').innerHTML = myPokemonSortControlsHtml() + (sorted.length
    ? sorted.map(m => monStatCardHtml(m)).join('')
    : '<div class="empty-note">No Pokemon caught yet.</div>');
}

function render(){
  renderStatus();
  renderGameMap();
  renderDataTab();
  renderMyPokemonSection();
  const app = document.getElementById('app');
  if(view === 'home') app.innerHTML = renderHomeScreen();
  else if(view === 'regionPick') app.innerHTML = renderRegionPickScreen();
  else if(view === 'start') app.innerHTML = renderStartScreen();
  else if(view === 'board') app.innerHTML = renderBoardScreen();
  else if(view === 'moving') app.innerHTML = renderMovingScreen();
  else if(view === 'townMenu') app.innerHTML = renderTownMenuScreen();
  else if(view === 'routeRoll') app.innerHTML = renderRouteRollScreen();
  else if(view === 'evolveChoice') app.innerHTML = renderEvolveChoiceScreen();
  else if(view === 'encounter') app.innerHTML = renderEncounterScreen();
  else if(view === 'catchOrDefeat') app.innerHTML = renderCatchOrDefeatScreen();
  else if(view === 'message') app.innerHTML = renderMessageScreen();
  else if(view === 'elite4Ack') app.innerHTML = renderElite4AckScreen();
  else if(view === 'tmPickMon') app.innerHTML = renderTmPickMonScreen();
  else if(view === 'tmPickType') app.innerHTML = renderTmPickTypeScreen();
  else if(view === 'customRegionMap') app.innerHTML = renderCustomRegionMapScreen();
}

// Looks up a node's display name within a SPECIFIC region's own data, without
// touching the global DATA/nodesById -- lets the home screen summarize slots
// that are playing different regions side by side.
function nodeDisplayNameInRegion(regionKey, nodeId){
  const regionData = REGIONS[regionKey] && REGIONS[regionKey].data;
  if(!regionData) return 'Unknown';
  const node = (regionData.mapNodes || []).find(n=>n.id===nodeId);
  return node ? nodeDisplayName(node) : 'Unknown';
}

function renderHomeScreen(){
  let cards = '';
  for(let slot=1; slot<=SAVE_SLOT_COUNT; slot++){
    const gs = loadGameStateFromSlot(slot);
    if(gs && gs.started){
      const regionLabel = (REGIONS[gs.region] && REGIONS[gs.region].label) || gs.region;
      const locName = nodeDisplayNameInRegion(gs.region, gs.currentNodeId);
      const badges = (gs.defeatedGymLeaders||[]).length;
      cards +=
        '<div class="save-slot-card">' +
          '<div class="save-slot-title">Slot '+slot+' -- '+gs.starterSpecies+' ('+regionLabel+')</div>' +
          '<div class="save-slot-meta">At '+locName+' &middot; '+badges+' badge'+(badges===1?'':'s')+' &middot; Turn '+(gs.turnCount||0)+'</div>' +
          '<div class="choice-grid">' +
            '<button type="button" class="btn btn-primary" data-action="continueSlot" data-slot="'+slot+'">Continue</button>' +
            '<button type="button" class="btn btn-wild" data-action="newAdventureSlot" data-slot="'+slot+'">New Adventure (Overwrites)</button>' +
          '</div>' +
        '</div>';
    } else {
      cards +=
        '<div class="save-slot-card save-slot-empty">' +
          '<div class="save-slot-title">Slot '+slot+' -- Empty</div>' +
          '<div class="choice-grid"><button type="button" class="btn btn-primary" data-action="newAdventureSlot" data-slot="'+slot+'">Start New Adventure</button></div>' +
        '</div>';
    }
  }
  return '<div class="card">' +
    '<div class="card-title">Pok&eacute;mon Adventure</div>' +
    '<div class="card-sub">Choose a save slot ('+SAVE_SLOT_COUNT+' max -- start a new adventure in an occupied slot to overwrite it)</div>' +
    cards +
  '</div>';
}

// Page <title> + masthead brand -- region-neutral on the home/region-pick
// screens, "{Region} Adventure" once a specific region is actually active.
function updateRegionBranding(regionKey){
  const label = regionKey && REGIONS[regionKey] ? REGIONS[regionKey].label : null;
  document.title = (label ? label + ' Adventure' : 'Pokémon Adventure') + ' -- Play';
  const brandEl = document.getElementById('brandLabel');
  if(brandEl) brandEl.textContent = label ? label + ' Adventure' : 'Pokémon Adventure';
}

function goHome(){
  currentSlot = null;
  gameState = null;
  DATA = null;
  startPick = { region:null, starter:null, town:null };
  updateRegionBranding(null);
  view = 'home';
  encounter = null;
  movement = null;
  activeGameTab = 'map';
  dataBuilt = false;
  tmFlow = null;
  pendingTmOffer = false;
  customRegion = null;
  render();
}
function continueSlot(slot){
  currentSlot = slot;
  gameState = loadGameState();
  DATA = REGIONS[gameState.region].data;
  rebuildNodesById();
  updateRegionBranding(gameState.region);
  startPick = { region:null, starter:null, town:null };
  view = gameState.started ? 'board' : 'start';
  encounter = null;
  movement = null;
  activeGameTab = 'map';
  dataBuilt = false;
  tmFlow = null;
  pendingTmOffer = false;
  render();
}
function newAdventureSlot(slot){
  const existing = loadGameStateFromSlot(slot);
  if(existing && existing.started){
    if(!confirm('Slot '+slot+' already has a saved adventure (starter: '+existing.starterSpecies+', '+(existing.defeatedGymLeaders||[]).length+' badges). Starting a new adventure here will permanently overwrite it. Continue?')) return;
  }
  currentSlot = slot;
  localStorage.removeItem(gameKey());
  saveGamePokemonList([]);
  gameState = loadGameState();
  startPick = { region:null, starter:null, town:null };
  view = 'regionPick';
  encounter = null;
  movement = null;
  render();
}
// Called from the region-pick screen -- points DATA at the chosen region and
// proceeds to the familiar starter+town screen, now correctly scoped to it.
function pickRegion(key){
  DATA = REGIONS[key].data;
  rebuildNodesById();
  updateRegionBranding(key);
  startPick.region = key;
  view = 'start';
  activeGameTab = 'map';
  dataBuilt = false;
  tmFlow = null;
  pendingTmOffer = false;
  render();
}

    const types = DATA.types[sp] || ['Normal', null];
    const stats = DATA.dice[sp] || [0,0,0,0,0,0];
    const selected = startPick.starter === sp;
    return '<div class="starter-card'+(selected?' selected':'')+'" data-action="pickStarter" data-species="'+sp+'">' +
      '<h3>'+sp+'</h3>' +
      typePillHtml(types[0]) + typePillHtml(types[1]) +
      statRowHtml(stats) +
      '</div>';
  }).join('');

  const townNodes = DATA.mapNodes.filter(n=>n.kind==='town' || n.kind==='combo');
  const townButtons = townNodes.map(n=>{
    const selected = startPick.town === n.id;
    return '<button type="button" class="town-btn'+(selected?' selected':'')+'" data-action="pickTown" data-node="'+n.id+'">'+nodeDisplayName(n)+'</button>';
  }).join('');

  const canBegin = startPick.starter && startPick.town;

  return '<div class="card">' +
    '<div class="card-title">Begin Your Adventure</div>' +
    '<div class="card-sub">Choose a starter</div>' +

    '</div>' +

}

    } else {

// Shared "one Pokemon, full detail" card -- types, attack type (in parens,
// matching the Field Guide's own convention), every stat plus the total, and
// current XP progress. `actionHtml`, if given, is appended inside the card
// (e.g. a "Send Out" button); omit it for a plain read-only roster view.
// Compact evolution status for the owned-mon card's stat row -- sits to the
// right of the XP chip so the player can see what's coming without opening
// the Pokedex tab. Mirrors the level/friendship-vs-item method parsing that
// checkAndApplyLevelEvolution() and evoRequiredLevel() already use.
function monEvolutionChipHtml(m){
  const info = DATA.evoInfo[m.name];
  if(!info || !info.evolvesInto || !info.evolvesInto.length){
    return '';
  }
  const parts = info.evolvesInto.map(branch=>{
    let detail;
    if(branch.method.indexOf('Friendship') !== -1){
      detail = 'Friendship, Lv ' + ((m.catchLevel||0) + 4) + '+';
    } else {
      const req = evoRequiredLevel(branch.method);
      detail = req !== null ? ('Level ' + req) : branch.method;
    }
    return '<b>' + branch.species + '</b> (' + detail + ')';
  });
  return '<span class="stat-chip">Evolves into ' + parts.join(', ') + '</span>';
}
function monStatCardHtml(m, actionHtml){
  const level = m.ev.reduce((a,b)=>a+b,0);
  const finalStats = m.base.map((b,i)=>b+m.ev[i]);
  return '<div class="mon-detail-card">' +
    spriteImgHtml(m.name, 'sprite-lg') +
    '<div class="mon-detail-name">'+m.name+' Lv '+level+'</div>' +
    trainerTypeBlockHtml(m.t1, m.t2, m.atk) +
    statRowHtml(finalStats) +
    '<div class="stat-row"><span class="stat-chip">' + (level >= MAX_LEVEL
      ? 'XP <b>'+(m.xp||0)+'</b> / ∞'
      : 'XP <b>'+(m.xp||0)+'</b> / '+(level*10)+' to next level') + '</span>' +
      monEvolutionChipHtml(m) +
    '</div>' +
    (actionHtml || '') +
  '</div>';
}

function ownedMonPickerHtml(excludeIds, opp){
  const mons = loadGamePokemon().filter(m=>!excludeIds.has(m.id));
  if(!mons.length) return '<div class="empty-note">No available Pokemon left to send out.</div>';
  const ranked = mons.map(m=>{
    const finalStats = m.base.map((b,i)=>b+m.ev[i]);
    const odds = winOdds(finalStats, [m.t1, m.t2], m.atk, opp.statsArr, opp.types, opp.atk);
    return { m, odds };
  }).sort((a,b) => b.odds.winA - a.odds.winA); // best odds first
  return ranked.map(({m, odds})=>{
    const oddsText = odds.unbreakable ? 'Tied forever -- identical matchup' : Math.round(odds.winA*100)+'% to win this exchange';
    const oddsBg = odds.unbreakable ? 'var(--sage)' : (odds.winA >= 0.5 ? '#d7ecd2' : '#f3d9ce');
    return monStatCardHtml(m,
      '<div class="stat-row"><span class="stat-chip" style="background:'+oddsBg+';">Win odds <b>'+oddsText+'</b></span></div>' +
      '<div class="choice-grid" style="margin-top:8px;">' +
        '<button type="button" class="btn btn-primary" data-action="pickPlayerMon" data-id="'+m.id+'">Send Out '+m.name+'</button>' +
      '</div>'
    );
  }).join('');
}

function opponentDisplayHtml(opp, statusClass){

function fmtEffMult(mult){
  if(mult >= 4) return '×4';
  if(mult === 2) return '×2';
  if(mult === 1) return '×1';
  if(mult === 0.5) return '×½';
  if(mult === 0.25) return '×¼';
  return '×0';
}
// One side's whole column: sprite, name, types, attack type, and how effective its
// attack is against the OTHER side -- all stacked in one column so the two sides can
// never drift out of alignment with each other the way two separately-centered rows can.
function battleSideHtml(name, t1, t2, atk, effMult){

    spriteImgHtml(name, 'sprite-battle') +
    '<div class="dice-group-label">'+name+'</div>' +
    '<div class="battle-type-pills">'+typePillHtml(t1)+typePillHtml(t2)+'</div>' +

    (effMult != null ? '<div class="battle-eff-label">'+fmtEffMult(effMult)+'</div>' : '') +
  '</div>';
}
// Sits right above the dice stage (or the Fight button, when not yet rolling), so it's
// always the header of "who's fighting, with what, and how well it'll work."
function battlePanelHtml(nameA, t1A, t2A, atkA, effA, nameB, t1B, t2B, atkB, effB){

    battleSideHtml(nameA, t1A, t2A, atkA, effA) +

function diceStageHtml(rb){

      '<span class="vs-label">vs</span>' +

}
