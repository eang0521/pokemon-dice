<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pok&eacute;mon Adventure -- Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --paper-deep:#E2D9C4;
    --ink:#1F2E3D;
    --redwood:#2F4538;
    --rust:#C4572E;
    --gold:#D9A441;
    --sage:#8AA399;
    --nogym-green:#5B8A4E;
    --elite-purple:#A98FC9;
    --line: rgba(31,46,61,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(196,87,46,0.07), transparent 40%),
      radial-gradient(circle at 85% 82%, rgba(47,69,56,0.08), transparent 45%),
      repeating-linear-gradient(0deg, transparent, transparent 38px, var(--line) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, var(--line) 39px);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 14px 80px;
  }
  .sheet{ width:100%; max-width: 720px; }
  .masthead{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 4px 14px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 16px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 22px;
    color: var(--redwood);
  }
  .nav-link{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    color: var(--ink);
    text-decoration:none;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 6px 10px;
    background: var(--paper-deep);
  }
  .nav-link:hover{ background: var(--gold); }
  .status-strip{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .status-badges{
    background: var(--gold);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
    cursor:pointer;
  }
  .status-badges:hover{ background:#c4923a; }
  .badge-panel{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 12px;
    margin: -6px 0 16px;
  }
  .badge-panel-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge-box{
    width: 46px;
    height: 46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    border: 1.5px solid var(--ink);
    border-radius: 5px;
    letter-spacing:0.02em;
  }
  .status-turns{
    background: var(--sage);
    color: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
  }
  .reset-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--ink);
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 5px 9px;
    cursor:pointer;
  }
  .status-slot{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .save-slot-card{
    position:relative;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .save-slot-card.save-slot-empty{ border-style:dashed; opacity:0.75; }
  .save-slot-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .save-slot-main{ flex:1; min-width:0; }
  .save-slot-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .save-slot-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--sage);
    margin-bottom: 8px;
  }
  .save-slot-team{
    flex-shrink:0;
    margin-top: -8px;
    margin-right: 30px;
    display:grid;
    grid-template-columns: repeat(3, 65px);
    grid-template-rows: repeat(2, 50px); /* shorter than the sprites -- rows
      overlap vertically since the art itself doesn't fill its box height */
    gap:0;
  }
  .save-slot-team img{ width:65px; height:65px; object-fit:contain; image-rendering:auto; transform: translateY(-20%); }
  .save-slot-delete-btn{
    position:absolute; top:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--rust);
    background:var(--paper);
    color:var(--rust);
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:13px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .save-slot-delete-btn:hover{ background:var(--rust); color:var(--paper); }
  .howtoplay-body{
    font-family:'Work Sans', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    margin-top: 14px;
  }
  .howtoplay-body p{ margin:0 0 12px; }
  .howtoplay-body p:last-child{ margin-bottom:0; }
  .tutorial-tip{
    background: var(--paper-deep);
    border: 1.5px dashed var(--gold);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-family:'Work Sans', sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  .tutorial-tip-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color: var(--rust);
    margin-bottom: 4px;
  }
  .reset-btn:hover{ background:#e8bdb0; }
  .card{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    margin-bottom: 10px;
  }
  .opp-card-wrap{ position:relative; padding-right:120px; }
  .card-flavor{ font-size:13px; font-style:italic; color:#3c4f45; margin-bottom:10px; }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight:600;
    padding: 10px 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    cursor:pointer;
  }
  .btn:hover{ background: var(--gold); }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--gold); }
  .btn-primary:hover{ background:#c4923a; }
  .btn-wild{ background: var(--nogym-green); color:var(--paper); }
  .btn-wild:hover{ background:#4a7440; }
  .btn-danger{ background: var(--rust); color:var(--paper); }
  .btn-danger:hover{ background:#a8451f; }
  .choice-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .type-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 10px;
    margin-right:4px;
  }
  .stat-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin: 8px 0;
  }
  .stat-chip{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
  }
  .stat-chip b{ color: var(--redwood); }
  .starter-grid{ display:grid; grid-template-columns: 1fr; gap:10px; }
  @media (min-width:560px){ .starter-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .starter-card{
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 12px;
    cursor:pointer;
    text-align:center;
  }
  .starter-card.selected{ border-color: var(--rust); background: #f3d9ce; }
  .starter-card h3{ font-family:'Fraunces', serif; margin: 6px 0 4px; }
  .town-grid{ display:flex; flex-wrap:wrap; gap:6px; max-height:220px; overflow-y:auto; margin-top:6px; padding:2px; }
  .town-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    cursor:pointer;
  }
  .town-btn.selected{ background: var(--gold); }
  .mon-detail-card{
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 10px 120px 10px 12px;
    margin-top: 10px;
    position: relative;
  }
  .mon-detail-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .sprite-lg{
    position:absolute;
    top:10px; right:12px;
    width:96px; height:96px;
    object-fit:contain;
    image-rendering:auto;
    transform: translateY(-20%); /* pokemondb icons sit low in their own box -- nudge up */
  }
  .trainer-type-block{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .trainer-type-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .trainer-mon-types{ display:flex; gap:5px; }
  .trainer-atk-paren{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .trainer-type-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight:600;
    color:#fff;
    padding: 3px 9px;
    border-radius: 12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .trainer-atk-pill{ box-shadow: 0 0 0 2px var(--gold); }
  .battle-type-pills{ display:flex; justify-content:center; gap:4px; margin-top:4px; }
  .battle-eff-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--redwood);
    text-align:center;
    margin-top:3px;
  }
  .sprite-battle{ width:108px; height:108px; object-fit:contain; image-rendering:auto; transform: translateY(-20%); }
  .opp-team-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0 12px; }
  .opp-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .opp-chip.current{ background: var(--gold); font-weight:700; }
  .opp-chip.defeated{ opacity:0.45; text-decoration: line-through; }
  .e4-team-row{ display:flex; flex-wrap:wrap; gap:6px; margin: 8px 0 12px; }
  .e4-team-chip{
    display:flex; align-items:center; gap:3px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    white-space: nowrap;
    padding: 2px 7px 2px 3px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .e4-team-chip.current{ background: var(--gold); font-weight:700; }
  /* Smaller than the usual .sprite-sm so all 6 possible team members -- the max
     under the Elite Four's 6-Pokemon limit -- fit on one row instead of wrapping. */
  .e4-team-chip img{ width:22px; height:22px; }
  .team-export-box{
    width:100%;
    min-height:140px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    resize:vertical;
    box-sizing:border-box;
  }
  .log-box{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    max-height: 220px;
    overflow-y:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin-top: 10px;
  }
  .log-line{ padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log-line:last-child{ border-bottom:none; }
  .empty-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--sage);
    text-align:center;
    padding: 12px 0;
  }
  .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    display:block;
    margin: 10px 0 4px;
  }
  .dice-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin: 14px 0 4px;
  }
  .dice-group{ display:flex; gap:8px; }
  .dice-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--sage);
    text-align:center;
    margin-bottom:6px;
  }
  .dice-side{ display:flex; flex-direction:column; align-items:center; }
  .die{
    min-width:44px; height:44px;
    padding: 0 5px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight:600;
    font-variant-numeric: tabular-nums;
  }
  .die.rolling{ animation: dieTumble .09s linear infinite; }
  .die.die-kept{
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
  }
  @keyframes dieTumble{
    0%{ transform: rotate(0deg) scale(1); }
    50%{ transform: rotate(8deg) scale(1.05); }
    100%{ transform: rotate(-6deg) scale(1); }
  }
  .vs-label{
    font-family:'Fraunces', serif;
    font-size:18px;
    color: var(--redwood);
    align-self:center;
    margin-top: 18px;
  }
  .map-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-swatch{ display:inline-block; width:11px; height:11px; }
  .legend-town{ background: var(--gold); border: 1.5px solid var(--ink); }
  .legend-town-nogym{ background: var(--nogym-green); border: 1.5px solid var(--ink); }
  .legend-dungeon{
    width:0; height:0;
    background: transparent;
    border-left: 5.5px solid transparent;
    border-right: 5.5px solid transparent;
    border-bottom: 10px solid var(--rust);
  }
  .legend-route{ background: var(--sage); border: 1.5px solid var(--ink); border-radius:50%; }
  .legend-elite{ background: var(--elite-purple); border: 1.5px solid var(--ink); }
  .map-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    -webkit-overflow-scrolling: touch;
  }
  #mapSvg{ display:block; }
  .map-node{ cursor:pointer; }
  .map-node-shape{
    stroke: var(--ink);
    stroke-width: 1.5;
    transition: stroke-width .12s ease, filter .12s ease;
  }
  .map-node:hover .map-node-shape{ stroke-width: 2.5; }
  .map-node.player-here .map-node-shape{
    stroke: var(--rust);
    stroke-width: 3.5;
    filter: drop-shadow(0 0 4px var(--rust));
  }
  .map-node.can-move .map-node-shape{
    stroke: var(--gold);
    stroke-width: 3;
    filter: drop-shadow(0 0 5px var(--gold));
  }
  .map-node.can-move{ cursor:pointer; }
  .map-node.selected .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  /* Static (non-interactive) map preview -- used by the Custom Region generator,
     which has no player position or click behavior to wire up yet. */
  .map-node-static .map-node-shape{ stroke: var(--ink); stroke-width: 1.5; }
  .map-node-central .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  .map-node-label{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    pointer-events:none;
    fill: var(--ink);
  }
  .map-node-label-light{ fill: var(--paper); }
  .map-node-divider{
    stroke: var(--ink);
    stroke-width: 1.5;
    pointer-events:none;
  }
  .map-edge{
    stroke: var(--ink);
    stroke-width: 1.5;
    opacity: 0.35;
  }
  .map-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--redwood);
    margin-top: 8px;
    min-height: 16px;
  }
  .map-info{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1.5px dashed var(--ink);
    min-height: 50px;
  }
  .map-info-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--sage);
    text-align:center;
  }
  .map-info-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 18px;
    margin-bottom:4px;
  }
  .map-info-kind{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-bottom: 8px;
  }
  .map-info-desc{
    font-size: 13px;
    line-height:1.5;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-info-evo{
    font-size: 12.5px;
    line-height:1.5;
    color: var(--ink);
    background: rgba(201, 162, 39, 0.16);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 10px;
  }
  .map-go-btn{
    padding: 9px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    background: var(--rust);
    color: var(--paper);
    border:none;
    border-radius: 4px;
    cursor:pointer;
    margin-bottom: 10px;
  }
  .map-go-btn:hover{ background:#a9481f; }
  .map-encounter-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-top: 10px;
    margin-bottom: 7px;
  }
  .map-encounter-list{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .map-encounter-row{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 8px;
  }
  .map-encounter-sum{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size: 11px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 3px;
    width: 18px;
    height: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .map-encounter-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 13px;
    flex: 1;
  }
  .map-encounter-types{ display:flex; gap:4px; }
  .sprite-sm{ width:36px; height:36px; object-fit:contain; image-rendering:auto; flex-shrink:0; transform: translateY(-20%); }
  .tab-row{ display:flex; gap:6px; margin-bottom:16px; }
  .tab-btn{
    flex:1; min-width:0; padding:9px 4px;
    font-family:'Fraunces', serif; font-weight:600; font-size:14px; line-height:1.15;
    text-align:center; background:var(--paper); color:var(--ink);
    border:1.5px solid var(--ink); border-radius:4px; cursor:pointer;
  }
  @media (max-width:560px){ .tab-btn{ font-size:11.5px; padding:8px 2px; } }
  .tab-btn.active{ background:var(--redwood); color:var(--paper); border-color:var(--redwood); }
  /* Elite Four / Champion roster preview -- more tabs than fit at flex:1, so these
     keep their natural width and the row scrolls horizontally instead of squeezing. */
  .tab-row-scroll{ display:flex; gap:6px; margin:8px 0; overflow-x:auto; }
  .tab-row-scroll .tab-btn{ flex:0 0 auto; padding:8px 12px; }
  /* TM attack-type picker -- a little 5-slice strip of the wheel centered on the
     Pokemon's current attack type, plus its own type(s) as a separate shortcut row. */
  .tm-wheel-row{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; margin:10px 0; }
  .tm-type-btn, .tm-wheel-current{
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:#fff;
    text-transform:uppercase; letter-spacing:0.03em; border-radius:6px;
    padding:10px 13px; text-align:center; text-shadow:0 1px 1px rgba(0,0,0,0.25);
  }
  .tm-type-btn{ border:none; cursor:pointer; }
  .tm-type-btn:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .tm-wheel-current{ opacity:0.55; }
  .tm-wheel-current-label{ font-size:8px; letter-spacing:0.05em; margin-top:1px; font-weight:500; }
  .tm-wheel-link{ color:var(--sage); font-size:15px; }
  .tm-truetype-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .dex-type-btn{ opacity:0.55; }
  .dex-type-btn.active{ opacity:1; outline:2.5px solid var(--ink); outline-offset:-2.5px; }
  .field{ margin-bottom:14px; }
  .dex-search{
    width:100%; font-family:'Work Sans', sans-serif; font-size:15px;
    padding:10px 12px; background:var(--paper); border:1.5px solid var(--ink);
    border-radius:2px; color:var(--ink);
  }
  .dex-count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--sage); margin:10px 0 4px; }
  .seed-code{
    font-family:'IBM Plex Mono', monospace; font-weight:700;
    background:var(--paper-deep); border:1px solid var(--line); border-radius:3px;
    padding:1px 6px; letter-spacing:0.03em;
  }
  .dex-evo-line{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink); line-height:1.5; }
  .dex-evo-line b{ color:var(--rust); }
  .dex-loc-line{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--redwood);
    line-height:1.5; margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
  }
  .dex-loc-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--rust);
    background:none; border:none; padding:0; text-decoration:underline; cursor:pointer;
  }
  .dex-loc-btn:hover{ color:var(--redwood); }
  .dex-no-results{ text-align:center; font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--sage); padding:20px 0; }

  .bracket-scroll{ display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; align-items:stretch; }
  .bracket-round{ flex:0 0 176px; display:flex; flex-direction:column; min-height:0; }
  .bracket-round-header{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--redwood); text-align:center; margin-bottom:8px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .bracket-round-header .btn{ padding:4px 8px; font-size:10px; }
  .bracket-round-matches{ display:flex; flex-direction:column; justify-content:space-around; flex:1; gap:8px; min-height:0; }
  .bracket-match{ background:var(--paper); border:1.5px solid var(--line); border-radius:6px; padding:6px 7px; flex-shrink:0; }
  .bracket-slot{ display:flex; align-items:center; gap:5px; padding:2px 0; font-family:'IBM Plex Mono', monospace; font-size:11px; line-height:1.2; }
  .bracket-slot-tbd{ color:var(--sage); }
  .bracket-slot-winner{ font-weight:700; color:var(--redwood); }
  .bracket-slot-loser{ opacity:0.45; text-decoration:line-through; }
  .bracket-sprite{ width:20px; height:20px; object-fit:contain; flex-shrink:0; }
  .bracket-vs{ text-align:center; font-size:9px; color:var(--sage); display:block; letter-spacing:0.05em; text-transform:uppercase; }
  .bracket-odds{ text-align:center; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink); margin-top:3px; }
  .bracket-log{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--redwood); margin-top:4px; line-height:1.35; }
  .bracket-sim-btn{ width:100%; margin-top:5px; padding:5px; font-size:10.5px; }
  .bracket-dice{ display:flex; justify-content:center; gap:8px; margin:6px 0 2px; }
  .bracket-dice .die{ min-width:28px; height:28px; font-size:12px; }
  .champion-banner{ text-align:center; }
  .champion-title{ font-family:'Fraunces', serif; font-weight:700; font-size:22px; color:var(--redwood); margin-bottom:8px; }
  .rr-rank-badge{ display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:700; background:var(--gold); border:1.5px solid var(--ink); border-radius:4px; padding:1px 7px; margin-right:7px; vertical-align:middle; }
  .rr-standing-row{ display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono', monospace; font-size:11.5px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .rr-standing-row:last-child{ border-bottom:none; }
  .rr-cutoff-row{ border-bottom:2.5px solid var(--gold); }
  .rr-standing-types{ display:flex; gap:3px; flex-shrink:0; }
  .rr-standings-toggle{ cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px; }
  .rr-standings-toggle:hover{ color:var(--redwood); }
  .mega-select{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; padding:7px 9px; border:1.5px solid var(--ink); border-radius:4px; background:var(--paper); color:var(--ink); width:100%; }
  .ban-bar{ background:var(--paper-deep); border:1.5px solid var(--ink); border-radius:6px; padding:8px 10px; margin-bottom:14px; }
  .ban-bar-row{ display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-bottom:7px; }
  .ban-bar-label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--redwood); }
  .ban-check-item{ display:flex; align-items:center; gap:4px; font-family:'IBM Plex Mono', monospace; font-size:10.5px; cursor:pointer; white-space:nowrap; }
  .ban-check-item input{ width:12px; height:12px; cursor:pointer; accent-color:var(--rust); margin:0; }
  .ban-bar-count{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--sage); }
  .ban-bar-btn{ width:100%; }
  .ban-region-select{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; padding:2px 5px; border:1.5px solid var(--ink); border-radius:4px; background:var(--paper); color:var(--ink); }
  .team-standing-sprites{ display:flex; gap:3px; flex:1; flex-wrap:wrap; }
  .team-result-record{ float:right; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:400; }
  /* 50% bigger than the Elimination Bracket's .bracket-sprite (20px) -- a dedicated
     class so that page's own sprites aren't affected -- and the row needs a little
     extra vertical padding since 6 of these can wrap onto a second line. */
  .team-standing-sprite{ width:30px; height:30px; object-fit:contain; flex-shrink:0; }
  .team-standing-row{ padding:9px 0; }
  .team-member-name{ width:105px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Fixed-width columns so true types, attack type, and each stat line up across every
     row -- otherwise a mono-type Pokemon (1 pill) or a short type/attack name shifts
     everything after it compared to a dual-type or long-named row. */
  .team-member-types{ width:135px; flex-shrink:0; display:flex; gap:3px; flex-wrap:nowrap; }
  .team-member-atk-wrap{ width:112px; flex-shrink:0; }
  .team-member-stats{ font-family:'IBM Plex Mono', monospace; font-size:11px; white-space:nowrap; flex-shrink:0; }
  .team-member-stat{ display:inline-block; width:20px; text-align:right; }
  .progress-bar-track{ background:var(--paper); border:1.5px solid var(--ink); border-radius:5px; height:16px; overflow:hidden; margin-top:8px; }
  .progress-bar-fill{ background:var(--gold); height:100%; transition:width .15s ease; }
</style>
</head>

// Long Round Robin: each round is some number of 100-entrant round robins: Round 1
// starts from 100 robins of fresh random entrants (repeats allowed); the top cutoff
// from each robin advance and get reshuffled into the next round's (smaller) set of
// robins, still 100 entrants each, until a single 100-entrant Championship robin
// crowns the strongest Pokemon.
const MEGA_ROBIN_SIZE = 100;
// User-configurable (Settings section, megarr/teammegarr modes) -- how many round
// robins each round has, NOT counting the final Championship round, which is always
// exactly 1 robin and gets appended automatically (see buildFunnelDefs). Each round's
// cutoff is no longer a fixed number: it's derived at generation time from how many
// robins the NEXT round needs (see advanceFunnelRound) so any robin-count sequence the
// user types in works, not just ones that happen to divide evenly.
const DEFAULT_ROUND_ROBIN_COUNTS = [100, 40, 10];
const DEFAULT_TEAM_ROUND_ROBIN_COUNTS = [200, 100, 40, 10];
// Builds the full per-round def list (label + robinCount only -- cutoff is computed
// later, once each round's actual results are in) from a robin-count sequence, always
// appending a final 1-robin Championship round.
function buildFunnelDefs(robinCounts){
  const full = robinCounts.concat([1]);
  return full.map((robinCount, i) => ({
    label: (i === full.length-1) ? 'Championship' : ('Round '+(i+1)),
    robinCount,
  }));
}
// Advances one funnel round: nextRobinCount robins of MEGA_ROBIN_SIZE are needed next,
// so an equal baseCount = floor(needed/thisRobinCount) advances automatically from
// every one of this round's robins, and any remaining "wildcard" slots go to whichever
// leftover teams (rank > baseCount, pooled across every robin in this round) have the
// best record, tiebroken by point/KO differential -- not just one wildcard per robin.
function advanceFunnelRound(rankedPerRobin, nextRobinCount, extractPayload){
  const needed = nextRobinCount * MEGA_ROBIN_SIZE;
  const thisRobinCount = rankedPerRobin.length;
  const baseCount = Math.min(MEGA_ROBIN_SIZE, Math.floor(needed / thisRobinCount));
  const wildcardCount = needed - baseCount*thisRobinCount;
  const advancing = [];
  const leftover = [];
  rankedPerRobin.forEach(ranked=>{
    ranked.slice(0, baseCount).forEach(x=>advancing.push(extractPayload(x)));
    leftover.push(...ranked.slice(baseCount));
  });
  if(wildcardCount > 0){
    leftover.sort((a,b)=> b.wins-a.wins || b.diff-a.diff);
    leftover.slice(0, wildcardCount).forEach(x=>advancing.push(extractPayload(x)));
  }
  return { advancing, baseCount, wildcardCount };
}

// The same attack-wheel mechanic play.html uses to roll a wild/trainer Pokemon's
// attack type: start from one of the Pokemon's own types (so STAB is common but
// not guaranteed), then drift 0-2 steps around the wheel based on 2d6.
const WHEEL = ['dragon','flying','normal','fighting','dark','fire','ghost','psychic','fairy',
               'grass','poison','bug','electric','steel','rock','ground','ice','water'];
function wheelShift(sum){
  if(sum===2) return -2;
  if(sum===3||sum===4) return -1;
  if(sum>=5 && sum<=9) return 0;
  if(sum===10||sum===11) return 1;
  if(sum===12) return 2;
  return 0;
}
function rand(n){ return 1 + Math.floor(Math.random()*n); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function randomAttackType(t1, t2){
  const types = [t1, t2].filter(Boolean).map(t=>t.toLowerCase());
  const baseType = types[Math.floor(Math.random()*types.length)];
  const shift = wheelShift(rand(6) + rand(6));
  const baseIdx = WHEEL.indexOf(baseType);
  const finalIdx = ((baseIdx + shift) % WHEEL.length + WHEEL.length) % WHEEL.length;
  return cap(WHEEL[finalIdx]);
}

}

function effectiveness(atkType, defType1, defType2){
  const row = TYPE_CHART[atkType] || {};
  let m = (row[defType1] ?? 1);
  if(defType2) m *= (row[defType2] ?? 1);
  return m;
}
function diceConfig(mult){
  if(mult >= 4) return {n:3, mode:'best'};
  if(mult === 2) return {n:2, mode:'best'};
  if(mult === 1) return {n:1, mode:'single'};
  if(mult === 0.5) return {n:2, mode:'worst'};
  if(mult === 0.25) return {n:3, mode:'worst'};
  return {n:3, mode:'worst'};
}
function rollSide(finalStats, cfg, stabBonus){
  const picks = [];
  let kept = null, keptIdx = 0;
  for(let i=0;i<cfg.n;i++){
    const idx = Math.floor(Math.random()*6);
    const val = finalStats[idx];
    picks.push(val + stabBonus);
    if(kept===null || (cfg.mode==='worst' ? val<kept : val>kept)){
      kept = val;
      keptIdx = i;
    }
  }
  return { picks, keptIdx, kept, final: kept + stabBonus };
}
// Exact order-statistics closed form, not brute-force enumeration: for n IID draws
// uniform over the 6 stat values, P(max <= v) = (k/6)^n where k = count of stats <= v
// (symmetric for min) -- same math as literally enumerating all 6^n outcomes (verified
// against that version on 20,000 random cases), just O(6 log 6) instead of O(6^n).
// Matters because winOdds now gets called far more per match (Long Team Round Robin's
// best-odds replacement pick), not just once per exchange for a live odds display.
function resultDistribution(finalStats, cfg, stabBonus){
  const n = cfg.n;
  const dist = new Map();
  if(n === 1){
    finalStats.forEach(v=>{
      const face = v + stabBonus;
      dist.set(face, (dist.get(face)||0) + 1/6);
    });
    return dist;
  }
  const sorted = finalStats.slice().sort((a,b)=>a-b);
  if(cfg.mode === 'best'){
    let prevCum = 0, i = 0;
    while(i < 6){
      let j = i;
      while(j < 6 && sorted[j] === sorted[i]) j++;
      const cum = Math.pow(j/6, n); // P(max <= sorted[i]) -- j = count of values <= sorted[i]
      const face = sorted[i] + stabBonus;
      dist.set(face, (dist.get(face)||0) + (cum - prevCum));
      prevCum = cum;
      i = j;
    }
  } else { // 'worst'
    let prevCum = 0, i = 5;
    while(i >= 0){
      let j = i;
      while(j >= 0 && sorted[j] === sorted[i]) j--;
      const countGE = 6 - (j+1); // indices j+1..5, all >= sorted[i]
      const cum = Math.pow(countGE/6, n); // P(min >= sorted[i])
      const face = sorted[i] + stabBonus;
      dist.set(face, (dist.get(face)||0) + (cum - prevCum));
      prevCum = cum;
      i = j;
    }
  }
  return dist;
}
function crossOdds(distA, distB){
  let winA=0, winB=0, tie=0;
  for(const [a,pa] of distA){
    for(const [b,pb] of distB){
      const p = pa*pb;
      if(a>b) winA += p;
      else if(b>a) winB += p;
      else tie += p;
    }
  }
  const decided = winA + winB;
  if(decided <= 1e-12) return {winA:0, winB:0, unbreakable:true};
  return {winA: winA/decided, winB: winB/decided, unbreakable:false};
}
function stabBonusValue(){ return settings.strongerStab ? 1 : 0.5; }
function winOdds(statsA, typesA, atkA, statsB, typesB, atkB){
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));

/* ============ Round Robin -- every one of 100 random entrants battles every
   other entrant exactly once (4950 matches), all resolved instantly (no
   animation -- there are far too many to watch one at a time), then ranked. ============ */
// Used for bulk (non-animated, non-displayed) match resolution -- the Round Robin
// and Long Round Robin modes need to resolve tens of thousands of exchanges, so this
// skips the exact win-odds computation (resultDistribution/crossOdds) that the
// animated single-match path uses just to detect an "unbreakable" pairing up front.
// Instead it simply rerolls on a tie up to a cap, then coin-flips -- mathematically
// equivalent (a real reroll streak that long is indistinguishable from a proven
// unbreakable tie), and far cheaper per match at this scale.
function simulateOneExchange(A, B){
  const sdA = SPECIES_DATA[A.name], sdB = SPECIES_DATA[B.name];
  const statsA = finalStatsOf(A), statsB = finalStatsOf(B);
  const typesA = [sdA.t1, sdA.t2], typesB = [sdB.t1, sdB.t2];
  const atkA = A.atk, atkB = B.atk;
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? stabBonusValue() : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? stabBonusValue() : 0;
  let rA, rB, roundNum = 0;
  const REROLL_CAP = 50;
  do {
    roundNum++;
    rA = rollSide(statsA, cfgA, stabA);
    rB = rollSide(statsB, cfgB, stabB);
  } while(rA.final === rB.final && roundNum < REROLL_CAP);
  const coinFlipped = rA.final === rB.final;
  const winnerIsA = coinFlipped ? Math.random() < 0.5 : (rA.final > rB.final);
  return { winnerIsA, finalA: Math.floor(rA.final), finalB: Math.floor(rB.final) };
}
function generateRoundRobin(){
  const names = shuffledSpeciesSample(ROUND_ROBIN_SIZE, eligibleSpeciesList());
  const entrants = names.map(generateEntrant);

  for(let i=0;i<entrants.length;i++){
    for(let j=i+1;j<entrants.length;j++){
      const res = simulateOneExchange(entrants[i], entrants[j]);
      const margin = res.finalA - res.finalB;
      if(res.winnerIsA){ stats[i].wins++; stats[j].losses++; }
      else { stats[j].wins++; stats[i].losses++; }
      stats[i].diff += margin;
      stats[j].diff -= margin;
    }
  }
  roundRobin = { entrants, stats };
  saveStore();
  render();
}

/* ============ Long Team Round Robin -- the exact same 100/40/10/1 funnel as Long
   Round Robin, but every entrant is now a TEAM of 6 unique (within that team --
   repeats across different teams are still fine) Pokemon. A match between two teams
   is a fixed-order gauntlet: each team's lineup order is set once when it's generated
   and never reshuffled (including across rounds if it advances) -- position 0 leads,
   and a side's next position only comes in once its current one faints. ============ */
const TEAM_SIZE = 6;
function generateUniqueTeam(sourceList){
  const pool = sourceList.slice();
  const n = Math.min(TEAM_SIZE, pool.length);
  for(let i=0;i<n;i++){
    const j = i + Math.floor(Math.random()*(pool.length-i));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return { members: pool.slice(0, n).map(generateEntrant) };
}
// Among candidates (one side's still-alive members), picks whichever gives that
// side the best exact win probability against opponent (the other side's current
// active member, unchanged since it just won the last exchange) -- a real odds
// comparison via winOdds, not just the next name in the list.
function pickBestReplacementIndex(candidates, opponent, forSide){
  const sdOpp = SPECIES_DATA[opponent.name];
  const statsOpp = finalStatsOf(opponent);
  const typesOpp = [sdOpp.t1, sdOpp.t2];
  let bestIdx = 0, bestOdds = -1;
  for(let i=0;i<candidates.length;i++){
    const cand = candidates[i];
    const sdCand = SPECIES_DATA[cand.name];
    const statsCand = finalStatsOf(cand);
    const typesCand = [sdCand.t1, sdCand.t2];
    const odds = forSide==='A'
      ? winOdds(statsCand, typesCand, cand.atk, statsOpp, typesOpp, opponent.atk)
      : winOdds(statsOpp, typesOpp, opponent.atk, statsCand, typesCand, cand.atk);
    const myOdds = forSide==='A' ? odds.winA : odds.winB;
    if(myOdds > bestOdds){ bestOdds = myOdds; bestIdx = i; }
  }
  return bestIdx;
}
// Position 0 leads for both sides (no opponent is known yet to react to); after that,
// whichever side just lost an exchange sends in whichever of its remaining members has
// the best odds against the opponent's (still active) current member, not simply the
// next one in its own lineup.
function simulateTeamMatch(teamA, teamB){
  const aRemaining = teamA.members.slice();
  const bRemaining = teamB.members.slice();
  let aActive = aRemaining.shift();
  let bActive = bRemaining.shift();
  let aLosses = 0, bLosses = 0;
  // Off (default): the next teammate in lineup order, same mechanic every other mode
  // uses. On: exact win-odds decide the replacement -- correct, but far more expensive
  // at bulk scale (see pickBestReplacementIndex's winOdds calls), hence opt-in.
  const useBestOdds = settings.teamBestOddsReplacement;
  while(true){
    const res = simulateOneExchange(aActive, bActive);
    if(res.winnerIsA){
      bLosses++;
      if(bRemaining.length === 0) return { winnerIsA:true, aLosses, bLosses };
      const idx = useBestOdds ? pickBestReplacementIndex(bRemaining, aActive, 'B') : 0;
      bActive = bRemaining.splice(idx, 1)[0];
    } else {
      aLosses++;
      if(aRemaining.length === 0) return { winnerIsA:false, aLosses, bLosses };
      const idx = useBestOdds ? pickBestReplacementIndex(aRemaining, bActive, 'A') : 0;
      aActive = aRemaining.splice(idx, 1)[0];
    }
  }
}
function simulateTeamRoundRobinGroup(teams){
  const stats = teams.map(()=>({ wins:0, losses:0, diff:0 }));
  for(let i=0;i<teams.length;i++){
    for(let j=i+1;j<teams.length;j++){
      const res = simulateTeamMatch(teams[i], teams[j]);
      const margin = res.bLosses - res.aLosses; // KOs dealt minus KOs taken, from i's side
      if(res.winnerIsA){ stats[i].wins++; stats[j].losses++; }
      else { stats[j].wins++; stats[i].losses++; }
      stats[i].diff += margin;
      stats[j].diff -= margin;
    }
  }
  return stats;
}
// Teams don't have a single name to tiebreak on the way rankGroup does, so ties fall
// back to array index -- deterministic, and an exact wins+diff tie between two teams
// is rare enough that the tiebreak's "fairness" doesn't really matter.
function rankTeamGroup(teams, stats){
  return teams.map((team,i)=>({ team, i, wins:stats[i].wins, losses:stats[i].losses, diff:stats[i].diff }))
    .sort((a,b)=> b.wins-a.wins || b.diff-a.diff || a.i-b.i);
}
// Optional Top-N Bracket -- after the Championship round robin, the top N teams
// (seeded by their round-robin record, tiebroken by KO differential) play a standard
// seeded single-elimination bracket to decide the final champion. N need not be a
// power of 2: the bracket is padded up to the next power of 2 with byes, and byes go
// to the highest seeds first via the standard recursive seeding order (1v(size),
// 2v(size-1), ... ), so a bye can only ever land opposite a real team in round 1 --
// never two byes paired together -- and seeds that got a bye still have to play each
// other from round 2 onward like everyone else.
function nextPowerOfTwo(n){
  let p = 1;
  while(p < n) p *= 2;
  return p;
}
function standardSeedOrder(size){
  if(size === 1) return [1];
  const prev = standardSeedOrder(size/2);
  const result = [];
  prev.forEach(s => { result.push(s); result.push(size+1-s); });
  return result;
}
function bracketRoundLabel(slotsCount){
  if(slotsCount === 2) return 'Final';
  if(slotsCount === 4) return 'Semifinals';
  if(slotsCount === 8) return 'Quarterfinals';
  return 'Round of '+slotsCount;
}
// rankedTop: rankTeamGroup's output for the Championship robin, already sorted best-
// first. Builds the seed list and resolves the ENTIRE bracket immediately (no
// interactivity -- this mode has never had a per-match click-to-simulate step, so the
// bracket is generated fully resolved like every other part of this funnel).
function buildTeamBracket(rankedTop, n){
  const seeds = rankedTop.slice(0, n).map((r,i)=>(
    { seed:i+1, team:r.team, wins:r.wins, losses:r.losses, diff:r.diff }
  ));
  const seedByNumber = {};
  seeds.forEach(s => { seedByNumber[s.seed] = s; });
  const size = nextPowerOfTwo(n);
  const order = standardSeedOrder(size);

  const rounds = [];
  let currentSlots = order.map(seedNum => seedNum <= n ? seedByNumber[seedNum] : null);
  while(currentSlots.length > 1){
    const label = bracketRoundLabel(currentSlots.length);
    const matches = [];
    const nextSlots = [];
    for(let i=0;i<currentSlots.length;i+=2){
      const a = currentSlots[i], b = currentSlots[i+1];
      if(a && !b){
        matches.push({ aSeed:a.seed, bSeed:null, winnerSeed:a.seed, isBye:true, log:['Seed '+a.seed+' advances on a bye.'] });
        nextSlots.push(a);
      } else if(b && !a){
        matches.push({ aSeed:null, bSeed:b.seed, winnerSeed:b.seed, isBye:true, log:['Seed '+b.seed+' advances on a bye.'] });
        nextSlots.push(b);
      } else {
        const res = simulateTeamMatch(a.team, b.team);
        const winner = res.winnerIsA ? a : b;
        matches.push({ aSeed:a.seed, bSeed:b.seed, winnerSeed:winner.seed, isBye:false, log:[
          'Seed '+a.seed+' ('+(TEAM_SIZE-res.aLosses)+' left) vs Seed '+b.seed+' ('+(TEAM_SIZE-res.bLosses)+' left) -- Seed '+winner.seed+' wins!'
        ]});
        nextSlots.push(winner);
      }
    }
    rounds.push({ label, matches });
    currentSlots = nextSlots;
  }
  return { seeds, size, rounds, championSeed: currentSlots[0] ? currentSlots[0].seed : null };
}

  const rounds = [];
  let doneRobins = 0;
  for(let ri=0; ri<defs.length; ri++){
    const def = defs[ri];
    const robins = [];
    for(let g=0; g<def.robinCount; g++){
      const groupTeams = pool.slice(g*MEGA_ROBIN_SIZE, (g+1)*MEGA_ROBIN_SIZE);
      const stats = simulateTeamRoundRobinGroup(groupTeams);
      robins.push({ teams:groupTeams, stats });
      doneRobins++;
      if(doneRobins % 4 === 0 || g===def.robinCount-1){
        teamMegaProgress = { label:'Simulating '+def.label+' (round robin '+(g+1)+' of '+def.robinCount+')...', done:doneRobins, total:totalRobins };
        render();
        await sleep(0);
      }
    }
    const isLast = (ri === defs.length-1);
    let cutoff = null;
    if(!isLast){
      const rankedPerRobin = robins.map(rb=>rankTeamGroup(rb.teams, rb.stats));
      const advanced = advanceFunnelRound(rankedPerRobin, defs[ri+1].robinCount, x=>x.team);
      pool = shuffleArray(advanced.advancing);
      cutoff = { base:advanced.baseCount, wildcard:advanced.wildcardCount };
    }
    rounds.push({ label:def.label, cutoff, robins });
  }
  let bracket = null;
  if(settings.teamTopNBracket >= 2){
    const champRound = rounds[rounds.length-1];
    const ranked = rankTeamGroup(champRound.robins[0].teams, champRound.robins[0].stats);
    bracket = buildTeamBracket(ranked, Math.min(settings.teamTopNBracket, ranked.length));
  }
  teamMegaRR = { rounds, bracket };
  teamMegaSelection = { round:0, robin:0 };
  teamMegaView = 'roundrobin';
  teamMegaProgress = null;
  saveTeamMegaStore();
  render();
}
function teamMegaChampion(){
  if(teamMegaRR.bracket){
    const seedByNumber = {};
    teamMegaRR.bracket.seeds.forEach(s=>{ seedByNumber[s.seed] = s; });
    return seedByNumber[teamMegaRR.bracket.championSeed].team;
  }
  const champRound = teamMegaRR.rounds[teamMegaRR.rounds.length-1];
  return rankTeamGroup(champRound.robins[0].teams, champRound.robins[0].stats)[0].team;
}

/* ============ Match resolution ============ */
async function resolveMatch(r, m, animate, opts){
  const silent = opts && opts.silent;
  const match = tourney.rounds[r][m];
  if(match.winnerIdx !== null || match.aIdx===null || match.bIdx===null) return;
  const A = tourney.entrants[match.aIdx], B = tourney.entrants[match.bIdx];
  const sdA = SPECIES_DATA[A.name], sdB = SPECIES_DATA[B.name];
  const statsA = finalStatsOf(A), statsB = finalStatsOf(B);
  const typesA = [sdA.t1, sdA.t2], typesB = [sdB.t1, sdB.t2];
  const atkA = A.atk, atkB = B.atk;
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? stabBonusValue() : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? stabBonusValue() : 0;
  const displayStatsA = stabA ? statsA.map(v=>v+stabA) : statsA;
  const displayStatsB = stabB ? statsB.map(v=>v+stabB) : statsB;
  const preOdds = winOdds(statsA, typesA, atkA, statsB, typesB, atkB);

  let rA, rB, roundNum = 0, doAnimate = animate;
  if(doAnimate){ animatingMatch = { r, m, nA:cfgA.n, nB:cfgB.n }; }
  do {
    roundNum++;
    rA = rollSide(statsA, cfgA, stabA);
    rB = rollSide(statsB, cfgB, stabB);
    if(doAnimate){
      render();
      await Promise.all([
        ...rA.picks.map((face,i)=>tumble(document.getElementById('tDieA'+i), 500, displayStatsA, face)),
        ...rB.picks.map((face,i)=>tumble(document.getElementById('tDieB'+i), 500, displayStatsB, face)),
      ]);
      const dieA = document.getElementById('tDieA'+rA.keptIdx);
      const dieB = document.getElementById('tDieB'+rB.keptIdx);
      if(dieA) dieA.classList.add('die-kept');
      if(dieB) dieB.classList.add('die-kept');
      await sleep(500);
      if(roundNum >= 8) doAnimate = false;
    }
  } while(rA.final === rB.final && !preOdds.unbreakable && roundNum < 300);
  animatingMatch = null;

  const coinFlipped = rA.final === rB.final;
  const winnerIsA = coinFlipped ? Math.random() < 0.5 : (rA.final > rB.final);
  match.winnerIdx = winnerIsA ? match.aIdx : match.bIdx;
  match.log = [
    (coinFlipped ? A.name+' and '+B.name+' tied every roll -- coin flip. ' : '') +
    A.name+' ('+Math.floor(rA.final)+') vs '+B.name+' ('+Math.floor(rB.final)+') -- '+(winnerIsA?A.name:B.name)+' advances!'
  ];
  if(r+1 < tourney.rounds.length){
    const nextMatch = tourney.rounds[r+1][Math.floor(m/2)];
    if(m%2===0) nextMatch.aIdx = match.winnerIdx; else nextMatch.bIdx = match.winnerIdx;
  } else {
    tourney.championIdx = match.winnerIdx;
  }
  if(!silent){ saveStore(); render(); }
}
async function resolveRound(r){
  const matches = tourney.rounds[r];
  for(let m=0;m<matches.length;m++){
    if(matches[m].winnerIdx===null && matches[m].aIdx!==null && matches[m].bIdx!==null){
      await resolveMatch(r, m, false, {silent:true});
    }
  }
  saveStore();
  render();
}

// Describes the CURRENT robin-count setting round by round (using the same
// baseCount/wildcard math advanceFunnelRound actually applies at generation time),
// so the generator screen's text always matches whatever the user has configured
// instead of a hardcoded default.
function funnelDescriptionHtml(robinCounts, thing, thingPlural){
  const full = robinCounts.concat([1]);
  const parts = [];
  for(let i=0;i<full.length;i++){
    const count = full[i];
    const isLast = (i === full.length-1);
    if(isLast){
      parts.push('Championship: the final '+MEGA_ROBIN_SIZE+' '+thingPlural+' play one round robin to crown the strongest '+thing+'.');
      continue;
    }
    const nextCount = full[i+1];
    const needed = nextCount*MEGA_ROBIN_SIZE;
    const base = Math.min(MEGA_ROBIN_SIZE, Math.floor(needed/count));
    const wildcard = needed - base*count;
    const roundLabel = (i===0) ? 'Round 1' : ('Round '+(i+1));
    const intro = (i===0)
      ? (roundLabel+': '+count+' round robins of '+MEGA_ROBIN_SIZE+' '+thingPlural+' each')
      : (roundLabel+': those '+(count*MEGA_ROBIN_SIZE).toLocaleString()+' reshuffle into '+count+' round robins of '+MEGA_ROBIN_SIZE);
    const advanceText = wildcard>0
      ? (' -- top '+base+' from each advance, plus '+wildcard+' wildcard'+(wildcard===1?'':'s')+'.')
      : (' -- top '+base+' from each advance.');
    parts.push(intro+advanceText);
  }
  return parts.join(' ');
}

      '<div class="card-sub">Every team\'s fixed lineup order and full stats</div>' +
    '</div>' +
    ranked.map((r,i)=>teamResultCardHtml(r, i+1)).join('');
}
// One bracket slot -- a seed number + its lead member's sprite, or "Bye" for the
// (at most one, only ever in round 1) empty side of a bye match.
function teamBracketSlotHtml(seedInfo, isWinner){
  if(!seedInfo) return '<div class="bracket-slot bracket-slot-tbd">Bye</div>';
  return '<div class="bracket-slot'+(isWinner?' bracket-slot-winner':' bracket-slot-loser')+'">' +
    spriteImgHtml(seedInfo.team.members[0].name,'bracket-sprite') + '<span>Seed '+seedInfo.seed+'</span>' +
  '</div>';
}
function teamBracketMatchHtml(match, seedByNumber){
  const aInfo = match.aSeed!=null ? seedByNumber[match.aSeed] : null;
  const bInfo = match.bSeed!=null ? seedByNumber[match.bSeed] : null;
  return '<div class="bracket-match">' +
    teamBracketSlotHtml(aInfo, match.winnerSeed===match.aSeed) +
    '<span class="bracket-vs">vs</span>' +
    teamBracketSlotHtml(bInfo, match.winnerSeed===match.bSeed) +
    (match.isBye ? '' : '<div class="bracket-log">'+esc(match.log[0])+'</div>') +
  '</div>';
}
// The completed Top-N seeded bracket: the tree (with seed numbers, byes, and results)
// plus a "Seeds" list below with every seed's full team roster.
function teamBracketScreenHtml(){
  const b = teamMegaRR.bracket;
  const seedByNumber = {};
  b.seeds.forEach(s=>{ seedByNumber[s.seed] = s; });

  const roundsHtml = b.rounds.map(round=>
    '<div class="bracket-round">' +
      '<div class="bracket-round-header"><span>'+round.label+'</span></div>' +
      '<div class="bracket-round-matches">' + round.matches.map(m=>teamBracketMatchHtml(m, seedByNumber)).join('') + '</div>' +
    '</div>'
  ).join('');

  const seedsHtml = '<div class="card"><div class="card-title">Seeds</div>' +
      '<div class="card-sub">Top '+b.seeds.length+' from the Championship round robin, seeded by record then differential ('+b.size+'-slot bracket, '+(b.size-b.seeds.length)+' bye'+((b.size-b.seeds.length)===1?'':'s')+')</div>' +
    '</div>' +
    b.seeds.map(s=>
      '<div class="card"><div class="card-title">Seed '+s.seed+'<span class="team-result-record">'+s.wins+'-'+s.losses+' ('+(s.diff>=0?'+':'')+s.diff+')</span></div>' +
        teamRosterHtml(s.team) +
      '</div>'
    ).join('');

  return '<div class="card"><div class="card-title">Bracket</div><div class="bracket-scroll">'+roundsHtml+'</div></div>' +
    seedsHtml;
}
function teamMegaResultsScreenHtml(){
  const champ = teamMegaChampion();
  const championHtml = '<div class="card champion-banner">' +
    '<div class="champion-title">\uD83C\uDFC6 Overall Champion Team</div>' +
    teamRosterHtml(champ) +
  '</div>';

  const hasBracket = !!teamMegaRR.bracket;
  const viewToggleHtml = hasBracket
    ? '<div class="tab-row" style="margin-bottom:10px;">' +
        '<button type="button" class="tab-btn'+(teamMegaView==='roundrobin'?' active':'')+'" data-action="setTeamMegaView" data-view="roundrobin">Round Robin Results</button>' +
        '<button type="button" class="tab-btn'+(teamMegaView==='bracket'?' active':'')+'" data-action="setTeamMegaView" data-view="bracket">Championship Bracket</button>' +
      '</div>'
    : '';

  if(hasBracket && teamMegaView==='bracket'){
    return championHtml + viewToggleHtml + teamBracketScreenHtml();
  }

  const roundOptions = teamMegaRR.rounds.map((rd,i)=>'<option value="'+i+'"'+(i===teamMegaSelection.round?' selected':'')+'>'+rd.label+'</option>').join('');
  const robinCount = teamMegaRR.rounds[teamMegaSelection.round].robins.length;
  const robinOptions = Array.from({length:robinCount}, (_,i)=>'<option value="'+i+'"'+(i===teamMegaSelection.robin?' selected':'')+'>Round Robin #'+(i+1)+'</option>').join('');
  const pickerHtml = '<div class="card">' +
    '<div class="field-label">Round</div>' +
    '<select class="mega-select" id="teamMegaRoundSelect">'+roundOptions+'</select>' +
    '<div class="field-label" style="margin-top:10px;">Round Robin</div>' +
    '<select class="mega-select" id="teamMegaRobinSelect">'+robinOptions+'</select>' +
  '</div>';

  const round = teamMegaRR.rounds[teamMegaSelection.round];
  const robin = round.robins[teamMegaSelection.robin];
  const ranked = rankTeamGroup(robin.teams, robin.stats);

  return championHtml + viewToggleHtml + pickerHtml + teamRrResultsBlockHtml(ranked, round.cutoff);
}
function championBannerHtml(){
  const e = tourney.entrants[tourney.championIdx];
  return '<div class="card champion-banner">' +
    '<div class="champion-title">\uD83C\uDFC6 Champion: '+esc(e.name)+'</div>' +
    monCardHtml(e) +
  '</div>';
}
function entrantSlotHtml(idx, isWinnerSlot, resolved){
  if(idx===null) return '<div class="bracket-slot bracket-slot-tbd">TBD</div>';
  const e = tourney.entrants[idx];
  const cls = resolved ? (isWinnerSlot ? ' bracket-slot-winner' : ' bracket-slot-loser') : '';
  return '<div class="bracket-slot'+cls+'">' + spriteImgHtml(e.name,'bracket-sprite') + '<span>'+esc(e.name)+'</span></div>';
}
function matchCardHtml(r, m){
  const match = tourney.rounds[r][m];
  const ready = match.aIdx!==null && match.bIdx!==null;
  const resolved = match.winnerIdx!==null;
  const isAnimating = !!(animatingMatch && animatingMatch.r===r && animatingMatch.m===m);

  let oddsHtml = '';
  if(ready && !resolved && !isAnimating){
    const A = tourney.entrants[match.aIdx], B = tourney.entrants[match.bIdx];
    const sdA = SPECIES_DATA[A.name], sdB = SPECIES_DATA[B.name];
    const odds = winOdds(finalStatsOf(A), [sdA.t1,sdA.t2], A.atk, finalStatsOf(B), [sdB.t1,sdB.t2], B.atk);
    oddsHtml = '<div class="bracket-odds">' + (odds.unbreakable ? 'Coin flip' : Math.round(odds.winA*100)+'% / '+Math.round(odds.winB*100)+'%') + '</div>';
  }

  let diceHtml = '';
  if(isAnimating){
    const diceCol = (prefix, n)=>{
      let out = '<div class="dice-group">';
      for(let i=0;i<n;i++) out += '<div class="die" id="'+prefix+i+'">--</div>';
      return out + '</div>';
    };
    diceHtml = '<div class="bracket-dice">' + diceCol('tDieA', animatingMatch.nA) + diceCol('tDieB', animatingMatch.nB) + '</div>';
  }

  let actionHtml = '';
  if(resolved){
    actionHtml = '<div class="bracket-log">'+esc(match.log[0]||'')+'</div>';
  } else if(ready && !isAnimating){
    actionHtml = '<button type="button" class="btn btn-primary bracket-sim-btn" data-action="simMatch" data-r="'+r+'" data-m="'+m+'">Simulate</button>';
  }

  return '<div class="bracket-match">' +
    entrantSlotHtml(match.aIdx, resolved && match.winnerIdx===match.aIdx, resolved) +
    '<span class="bracket-vs">vs</span>' +
    entrantSlotHtml(match.bIdx, resolved && match.winnerIdx===match.bIdx, resolved) +
    oddsHtml + diceHtml + actionHtml +
  '</div>';
}
function roundColumnHtml(r){
  const matches = tourney.rounds[r];
  const anyReady = matches.some(mm=>mm.winnerIdx===null && mm.aIdx!==null && mm.bIdx!==null);
  return '<div class="bracket-round">' +
    '<div class="bracket-round-header"><span>'+ROUND_LABELS[r]+'</span>' +
      (anyReady ? '<button type="button" class="btn" data-action="simRound" data-r="'+r+'">Simulate Round</button>' : '') +
    '</div>' +
    '<div class="bracket-round-matches">' + matches.map((mm,m)=>matchCardHtml(r,m)).join('') + '</div>' +
  '</div>';
}
function bracketScreenHtml(){
  const championHtml = tourney.championIdx!==null ? championBannerHtml() : '';
  return championHtml +
    '<div class="card"><div class="card-title">Bracket</div>' +
      '<div class="bracket-scroll">' + tourney.rounds.map((_,r)=>roundColumnHtml(r)).join('') + '</div>' +
    '</div>' +
    '<div class="card" style="text-align:center;"><button type="button" class="btn btn-danger" data-action="newTournament">New Tournament</button></div>';
}
function render(){
  const tabsHtml = '<div class="tab-row">' +
    '<button type="button" class="tab-btn'+(activeMode==='elimination'?' active':'')+'" data-action="setMode" data-mode="elimination">Elimination Bracket</button>' +
    '<button type="button" class="tab-btn'+(activeMode==='roundrobin'?' active':'')+'" data-action="setMode" data-mode="roundrobin">Round Robin</button>' +
    '<button type="button" class="tab-btn'+(activeMode==='megarr'?' active':'')+'" data-action="setMode" data-mode="megarr">Long Round Robin</button>' +
    '<button type="button" class="tab-btn'+(activeMode==='teammegarr'?' active':'')+'" data-action="setMode" data-mode="teammegarr">Long Team Round Robin</button>' +
  '</div>';
  let barHtml = '';
  let bodyHtml;
  if(activeMode==='roundrobin'){
    barHtml = settingsSectionHtml('roundrobin', 'generateRoundRobin', 'Simulate New Round Robin');
    bodyHtml = roundRobin ? roundRobinResultsHtml() : roundRobinGeneratorScreenHtml();
  } else if(activeMode==='megarr'){
    barHtml = megaProgress ? '' : settingsSectionHtml('megarr', 'generateMegaRR', 'Simulate New Long Round Robin');
    bodyHtml = megaProgress ? progressScreenHtml(megaProgress) : (megaRR ? megaResultsScreenHtml() : megaGeneratorScreenHtml());
  } else if(activeMode==='teammegarr'){
    barHtml = teamMegaProgress ? '' : settingsSectionHtml('teammegarr', 'generateTeamMegaRR', 'Simulate New Long Team Round Robin');
    bodyHtml = teamMegaProgress ? progressScreenHtml(teamMegaProgress) : (teamMegaRR ? teamMegaResultsScreenHtml() : teamMegaGeneratorScreenHtml());
  } else {
    barHtml = settingsSectionHtml('elimination', null, null);
    bodyHtml = tourney ? bracketScreenHtml() : generatorScreenHtml();
  }
  document.getElementById('app').innerHTML = tabsHtml + barHtml + bodyHtml;
}

/* ============ Event delegation ============ */
document.addEventListener('click', (ev)=>{
  const el = ev.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='toggleGlobalSetting'){
    const key = el.dataset.key;
    settings[key] = !settings[key];
    saveStore();
    render();
    return;
  }
  if(action==='toggleSettingsSection'){
    settingsCollapsed = !settingsCollapsed;
    render();
    return;
  }
  if(action==='setTeamMegaView'){
    teamMegaView = el.dataset.view;
    render();
    return;
  }
  if(action==='toggleBanCategory'){
    const cat = el.dataset.cat;
    settings.bannedCategories[cat] = !settings.bannedCategories[cat];
    saveStore();
    render();
    return;
  }
  if(action==='newTournament'){
    if(tournamentInProgress() && !confirm('Start a new tournament? This discards the current bracket.')) return;
    generateTournament();
    return;
  }
  if(action==='simMatch'){
    resolveMatch(parseInt(el.dataset.r,10), parseInt(el.dataset.m,10), true);
    return;
  }
  if(action==='simRound'){
    resolveRound(parseInt(el.dataset.r,10));
    return;
  }
  if(action==='setMode'){
    activeMode = el.dataset.mode;
    saveStore();
    render();
    return;
  }
  if(action==='generateRoundRobin'){
    if(roundRobin && !confirm('Start a new Round Robin? This discards the current results.')) return;
    generateRoundRobin();
    return;
  }
  if(action==='generateMegaRR'){
    if(megaRR && !confirm('Start a new Long Round Robin? This discards the current results and takes a few seconds to simulate.')) return;
    generateMegaRoundRobin();
    return;
  }
  if(action==='generateTeamMegaRR'){
    if(teamMegaRR && !confirm('Start a new Long Team Round Robin? This discards the current results and takes a while to simulate.')) return;
    generateTeamMegaRoundRobin();
    return;
  }
  if(action==='toggleStandings'){
    standingsCollapsed = !standingsCollapsed;
    render();
    return;
  }
});
document.addEventListener('change', (ev)=>{
  if(ev.target.id === 'megaRoundSelect'){
    megaSelection.round = parseInt(ev.target.value, 10);
    megaSelection.robin = 0;
    saveMegaStore();
    render();
  } else if(ev.target.id === 'megaRobinSelect'){
    megaSelection.robin = parseInt(ev.target.value, 10);
    saveMegaStore();
    render();
  } else if(ev.target.id === 'banRegionSelect'){
    settings.regionFilter = ev.target.value || null;
    saveStore();
    render();
  } else if(ev.target.id === 'teamMegaRoundSelect'){
    teamMegaSelection.round = parseInt(ev.target.value, 10);
    teamMegaSelection.robin = 0;
    saveTeamMegaStore();
    render();
  } else if(ev.target.id === 'teamMegaRobinSelect'){
    teamMegaSelection.robin = parseInt(ev.target.value, 10);
    saveTeamMegaStore();
    render();
  } else if(ev.target.id === 'megaRoundCountsInput'){
    settings.roundRobinCounts = sanitizeRoundCounts(parseRoundCountsInput(ev.target.value), settings.roundRobinCounts);
    saveStore();
    render();
  } else if(ev.target.id === 'teamMegaRoundCountsInput'){
    settings.teamRoundRobinCounts = sanitizeRoundCounts(parseRoundCountsInput(ev.target.value), settings.teamRoundRobinCounts);
    saveStore();
    render();
  } else if(ev.target.id === 'teamTopNInput'){
    const n = parseInt(ev.target.value, 10);
    settings.teamTopNBracket = (Number.isInteger(n) && n >= 2 && n <= 100) ? n : 0;
    saveStore();
    render();
  }
});

render();
</script>
</body>
</html>
