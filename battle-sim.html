<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pok&eacute;mon Adventure -- Battle Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --paper-deep:#E2D9C4;
    --ink:#1F2E3D;
    --redwood:#2F4538;
    --rust:#C4572E;
    --gold:#D9A441;
    --sage:#8AA399;
    --nogym-green:#5B8A4E;
    --elite-purple:#A98FC9;
    --line: rgba(31,46,61,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(196,87,46,0.07), transparent 40%),
      radial-gradient(circle at 85% 82%, rgba(47,69,56,0.08), transparent 45%),
      repeating-linear-gradient(0deg, transparent, transparent 38px, var(--line) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, var(--line) 39px);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 14px 80px;
  }
  .sheet{ width:100%; max-width: 720px; }
  .masthead{
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 4px 14px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 16px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 22px;
    color: var(--redwood);
  }
  .nav-link{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    color: var(--ink);
    text-decoration:none;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 6px 10px;
    background: var(--paper-deep);
  }
  .nav-link:hover{ background: var(--gold); }
  .status-strip{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .status-badges{
    background: var(--gold);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
    cursor:pointer;
  }
  .status-badges:hover{ background:#c4923a; }
  .badge-panel{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 12px;
    margin: -6px 0 16px;
  }
  .badge-panel-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge-box{
    width: 46px;
    height: 46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    border: 1.5px solid var(--ink);
    border-radius: 5px;
    letter-spacing:0.02em;
  }
  .status-turns{
    background: var(--sage);
    color: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 4px 9px;
    font-weight:600;
  }
  .reset-btn{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--ink);
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 5px 9px;
    cursor:pointer;
  }
  .status-slot{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .save-slot-card{
    position:relative;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .save-slot-card.save-slot-empty{ border-style:dashed; opacity:0.75; }
  .save-slot-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .save-slot-main{ flex:1; min-width:0; }
  .save-slot-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .save-slot-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--sage);
    margin-bottom: 8px;
  }
  .save-slot-team{
    flex-shrink:0;
    margin-top: -8px;
    margin-right: 30px;
    display:grid;
    grid-template-columns: repeat(3, 65px);
    grid-template-rows: repeat(2, 50px); /* shorter than the sprites -- rows
      overlap vertically since the art itself doesn't fill its box height */
    gap:0;
  }
  .save-slot-team img{ width:65px; height:65px; object-fit:contain; image-rendering:auto; transform: translateY(-20%); }
  .save-slot-delete-btn{
    position:absolute; top:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--rust);
    background:var(--paper);
    color:var(--rust);
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:13px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .save-slot-delete-btn:hover{ background:var(--rust); color:var(--paper); }
  .howtoplay-body{
    font-family:'Work Sans', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    margin-top: 14px;
  }
  .howtoplay-body p{ margin:0 0 12px; }
  .howtoplay-body p:last-child{ margin-bottom:0; }
  .tutorial-tip{
    background: var(--paper-deep);
    border: 1.5px dashed var(--gold);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-family:'Work Sans', sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  .tutorial-tip-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color: var(--rust);
    margin-bottom: 4px;
  }
  .reset-btn:hover{ background:#e8bdb0; }
  .card{
    background: var(--paper-deep);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .card-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    margin-bottom: 10px;
  }
  .opp-card-wrap{ position:relative; padding-right:120px; }
  .card-flavor{ font-size:13px; font-style:italic; color:#3c4f45; margin-bottom:10px; }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight:600;
    padding: 10px 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    cursor:pointer;
  }
  .btn:hover{ background: var(--gold); }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background: var(--gold); }
  .btn-primary:hover{ background:#c4923a; }
  .btn-wild{ background: var(--nogym-green); color:var(--paper); }
  .btn-wild:hover{ background:#4a7440; }
  .btn-danger{ background: var(--rust); color:var(--paper); }
  .btn-danger:hover{ background:#a8451f; }
  .choice-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .type-pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight:600;
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 10px;
    margin-right:4px;
  }
  .stat-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin: 8px 0;
  }
  .stat-chip{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
  }
  .stat-chip b{ color: var(--redwood); }
  .starter-grid{ display:grid; grid-template-columns: 1fr; gap:10px; }
  @media (min-width:560px){ .starter-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .starter-card{
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 12px;
    cursor:pointer;
    text-align:center;
  }
  .starter-card.selected{ border-color: var(--rust); background: #f3d9ce; }
  .starter-card h3{ font-family:'Fraunces', serif; margin: 6px 0 4px; }
  .town-grid{ display:flex; flex-wrap:wrap; gap:6px; max-height:220px; overflow-y:auto; margin-top:6px; padding:2px; }
  .town-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    cursor:pointer;
  }
  .town-btn.selected{ background: var(--gold); }
  .mon-detail-card{
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 10px 120px 10px 12px;
    margin-top: 10px;
    position: relative;
  }
  .mon-detail-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .sprite-lg{
    position:absolute;
    top:10px; right:12px;
    width:96px; height:96px;
    object-fit:contain;
    image-rendering:auto;
    transform: translateY(-20%); /* pokemondb icons sit low in their own box -- nudge up */
  }
  .trainer-type-block{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .trainer-type-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--sage);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .trainer-mon-types{ display:flex; gap:5px; }
  .trainer-atk-paren{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .trainer-type-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight:600;
    color:#fff;
    padding: 3px 9px;
    border-radius: 12px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .trainer-atk-pill{ box-shadow: 0 0 0 2px var(--gold); }
  .battle-type-pills{ display:flex; justify-content:center; gap:4px; margin-top:4px; }
  .battle-eff-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:700;
    color: var(--redwood);
    text-align:center;
    margin-top:3px;
  }
  .sprite-battle{ width:108px; height:108px; object-fit:contain; image-rendering:auto; transform: translateY(-20%); }
  .opp-team-row{ display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0 12px; }
  .opp-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 9px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .opp-chip.current{ background: var(--gold); font-weight:700; }
  .opp-chip.defeated{ opacity:0.45; text-decoration: line-through; }
  .e4-team-row{ display:flex; flex-wrap:wrap; gap:6px; margin: 8px 0 12px; }
  .e4-team-chip{
    display:flex; align-items:center; gap:3px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    white-space: nowrap;
    padding: 2px 7px 2px 3px;
    border-radius: 5px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }
  .e4-team-chip.current{ background: var(--gold); font-weight:700; }
  /* Smaller than the usual .sprite-sm so all 6 possible team members -- the max
     under the Elite Four's 6-Pokemon limit -- fit on one row instead of wrapping. */
  .e4-team-chip img{ width:22px; height:22px; }
  .team-export-box{
    width:100%;
    min-height:140px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    resize:vertical;
    box-sizing:border-box;
  }
  .log-box{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    max-height: 220px;
    overflow-y:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin-top: 10px;
  }
  .log-line{ padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log-line:last-child{ border-bottom:none; }
  .empty-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--sage);
    text-align:center;
    padding: 12px 0;
  }
  .field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--redwood);
    display:block;
    margin: 10px 0 4px;
  }
  .dice-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin: 14px 0 4px;
  }
  .dice-group{ display:flex; gap:8px; }
  .dice-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--sage);
    text-align:center;
    margin-bottom:6px;
  }
  .dice-side{ display:flex; flex-direction:column; align-items:center; }
  .die{
    min-width:44px; height:44px;
    padding: 0 5px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight:600;
    font-variant-numeric: tabular-nums;
  }
  .die.rolling{ animation: dieTumble .09s linear infinite; }
  .die.die-kept{
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
  }
  @keyframes dieTumble{
    0%{ transform: rotate(0deg) scale(1); }
    50%{ transform: rotate(8deg) scale(1.05); }
    100%{ transform: rotate(-6deg) scale(1); }
  }
  .vs-label{
    font-family:'Fraunces', serif;
    font-size:18px;
    color: var(--redwood);
    align-self:center;
    margin-top: 18px;
  }
  .map-legend{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-legend span{ display:flex; align-items:center; gap:5px; }
  .legend-swatch{ display:inline-block; width:11px; height:11px; }
  .legend-town{ background: var(--gold); border: 1.5px solid var(--ink); }
  .legend-town-nogym{ background: var(--nogym-green); border: 1.5px solid var(--ink); }
  .legend-dungeon{
    width:0; height:0;
    background: transparent;
    border-left: 5.5px solid transparent;
    border-right: 5.5px solid transparent;
    border-bottom: 10px solid var(--rust);
  }
  .legend-route{ background: var(--sage); border: 1.5px solid var(--ink); border-radius:50%; }
  .legend-elite{ background: var(--elite-purple); border: 1.5px solid var(--ink); }
  .map-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    -webkit-overflow-scrolling: touch;
  }
  #mapSvg{ display:block; }
  .map-node{ cursor:pointer; }
  .map-node-shape{
    stroke: var(--ink);
    stroke-width: 1.5;
    transition: stroke-width .12s ease, filter .12s ease;
  }
  .map-node:hover .map-node-shape{ stroke-width: 2.5; }
  .map-node.player-here .map-node-shape{
    stroke: var(--rust);
    stroke-width: 3.5;
    filter: drop-shadow(0 0 4px var(--rust));
  }
  .map-node.can-move .map-node-shape{
    stroke: var(--gold);
    stroke-width: 3;
    filter: drop-shadow(0 0 5px var(--gold));
  }
  .map-node.can-move{ cursor:pointer; }
  .map-node.selected .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  /* Static (non-interactive) map preview -- used by the Custom Region generator,
     which has no player position or click behavior to wire up yet. */
  .map-node-static .map-node-shape{ stroke: var(--ink); stroke-width: 1.5; }
  .map-node-central .map-node-shape{
    stroke: var(--ink);
    stroke-width: 3.5;
    stroke-dasharray: 2.5,2;
  }
  .map-node-label{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    pointer-events:none;
    fill: var(--ink);
  }
  .map-node-label-light{ fill: var(--paper); }
  .map-node-divider{
    stroke: var(--ink);
    stroke-width: 1.5;
    pointer-events:none;
  }
  .map-edge{
    stroke: var(--ink);
    stroke-width: 1.5;
    opacity: 0.35;
  }
  .map-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--redwood);
    margin-top: 8px;
    min-height: 16px;
  }
  .map-info{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1.5px dashed var(--ink);
    min-height: 50px;
  }
  .map-info-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--sage);
    text-align:center;
  }
  .map-info-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 18px;
    margin-bottom:4px;
  }
  .map-info-kind{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-bottom: 8px;
  }
  .map-info-desc{
    font-size: 13px;
    line-height:1.5;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .map-info-evo{
    font-size: 12.5px;
    line-height:1.5;
    color: var(--ink);
    background: rgba(201, 162, 39, 0.16);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 7px 9px;
    margin-bottom: 10px;
  }
  .map-go-btn{
    padding: 9px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight:600;
    background: var(--rust);
    color: var(--paper);
    border:none;
    border-radius: 4px;
    cursor:pointer;
    margin-bottom: 10px;
  }
  .map-go-btn:hover{ background:#a9481f; }
  .map-encounter-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color: var(--redwood);
    margin-top: 10px;
    margin-bottom: 7px;
  }
  .map-encounter-list{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .map-encounter-row{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 8px;
  }
  .map-encounter-sum{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size: 11px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 3px;
    width: 18px;
    height: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .map-encounter-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 13px;
    flex: 1;
  }
  .map-encounter-types{ display:flex; gap:4px; }
  .sprite-sm{ width:36px; height:36px; object-fit:contain; image-rendering:auto; flex-shrink:0; transform: translateY(-20%); }
  .tab-row{ display:flex; gap:6px; margin-bottom:16px; }
  .tab-btn{
    flex:1; min-width:0; padding:9px 4px;
    font-family:'Fraunces', serif; font-weight:600; font-size:14px; line-height:1.15;
    text-align:center; background:var(--paper); color:var(--ink);
    border:1.5px solid var(--ink); border-radius:4px; cursor:pointer;
  }
  @media (max-width:560px){ .tab-btn{ font-size:11.5px; padding:8px 2px; } }
  .tab-btn.active{ background:var(--redwood); color:var(--paper); border-color:var(--redwood); }
  /* Elite Four / Champion roster preview -- more tabs than fit at flex:1, so these
     keep their natural width and the row scrolls horizontally instead of squeezing. */

  .tab-row-scroll .tab-btn{ flex:0 0 auto; padding:8px 12px; }
  /* TM attack-type picker -- a little 5-slice strip of the wheel centered on the
     Pokemon's current attack type, plus its own type(s) as a separate shortcut row. */
  .tm-wheel-row{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; margin:10px 0; }
  .tm-type-btn, .tm-wheel-current{
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:#fff;
    text-transform:uppercase; letter-spacing:0.03em; border-radius:6px;
    padding:10px 13px; text-align:center; text-shadow:0 1px 1px rgba(0,0,0,0.25);
  }
  .tm-type-btn{ border:none; cursor:pointer; }
  .tm-type-btn:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .tm-wheel-current{ opacity:0.55; }
  .tm-wheel-current-label{ font-size:8px; letter-spacing:0.05em; margin-top:1px; font-weight:500; }
  .tm-wheel-link{ color:var(--sage); font-size:15px; }
  .tm-truetype-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .dex-type-btn{ opacity:0.55; }
  .dex-type-btn.active{ opacity:1; outline:2.5px solid var(--ink); outline-offset:-2.5px; }
  .field{ margin-bottom:14px; }
  .dex-search{
    width:100%; font-family:'Work Sans', sans-serif; font-size:15px;
    padding:10px 12px; background:var(--paper); border:1.5px solid var(--ink);
    border-radius:2px; color:var(--ink);
  }
  .dex-count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--sage); margin:10px 0 4px; }
  .seed-code{
    font-family:'IBM Plex Mono', monospace; font-weight:700;
    background:var(--paper-deep); border:1px solid var(--line); border-radius:3px;
    padding:1px 6px; letter-spacing:0.03em;
  }
  .dex-evo-line{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink); line-height:1.5; }
  .dex-evo-line b{ color:var(--rust); }
  .dex-loc-line{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--redwood);
    line-height:1.5; margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);
  }

    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--rust);

  .team-slot-main{ flex:1; min-width:0; }
  .team-slot-name{ font-family:'Fraunces', serif; font-weight:700; font-size:14px; }

  .ev-row-label{ width:38px; flex-shrink:0; color:var(--redwood); font-weight:600; }
  .ev-row-base{ width:34px; flex-shrink:0; color:var(--sage); text-align:right; }
  .ev-stepper{ display:flex; align-items:center; gap:6px; }
  .ev-stepper-btn{ width:24px; height:24px; border:1.5px solid var(--ink); border-radius:4px; background:var(--paper); cursor:pointer; font-weight:700; line-height:1; }

  .ev-remaining{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; margin:10px 0 4px; padding:6px 9px; border-radius:5px; background:var(--paper); border:1px solid var(--line); }

/* ============ Battle math -- identical rules to play.html's fight() engine:
   dice-per-side from type effectiveness, STAB baked into every die face,
   ties reroll, an unbreakable matchup (or an astronomically unlucky 300-round
   streak) is settled by a coin flip rather than silently favoring one side. ============ */
function effectiveness(atkType, defType1, defType2){
  const row = TYPE_CHART[atkType] || {};
  let m = (row[defType1] ?? 1);
  if(defType2) m *= (row[defType2] ?? 1);
  return m;
}
function diceConfig(mult){
  if(mult >= 4) return {n:3, mode:'best', label:'4\u00d7 doubly super effective'};
  if(mult === 2) return {n:2, mode:'best', label:'2\u00d7 super effective'};
  if(mult === 1) return {n:1, mode:'single', label:'1\u00d7 normal'};
  if(mult === 0.5) return {n:2, mode:'worst', label:'0.5\u00d7 not very effective'};
  if(mult === 0.25) return {n:3, mode:'worst', label:'0.25\u00d7 doubly resisted'};
  return {n:3, mode:'worst', label:'0\u00d7 immune'};
}
function rollSide(finalStats, cfg, stabBonus){
  const picks = [];
  let kept = null, keptIdx = 0;
  for(let i=0;i<cfg.n;i++){
    const idx = Math.floor(Math.random()*6);
    const val = finalStats[idx];
    picks.push(val + stabBonus);
    if(kept===null || (cfg.mode==='worst' ? val<kept : val>kept)){
      kept = val;
      keptIdx = i;
    }
  }
  return { picks, keptIdx, kept, final: kept + stabBonus };
}
function resultDistribution(finalStats, cfg, stabBonus){
  const n = cfg.n;
  const counts = new Map();
  const total = Math.pow(6, n);
  function rec(depth, kept){
    if(depth === n){
      const v = kept + stabBonus;
      counts.set(v, (counts.get(v)||0) + 1);
      return;
    }
    for(let i=0;i<6;i++){
      const val = finalStats[i];
      const nextKept = (kept === null) ? val
        : (cfg.mode === 'worst' ? Math.min(kept, val) : Math.max(kept, val));
      rec(depth+1, nextKept);
    }
  }
  rec(0, null);
  const dist = new Map();
  for(const [v,c] of counts) dist.set(v, c/total);
  return dist;
}
function crossOdds(distA, distB){
  let winA=0, winB=0, tie=0;
  for(const [a,pa] of distA){
    for(const [b,pb] of distB){
      const p = pa*pb;
      if(a>b) winA += p;
      else if(b>a) winB += p;
      else tie += p;
    }
  }
  const decided = winA + winB;
  if(decided <= 1e-12) return {winA:0, winB:0, unbreakable:true};
  return {winA: winA/decided, winB: winB/decided, unbreakable:false};
}
function stabBonusValue(){ return settings.strongerStab ? 1 : 0.5; }

  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? stabBonusValue() : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? stabBonusValue() : 0;
  return crossOdds(resultDistribution(statsA, cfgA, stabA), resultDistribution(statsB, cfgB, stabB));
}
async function tumble(el, durationMs, possibleValues, finalFace){
  if(!el) return;
  el.classList.add('rolling');
  const steps = Math.max(1, Math.round(durationMs/85));
  for(let i=0;i<steps-1;i++){
    el.textContent = Math.floor(possibleValues[Math.floor(Math.random()*possibleValues.length)]);
    await sleep(85);
  }
  el.textContent = Math.floor(finalFace);
  el.classList.remove('rolling');
  await sleep(85);
}

/* ============ Team-builder text import -- parses exactly the format already
   produced by play.html's "50-Turn Team Builder" export (teamBuilderMonExportText),
   so a team built during a real adventure can be pasted straight in. ============ */
// Returns entries in 3 buckets: mons (EV total already <= 12, ready to add directly),
// needsTrim (EV total over 12 -- e.g. a real Adventure Pokemon well past Level 12 --
// which the caller must walk through an interactive trim-down before adding), and
// errors (genuinely unparseable/invalid entries, skipped entirely).
function parseImportText(text){
  const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const mons = [];
  const needsTrim = [];
  const errors = [];
  blocks.forEach(block=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    const head = lines[0] || '';
    const m = head.match(/^(.+?)\s+Lv\s*(\d+)$/i);
    if(!m){ errors.push('Could not read a name/level line: "'+head+'"'); return; }
    const name = m[1].trim();
    const sd = SPECIES_DATA[name];
    if(!sd){ errors.push(name+': not a recognized species'); return; }
    const atkLine = lines.find(l=>/^Attack:/i.test(l));
    const atk = atkLine ? atkLine.replace(/^Attack:\s*/i,'').trim() : null;
    if(!atk || !TYPE_CHART[atk]){ errors.push(name+': missing or unrecognized Attack type'); return; }
    const statLine = lines.find(l=>/^HP\s/i.test(l));
    if(!statLine){ errors.push(name+': missing stat line'); return; }
    const nums = statLine.match(/-?\d+/g);
    if(!nums || nums.length < 6){ errors.push(name+': could not read all 6 stats'); return; }
    const finalStats = nums.slice(0,6).map(Number);
    const ev = finalStats.map((v,i)=>v - sd.base[i]);
    if(ev.some(v=>v<0)){ errors.push(name+': stats are lower than its base stats'); return; }
    if(statTotal(ev) > TEAM_EV_TOTAL){ needsTrim.push({ name, ev, atk }); }
    else { mons.push({ name, ev, atk }); }
  });
  return { mons, needsTrim, errors };
}

async function fightExchange(){
  if(rollingBattle || !battle || battle.picking || battle.over) return;
  const side1 = 'A', side2 = 'B';
  const monA = battle.mons.A[battle.activeIdx.A];
  const monB = battle.mons.B[battle.activeIdx.B];
  const sdA = SPECIES_DATA[monA.name], sdB = SPECIES_DATA[monB.name];
  const statsA = finalStatsOf(monA), statsB = finalStatsOf(monB);
  const typesA = [sdA.t1, sdA.t2], typesB = [sdB.t1, sdB.t2];
  const atkA = monA.atk, atkB = monB.atk;
  const cfgA = diceConfig(effectiveness(atkA, typesB[0], typesB[1]));
  const cfgB = diceConfig(effectiveness(atkB, typesA[0], typesA[1]));
  const stabA = (atkA===typesA[0] || atkA===typesA[1]) ? stabBonusValue() : 0;
  const stabB = (atkB===typesB[0] || atkB===typesB[1]) ? stabBonusValue() : 0;
  const displayStatsA = stabA ? statsA.map(v=>v+stabA) : statsA;
  const displayStatsB = stabB ? statsB.map(v=>v+stabB) : statsB;
  const preOdds = winOdds(statsA, typesA, atkA, statsB, typesB, atkB);

  let rA, rB, roundNum = 0, animate = true;
  do {
    roundNum++;
    rA = rollSide(statsA, cfgA, stabA);
    rB = rollSide(statsB, cfgB, stabB);
    if(animate){
      rollingBattle = { nA: cfgA.n, nB: cfgB.n };
      render();
      await Promise.all([
        ...rA.picks.map((face,i)=>tumble(document.getElementById('simDieA'+i), 600, displayStatsA, face)),
        ...rB.picks.map((face,i)=>tumble(document.getElementById('simDieB'+i), 600, displayStatsB, face)),
      ]);
      const dieA = document.getElementById('simDieA'+rA.keptIdx);
      const dieB = document.getElementById('simDieB'+rB.keptIdx);
      if(dieA) dieA.classList.add('die-kept');
      if(dieB) dieB.classList.add('die-kept');
      await sleep(600);
      if(roundNum >= 8) animate = false;
    }
  } while(rA.final === rB.final && !preOdds.unbreakable && roundNum < 300);
  rollingBattle = null;

  const coinFlipped = rA.final === rB.final;
  if(coinFlipped){
    battle.log.push(monA.name+' and '+monB.name+' are perfectly matched -- every roll ties, so this exchange was decided by a coin flip.');
  }
  const winnerIsA = coinFlipped ? Math.random() < 0.5 : (rA.final > rB.final);
  battle.log.push(monA.name+' ('+Math.floor(rA.final)+') vs '+monB.name+' ('+Math.floor(rB.final)+') -- '+(winnerIsA?monA.name:monB.name)+' wins the exchange!');

  const loserSide = winnerIsA ? 'B' : 'A';
  const loserMon = winnerIsA ? monB : monA;
  loserMon.fainted = true;
  battle.log.push(loserMon.name+' is knocked out!');

  const loserAlive = aliveMons(loserSide);
  if(!loserAlive.length){
    battle.over = winnerIsA ? 'A' : 'B';
  } else {
    battle.activeIdx[loserSide] = null;
    battle.picking = loserSide;
  }
  render();
}

/* ============ Event delegation ============ */
function render(){
  document.getElementById('app').innerHTML = battle ? battleScreenHtml() : builderScreenHtml();
  const searchInput = document.getElementById('speciesSearchInput');
  if(searchInput){
    searchInput.focus();
    const v = searchInput.value;
    searchInput.setSelectionRange(v.length, v.length);
  }
}

function openEditor(side, index){
  const existing = teams[side][index];
  editor = existing
    ? { side, index, species: existing.name, ev: existing.ev.slice(), atk: existing.atk }
    : { side, index, species: null, ev: [0,0,0,0,0,0], atk: null };
  speciesQuery = '';
  render();
}

document.addEventListener('click', (ev)=>{
  const el = ev.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const side = el.dataset.side;
  const index = el.dataset.index !== undefined ? parseInt(el.dataset.index,10) : null;

  if(action==='openEditor'){ openEditor(side, index); return; }
  if(action==='closeEditor'){ editor = null; render(); return; }
  if(action==='clearSpecies'){ editor.species = null; editor.ev=[0,0,0,0,0,0]; editor.atk = null; speciesQuery=''; render(); return; }
  if(action==='selectSpecies'){
    const name = el.dataset.name;
    const sd = SPECIES_DATA[name];
    editor.species = name;
    editor.ev = [0,0,0,0,0,0];
    editor.atk = sd.t1;
    render();
    return;
  }
  if(action==='evStep'){
    const i = parseInt(el.dataset.i,10);
    const delta = parseInt(el.dataset.delta,10);
    const remaining = TEAM_EV_TOTAL - statTotal(editor.ev);
    if(delta>0 && remaining<=0) return;
    const next = editor.ev[i] + delta;
    if(next < 0) return;
    editor.ev[i] = next;
    render();
    return;
  }
  if(action==='saveMon'){
    const total = statTotal(editor.ev);
    if(total > TEAM_EV_TOTAL) return;
    const mon = { name: editor.species, ev: editor.ev.slice(), atk: editor.atk };
    teams[editor.side][editor.index] = mon;
    saveStore();
    editor = null;
    render();
    return;
  }
  if(action==='removeMon'){
    teams[side].splice(index, 1);
    saveStore();
    render();
    return;
  }
  if(action==='toggleStab'){
    settings.strongerStab = !settings.strongerStab;
    saveStore();
    render();
    return;
  }
  if(action==='openImport'){ importSide = side; importDraft = ''; importErrors = []; render(); return; }
  if(action==='closeImport'){ importSide = null; importDraft = ''; importErrors = []; render(); return; }
  if(action==='applyImport'){
    const ta = document.getElementById('importTextArea');
    const text = ta ? ta.value : '';
    const { mons, needsTrim, errors } = parseImportText(text);
    importErrors = errors;
    const accepted = mons.slice(0, 6);
    const trimSlots = Math.max(0, 6 - accepted.length);
    const queue = needsTrim.slice(0, trimSlots);
    if(queue.length){
      // At least one imported Pokemon is over the 12-EV cap (e.g. a real Adventure
      // Pokemon well past Level 12) -- route to the trim flow instead of the team
      // screen; teams[side] isn't touched until every over-cap entry is resolved.
      trimSide = side;
      trimAccepted = accepted;
      trimTotal = queue.length;
      trimCurrent = { name: queue[0].name, ev: queue[0].ev.slice(), atk: queue[0].atk };
      trimQueue = queue.slice(1);
      importSide = null;
      importDraft = '';
      render();
      return;
    }
    if(accepted.length){
      teams[side] = accepted;
      saveStore();
    }
    if(errors.length){
      // Keep the box open (with the pasted text preserved) so the skipped entries are visible,
      // instead of closing immediately and discarding the warning on the very next render.
      importDraft = text;
      render();
      return;
    }
    importSide = null;
    importDraft = '';
    render();
    return;
  }
  if(action==='trimEvStep'){
    const i = parseInt(el.dataset.i,10);
    if(trimCurrent.ev[i] > 0) trimCurrent.ev[i] -= 1;
    render();
    return;
  }
  if(action==='confirmTrim'){
    if(statTotal(trimCurrent.ev) > TEAM_EV_TOTAL) return;
    trimAccepted.push({ name: trimCurrent.name, ev: trimCurrent.ev.slice(), atk: trimCurrent.atk });
    if(trimQueue.length){
      const next = trimQueue.shift();
      trimCurrent = { name: next.name, ev: next.ev.slice(), atk: next.atk };
    } else {
      teams[trimSide] = trimAccepted.slice(0, 6);
      saveStore();
      trimCurrent = null;
      trimSide = null;
      trimAccepted = [];
      trimTotal = 0;
    }
    render();
    return;
  }
  if(action==='cancelTrimImport'){
    trimCurrent = null;
    trimQueue = [];
    trimSide = null;
    trimAccepted = [];
    trimTotal = 0;
    render();
    return;
  }
  if(action==='startBattle'){ startBattle(); return; }
  if(action==='pickLead'){
    battle.activeIdx[side] = index;
    if(battle.activeIdx.A !== null && battle.activeIdx.B !== null){
      battle.picking = null;
    } else {
      battle.picking = side==='A' ? 'B' : 'A';
    }
    render();
    return;
  }
  if(action==='fightExchange'){ fightExchange(); return; }
  if(action==='editTeams'){ battle = null; render(); return; }
  if(action==='rematch'){
    battle.mons.A.forEach(m=>m.fainted=false);
    battle.mons.B.forEach(m=>m.fainted=false);
    battle.activeIdx = { A:null, B:null };
    battle.picking = 'A';
    battle.log = [];
    battle.over = null;
    render();
    return;
  }
});
document.addEventListener('input', (ev)=>{
  if(ev.target.id === 'speciesSearchInput'){
    speciesQuery = ev.target.value;
    render();
  }
});
document.addEventListener('change', (ev)=>{
  if(ev.target.id === 'atkSelect'){
    editor.atk = ev.target.value;
    render();
  }
});

render();
</script>
</body>
</html>
